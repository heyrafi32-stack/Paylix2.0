<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paylix 2.0 - Premium Micro-Tasking Platform</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                            accent: '#6366f1'
                        },
                        darkbg: '#0f172a',
                        darkcard: '#1e293b',
                        darkborder: '#334155'
                    },
                    fontFamily: {
                        sans: ['Inter', 'Hind Siliguri', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Firebase SDK Compat v9 -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: 'Inter', 'Hind Siliguri', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-panel-light {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .gradient-card {
            background: linear-gradient(135deg, #059669 0%, #0d9488 50%, #4f46e5 100%);
        }
        .pulse-glow {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.35);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-brand-500 selection:text-white flex justify-center items-start">

    <!-- TOAST NOTIFICATION -->
    <div id="toastContainer" class="fixed top-4 z-50 left-1/2 -translate-x-1/2 w-11/12 max-w-sm pointer-events-none flex flex-col space-y-2"></div>

    <!-- MAIN APP MOBILE WRAPPER -->
    <div id="appContainer" class="w-full max-w-md min-h-screen bg-slate-900 border-x border-slate-800 relative flex flex-col justify-between shadow-2xl pb-20">

        <!-- GLOBAL TOP HEADER -->
        <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 p-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-teal-400 flex items-center justify-center text-white text-xl font-black shadow-lg shadow-brand-500/20">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-1.5">
                        <h1 class="font-black text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-brand-400 bg-clip-text text-transparent">Paylix</h1>
                        <span class="bg-brand-500/20 text-brand-400 border border-brand-500/30 text-[10px] font-extrabold px-1.5 py-0.5 rounded-md">2.0 LIVE</span>
                    </div>
                    <p class="text-[10px] text-slate-400">স্মার্ট আর্নিং প্ল্যাটফর্ম</p>
                </div>
            </div>

            <div id="headerActions" class="flex items-center space-x-2">
                <!-- Dynamically populated -->
            </div>
        </header>

        <!-- MAIN ROUTED VIEW AREA -->
        <main id="mainView" class="flex-1 p-4 overflow-y-auto">
            <!-- Dynamic Content Load -->
        </main>

        <!-- BOTTOM NAVIGATION BAR -->
        <nav id="bottomNav" class="hidden fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-slate-900/90 backdrop-blur-lg border-t border-slate-800/80 px-4 py-2.5 z-40 flex justify-around items-center">
            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center text-brand-400 transition-all">
                <i class="fa-solid fa-house-crack text-lg mb-0.5"></i>
                <span class="text-[10px] font-bold">হোম</span>
            </button>
            <button onclick="switchTab('gmail')" id="nav-gmail" class="flex flex-col items-center text-slate-400 hover:text-brand-400 transition-all">
                <i class="fa-solid fa-paper-plane text-lg mb-0.5"></i>
                <span class="text-[10px] font-bold">জিমেইল সেল</span>
            </button>
            <button onclick="switchTab('tasks')" id="nav-tasks" class="flex flex-col items-center text-slate-400 hover:text-brand-400 transition-all">
                <i class="fa-solid fa-list-check text-lg mb-0.5"></i>
                <span class="text-[10px] font-bold">টাস্ক</span>
            </button>
            <button onclick="switchTab('withdraw')" id="nav-withdraw" class="flex flex-col items-center text-slate-400 hover:text-brand-400 transition-all">
                <i class="fa-solid fa-wallet text-lg mb-0.5"></i>
                <span class="text-[10px] font-bold">উইথড্র</span>
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-slate-400 hover:text-brand-400 transition-all">
                <i class="fa-solid fa-circle-user text-lg mb-0.5"></i>
                <span class="text-[10px] font-bold">প্রোফাইল</span>
            </button>
        </nav>

    </div>

    <!-- APPLICATION SCRIPT LOGIC -->
    <script>
        // FIREBASE INITIALIZATION WITH YOUR EXACT CREDENTIALS
        const firebaseConfig = {
            apiKey: "AIzaSyAtY87cMTIiJyXtpflfLiLfZfa7WX1g9Mg",
            authDomain: "paylix-586b1.firebaseapp.com",
            projectId: "paylix-586b1",
            storageBucket: "paylix-586b1.firebasestorage.app",
            messagingSenderId: "353074453470",
            appId: "1:353074453470:web:026fc4a6768eb6d9499b4f",
            databaseURL: "https://paylix-586b1-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // APP STATE
        let currentUser = JSON.parse(localStorage.getItem('paylix_session_v2')) || null;
        let currentTab = 'dashboard';
        let allUsersCache = {};
        let allGmailsCache = {};
        let allWithdrawsCache = {};

        // TOAST ENGINE
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const isSuccess = type === 'success';
            toast.className = `pointer-events-auto p-3.5 rounded-2xl shadow-xl flex items-center space-x-3 text-xs font-semibold text-white border transition-all duration-300 transform translate-y-2 opacity-0 ${
                isSuccess ? 'bg-slate-800/90 border-brand-500/40 text-emerald-300' : 'bg-slate-800/90 border-rose-500/40 text-rose-300'
            }`;
            toast.innerHTML = `
                <div class="w-6 h-6 rounded-xl flex items-center justify-center shrink-0 ${isSuccess ? 'bg-brand-500/20 text-brand-400' : 'bg-rose-500/20 text-rose-400'}">
                    <i class="fa-solid ${isSuccess ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i>
                </div>
                <span>${msg}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // INITIAL ROUTING & DATA LISTENERS
        window.addEventListener('DOMContentLoaded', () => {
            initFirebaseListeners();
            handleRoute();
        });

        window.addEventListener('hashchange', handleRoute);

        function handleRoute() {
            const hash = window.location.hash;
            if (hash === '#admin') {
                renderAdminLogin();
            } else if (hash === '#admin-dashboard') {
                renderAdminDashboard();
            } else if (!currentUser) {
                renderAuthView();
            } else {
                renderUserApp();
            }
        }

        function initFirebaseListeners() {
            // Live Realtime Database Listeners
            db.ref('users').on('value', (snap) => {
                allUsersCache = snap.val() || {};
                if (currentUser && allUsersCache[currentUser.phone]) {
                    currentUser = allUsersCache[currentUser.phone];
                    localStorage.setItem('paylix_session_v2', JSON.stringify(currentUser));
                    if (['dashboard', 'profile'].includes(currentTab)) {
                        renderTabContent();
                    }
                }
                if (window.location.hash === '#admin-dashboard') {
                    renderAdminDashboard();
                }
            });

            db.ref('gmailSubmissions').on('value', (snap) => {
                allGmailsCache = snap.val() || {};
                if (currentTab === 'gmail') renderTabContent();
                if (window.location.hash === '#admin-dashboard') renderAdminDashboard();
            });

            db.ref('withdrawRequests').on('value', (snap) => {
                allWithdrawsCache = snap.val() || {};
                if (window.location.hash === '#admin-dashboard') renderAdminDashboard();
            });
        }

        // AUTH VIEWS
        function renderAuthView(isSignup = false) {
            document.getElementById('bottomNav').classList.add('hidden');
            document.getElementById('headerActions').innerHTML = `
                <a href="#admin" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl border border-slate-700 font-medium transition">
                    <i class="fa-solid fa-shield-halved text-brand-400 mr-1"></i>অ্যাডমিন
                </a>
            `;

            document.getElementById('mainView').innerHTML = `
                <div class="py-6 space-y-6">
                    <div class="text-center space-y-2">
                        <div class="w-16 h-16 bg-gradient-to-tr from-brand-600 via-teal-500 to-indigo-600 rounded-3xl mx-auto flex items-center justify-center text-3xl text-white shadow-xl shadow-brand-500/20">
                            <i class="fa-solid fa-shield-cat"></i>
                        </div>
                        <h2 class="text-2xl font-extrabold text-white">${isSignup ? 'নতুন অ্যাকাউন্ট খুলুন' : 'লগইন করুন'}</h2>
                        <p class="text-xs text-slate-400">Paylix 2.0 এর সাথে শুরু করুন সহজ ইনকাম</p>
                    </div>

                    <div class="glass-panel p-6 rounded-3xl space-y-4 border border-slate-800">
                        ${isSignup ? `
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1.5">আপনার নাম</label>
                                <input type="text" id="authName" placeholder="পূর্ণ নাম লিখুন" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl px-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 transition">
                            </div>
                        ` : ''}
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1.5">মোবাইল নম্বর</label>
                            <input type="tel" id="authPhone" placeholder="01XXXXXXXXX" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl px-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1.5">পাসওয়ার্ড</label>
                            <div class="relative">
                                <input type="password" id="authPass" placeholder="••••••••" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl px-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 transition">
                                <button onclick="togglePassVisibility('authPass')" class="absolute right-4 top-3.5 text-slate-500 text-xs">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        ${isSignup ? `
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1.5">রেফারেল কোড (ঐচ্ছিক)</label>
                                <input type="text" id="authRef" placeholder="রেফার কোড থাকলে দিন" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl px-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 transition">
                            </div>
                        ` : ''}

                        <button onclick="${isSignup ? 'handleSignup()' : 'handleUserLogin()'}" class="w-full bg-gradient-to-r from-brand-600 to-teal-600 hover:from-brand-500 hover:to-teal-500 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-brand-500/25 text-xs tracking-wide transition transform active:scale-95">
                            ${isSignup ? 'সাইন আপ অ্যাকাউন্ট' : 'লগইন করুন'}
                        </button>

                        <div class="text-center pt-2">
                            <button onclick="renderAuthView(${!isSignup})" class="text-xs text-brand-400 font-medium hover:underline">
                                ${isSignup ? 'ইতিমধ্যে অ্যাকাউন্ট আছে? লগইন করুন' : 'নতুন একাউন্ট করতে চান? সাইন আপ'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function togglePassVisibility(id) {
            const input = document.getElementById(id);
            if (input) {
                input.type = input.type === 'password' ? 'text' : 'password';
            }
        }

        // USER AUTHENTICATION HANDLERS
        async function handleSignup() {
            const name = document.getElementById('authName').value.trim();
            const phone = document.getElementById('authPhone').value.trim();
            const pass = document.getElementById('authPass').value.trim();
            const refCode = document.getElementById('authRef').value.trim();

            if (!name || !phone || !pass) return showToast('সবগুলো ফিল্ড পূরণ করুন!', 'error');
            if (phone.length < 11) return showToast('১১ ডিজিটের মোবাইল নম্বর দিন!', 'error');

            // Check existing user
            const userSnap = await db.ref('users/' + phone).once('value');
            if (userSnap.exists()) return showToast('এই নম্বরে ইতিমধ্যে অ্যাকাউন্ট আছে!', 'error');

            let referrerPhone = null;
            if (refCode) {
                for (let p in allUsersCache) {
                    if (allUsersCache[p].myRefCode === refCode) {
                        referrerPhone = p;
                        break;
                    }
                }
            }

            const newUser = {
                name: name,
                phone: phone,
                password: pass,
                balance: 0,
                totalEarned: 0,
                referralEarnings: 0,
                myRefCode: 'PLX-' + Math.floor(10000 + Math.random() * 90000),
                referredBy: referrerPhone || '',
                createdAt: new Date().toISOString()
            };

            // SAFE SET IN FIREBASE
            await db.ref('users/' + phone).set(newUser);

            if (referrerPhone && allUsersCache[referrerPhone]) {
                const rUser = allUsersCache[referrerPhone];
                const updatedBonus = (rUser.referralEarnings || 0) + 10;
                const updatedBal = (rUser.balance || 0) + 10;
                await db.ref('users/' + referrerPhone).update({
                    balance: updatedBal,
                    referralEarnings: updatedBonus
                });
            }

            currentUser = newUser;
            localStorage.setItem('paylix_session_v2', JSON.stringify(currentUser));
            showToast('অ্যালাউড! অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে');
            renderUserApp();
        }

        async function handleUserLogin() {
            const phone = document.getElementById('authPhone').value.trim();
            const pass = document.getElementById('authPass').value.trim();

            if (!phone || !pass) return showToast('নম্বর এবং পাসওয়ার্ড লিখুন!', 'error');

            const snap = await db.ref('users/' + phone).once('value');
            if (!snap.exists()) return showToast('অ্যাকাউন্ট পাওয়া যায়নি!', 'error');

            const userVal = snap.val();
            if (userVal.password !== pass) return showToast('ভুল পাসওয়ার্ড!', 'error');

            currentUser = userVal;
            localStorage.setItem('paylix_session_v2', JSON.stringify(currentUser));
            showToast('লগইন সফল হয়েছে!');
            renderUserApp();
        }

        function handleUserLogout() {
            currentUser = null;
            localStorage.removeItem('paylix_session_v2');
            showToast('লগআউট করা হয়েছে');
            renderAuthView();
        }

        // MAIN APP DASHBOARD
        function renderUserApp() {
            document.getElementById('bottomNav').classList.remove('hidden');
            document.getElementById('headerActions').innerHTML = `
                <button onclick="handleUserLogout()" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-rose-500/20 hover:text-rose-400 text-slate-400 border border-slate-700/80 flex items-center justify-center transition">
                    <i class="fa-solid fa-power-off text-xs"></i>
                </button>
            `;
            switchTab(currentTab);
        }

        function switchTab(tabName) {
            currentTab = tabName;
            ['dashboard', 'gmail', 'tasks', 'withdraw', 'profile'].forEach(t => {
                const btn = document.getElementById('nav-' + t);
                if (btn) {
                    if (t === tabName) {
                        btn.className = "flex flex-col items-center text-brand-400 transition-all scale-105";
                    } else {
                        btn.className = "flex flex-col items-center text-slate-400 hover:text-brand-400 transition-all";
                    }
                }
            });
            renderTabContent();
        }

        function renderTabContent() {
            const view = document.getElementById('mainView');
            if (currentTab === 'dashboard') renderDashboardTab(view);
            else if (currentTab === 'gmail') renderGmailTab(view);
            else if (currentTab === 'tasks') renderTasksTab(view);
            else if (currentTab === 'withdraw') renderWithdrawTab(view);
            else if (currentTab === 'profile') renderProfileTab(view);
        }

        // TAB 1: DASHBOARD
        function renderDashboardTab(container) {
            container.innerHTML = `
                <div class="space-y-5 animate-fadeIn">
                    <!-- MAIN CARD -->
                    <div class="gradient-card p-6 rounded-3xl text-white shadow-xl relative overflow-hidden pulse-glow">
                        <div class="absolute -right-6 -bottom-6 text-white/10 text-9xl font-black pointer-events-none">
                            <i class="fa-solid fa-wallet"></i>
                        </div>
                        
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <span class="text-xs text-emerald-100 font-medium">বর্তমান ব্যালেন্স</span>
                                <h2 class="text-3xl font-black mt-0.5 tracking-tight">৳ ${currentUser.balance.toFixed(2)}</h2>
                            </div>
                            <span class="bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-[10px] font-bold text-white border border-white/20">
                                <i class="fa-solid fa-shield-check mr-1"></i>এক্টিভ অ্যাকাউন্ট
                            </span>
                        </div>

                        <div class="grid grid-cols-2 gap-2 pt-4 border-t border-white/20 text-xs">
                            <div class="bg-black/10 backdrop-blur-sm p-2.5 rounded-2xl">
                                <span class="text-[10px] text-emerald-100 block">মোট উপার্জন</span>
                                <span class="font-black text-sm">৳ ${currentUser.totalEarned.toFixed(2)}</span>
                            </div>
                            <div class="bg-black/10 backdrop-blur-sm p-2.5 rounded-2xl">
                                <span class="text-[10px] text-emerald-100 block">রেফার বোনাস</span>
                                <span class="font-black text-sm">৳ ${currentUser.referralEarnings.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>

                    <!-- QUICK ACTION GRID -->
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="switchTab('gmail')" class="glass-panel p-4 rounded-2xl border border-slate-800 hover:border-brand-500/50 text-left transition group">
                            <div class="w-10 h-10 rounded-xl bg-brand-500/20 text-brand-400 flex items-center justify-center text-lg mb-2 group-hover:scale-110 transition">
                                <i class="fa-solid fa-envelope-circle-check"></i>
                            </div>
                            <h4 class="font-bold text-xs text-white">জিমেইল সেল</h4>
                            <p class="text-[10px] text-slate-400">প্রতিটি ফিক্সড ৳২০</p>
                        </button>
                        <button onclick="switchTab('withdraw')" class="glass-panel p-4 rounded-2xl border border-slate-800 hover:border-indigo-500/50 text-left transition group">
                            <div class="w-10 h-10 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-lg mb-2 group-hover:scale-110 transition">
                                <i class="fa-solid fa-money-bill-transfer"></i>
                            </div>
                            <h4 class="font-bold text-xs text-white">উইথড্র পোর্টাল</h4>
                            <p class="text-[10px] text-slate-400">বিকাশ ও নগদ</p>
                        </button>
                    </div>

                    <!-- REFERRAL CARD -->
                    <div class="glass-panel p-5 rounded-3xl border border-slate-800 space-y-3">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <i class="fa-solid fa-users-rays text-brand-400 text-lg"></i>
                                <h3 class="font-bold text-xs text-white">রেফার কোড শেয়ার করুন</h3>
                            </div>
                            <span class="text-[10px] text-brand-400 font-bold bg-brand-500/10 px-2 py-0.5 rounded-full">১০% কমিশন</span>
                        </div>

        async function handleWithdrawRequest() {
            const method = document.getElementById('wdMethod').value;

            if (!account || isNaN(amount)) return showToast('সব তথ্য সঠিকভাবে দিন!', 'error');

            const reqId = 'WD-' + Date.now();
            const withdrawObj = {
                id: reqId,
                userPhone: currentUser.phone,
                userName: currentUser.name,
                method: method,
                account: account,
                amount: amount,
                netAmount: amount * 0.8,
                status: 'pending',
                date: new Date().toLocaleString('bn-BD')
            };

            // Deduct User Balance safely in Firebase
            const newBal = currentUser.balance - amount;
            await db.ref('users/' + currentUser.phone).update({ balance: newBal });
            await db.ref('withdrawRequests/' + reqId).set(withdrawObj);

            showToast('উইথড্র রিকোয়েস্ট সফলভাবে জমা হয়েছে!');

                            <div class="flex space-x-2 pt-1">
                                <button onclick="adminApproveGmail('${id}', '${item.userPhone}')" class="flex-1 bg-brand-600 hover:bg-brand-500 text-white text-[11px] font-bold py-1.5 rounded-xl transition">অ্যাপ্রুভ (৳২০)</button>
                                <button onclick="adminRejectGmail('${id}')" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white text-[11px] font-bold py-1.5 rounded-xl transition">বাতিল</button>
                            </div>
                        </div>
                    `;
                }
            }
            return count > 0 ? list : `<p class="text-xs text-slate-500 text-center py-2">কোনো জিমেইল জমা নেই</p>`;
        }

        async function adminApproveGmail(id, userPhone) {
            await db.ref('gmailSubmissions/' + id).update({ status: 'approved' });

            if (allUsersCache[userPhone]) {
                const u = allUsersCache[userPhone];
                const newBal = (u.balance || 0) + 20;
                const newTot = (u.totalEarned || 0) + 20;
                await db.ref('users/' + userPhone).update({ balance: newBal, totalEarned: newTot });
            }
            showToast('জিমেইল অ্যাপ্রুভ হয়েছে এবং ব্যালেন্স যোগ হয়েছে!');
        }

        async function adminRejectGmail(id) {
            await db.ref('gmailSubmissions/' + id).update({ status: 'rejected' });
            showToast('জিমেইল জমা বাতিল করা হয়েছে!');
        }

        function getAdminWithdrawList() {
            let list = '';
            let count = 0;
            for (let id in allWithdrawsCache) {
                const item = allWithdrawsCache[id];
                if (item.status === 'pending') {
                    count++;
                    list += `
                        <div class="bg-slate-900 p-3.5 rounded-2xl border border-slate-800 space-y-2 text-xs">
                            <div class="flex justify-between items-start">
                                <div>
                                    <span class="font-bold text-white block">${item.method}: ${item.account}</span>
                                    <span class="text-[10px] text-slate-400">মোট: ৳${item.amount} (নেট পাবে: ৳${item.netAmount})</span>
                                </div>
                                <span class="text-[10px] bg-sky-500/20 text-sky-400 font-bold px-2 py-0.5 rounded-full">পেন্ডিং</span>
                            </div>
                            <div class="text-[10px] text-slate-500">ইউজার: ${item.userName} (${item.userPhone})</div>
                            <div class="flex space-x-2 pt-1">
                                <button onclick="adminApproveWithdraw('${id}')" class="flex-1 bg-brand-600 hover:bg-brand-500 text-white text-[11px] font-bold py-1.5 rounded-xl transition">পেমেন্ট সম্পন্ন</button>
                                <button onclick="adminRejectWithdraw('${id}', '${item.userPhone}', ${item.amount})" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white text-[11px] font-bold py-1.5 rounded-xl transition">বাতিল ও রিফান্ড</button>
                            </div>
                        </div>
                    `;
                }
            }
            return count > 0 ? list : `<p class="text-xs text-slate-500 text-center py-2">কোনো পেন্ডিং উইথড্র রিকোয়েস্ট নেই</p>`;
        }

        async function adminApproveWithdraw(id) {
            await db.ref('withdrawRequests/' + id).update({ status: 'approved' });
            showToast('উইথড্র সম্পন্ন করা হয়েছে!');
        }

        async function adminRejectWithdraw(id, userPhone, amount) {
            await db.ref('withdrawRequests/' + id).update({ status: 'rejected' });
            if (allUsersCache[userPhone]) {
                const u = allUsersCache[userPhone];
                const newBal = (u.balance || 0) + amount;
                await db.ref('users/' + userPhone).update({ balance: newBal });
            }
            showToast('উইথড্র বাতিল এবং ব্যালেন্স রিফান্ড করা হয়েছে!');
        }
    </script>
</body>
</html>
