<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paylix - Micro-Task & Earning Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
    <div id="app" class="p-4 max-w-4xl mx-auto"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, deleteDoc, getDocs, addDoc, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const logoUrl = "https://i.postimg.cc/PxzQZ9VJ/file-0000000030d882118003721bfa9dff12.png";

        const firebaseConfig = {
            apiKey: "AIzaSyAtY87cMTIiJyXtpflfLiLfZfa7WX1g9Mg",
            authDomain: "paylix-586b1.firebaseapp.com",
            projectId: "paylix-586b1",
            storageBucket: "paylix-586b1.firebasestorage.app",
            messagingSenderId: "353074453470",
            appId: "1:353074453470:web:679e99a4021eeed9499b4f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = JSON.parse(localStorage.getItem('paylix_user')) || null;
        let currentView = currentUser ? 'dashboard' : 'login';

        window.renderApp = function() {
            const appDiv = document.getElementById('app');
            if (window.location.hash === '#admin' || window.location.hash === '#adn') {
                renderAdminPanel(appDiv);
                return;
            }
            if (!currentUser) {
                currentView === 'register' ? renderRegister(appDiv) : renderLogin(appDiv);
            } else {
                if (currentView === 'dashboard') renderDashboard(appDiv);
                else if (currentView === 'jobs') renderJobs(appDiv);
                else if (currentView === 'gmail') renderGmail(appDiv);
                else if (currentView === 'spin') renderSpin(appDiv);
                else if (currentView === 'withdraw') renderWithdraw(appDiv);
                else if (currentView === 'leaderboard') renderLeaderboard(appDiv);
                else if (currentView === 'vip') renderVip(appDiv);
                else if (currentView === 'support') renderSupport(appDiv);
                else if (currentView === 'admin') renderAdminPanel(appDiv);
            }
        };

        window.renderLogin = function(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-8 space-y-6 mt-10 shadow-2xl text-center">
                    <img src="${logoUrl}" alt="Logo" class="w-20 h-20 mx-auto rounded-2xl shadow-lg object-cover">
                    <h2 class="text-2xl font-bold text-indigo-400">Paylix লগইন</h2>
                    <form id="login-form" class="space-y-4 text-left">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">ইমেইল</label>
                            <input type="email" id="login-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">পাসওয়ার্ড</label>
                            <input type="password" id="login-pass" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl shadow-lg transition">লগইন</button>
                    </form>
                    <p class="text-xs text-slate-400">অ্যাকাউন্ট নেই? <button onclick="currentView='register'; renderApp();" class="text-indigo-400 font-bold hover:underline">রেজিস্ট্রেশন করুন</button></p>
                </div>
            `;
            document.getElementById('login-form').onsubmit = handleLogin;
        };

        window.renderRegister = function(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-8 space-y-6 mt-10 shadow-2xl text-center">
                    <img src="${logoUrl}" alt="Logo" class="w-20 h-20 mx-auto rounded-2xl shadow-lg object-cover">
                    <h2 class="text-2xl font-bold text-indigo-400">Paylix একাউন্ট তৈরি</h2>
                    <form id="reg-form" class="space-y-4 text-left">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">আপনার নাম</label>
                            <input type="text" id="reg-name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">ইমেইল</label>
                            <input type="email" id="reg-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">পাসওয়ার্ড</label>
                            <input type="password" id="reg-pass" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">মোবাইল নম্বর (বিকাশ/নগদ)</label>
                            <input type="text" id="reg-phone" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl shadow-lg transition">রেজিস্ট্রেশন</button>
                    </form>
                    <p class="text-xs text-slate-400">ইতিমধ্যে অ্যাকাউন্ট আছে? <button onclick="currentView='login'; renderApp();" class="text-indigo-400 font-bold hover:underline">লগইন করুন</button></p>
                </div>
            `;
            document.getElementById('reg-form').onsubmit = handleRegister;
        };

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            try {
                const docRef = doc(db, "users", email);
                const docSnap = await getDoc(docRef);
                if (!docSnap.exists()) { alert("এই ইমেইল দিয়ে কোনো অ্যাকাউন্ট পাওয়া যায়নি!"); return; }
                const u = docSnap.data();
                if (u.isBlocked) { alert("আপনার অ্যাকাউন্টটি ব্লক করা হয়েছে!"); return; }
                if (u.pass !== pass) { alert("ভুল পাসওয়ার্ড!"); return; }
                currentUser = u;
                localStorage.setItem('paylix_user', JSON.stringify(currentUser));
                currentView = 'dashboard';
                renderApp();
            } catch (err) { console.error(err); alert("লগইন করতে সমস্যা হয়েছে।"); }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const phone = document.getElementById('reg-phone').value;
            try {
                const docRef = doc(db, "users", email);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) { alert("এই ইমেইল দিয়ে ইতিমধ্যে অ্যাকাউন্ট রয়েছে!"); return; }
                const newUser = { name, email, pass, phone, balance: 0, isVip: false, isBlocked: false, referCount: 0, hasSpunBefore: false };
                await setDoc(docRef, newUser);
                alert("সফলভাবে অ্যাকাউন্ট তৈরি হয়েছে! এবার লগইন করুন।");
                currentView = 'login';
                renderApp();
            } catch (err) { console.error(err); alert("রেজিস্ট্রেশন করতে সমস্যা হয়েছে।"); }
        }

        window.logout = function() {
            localStorage.removeItem('paylix_user');
            currentUser = null;
            currentView = 'login';
            renderApp();
        };        window.renderDashboard = function(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl flex justify-between items-center shadow-xl">
                        <div class="flex items-center gap-4">
                            <img src="${logoUrl}" alt="Logo" class="w-12 h-12 rounded-xl object-cover shadow">
                            <div>
                                <h2 class="text-xl font-bold">${currentUser.name} ${currentUser.isVip ? '👑 VIP' : ''}</h2>
                                <p class="text-xs text-slate-400">একাউন্ট: ${currentUser.phone}</p>
                            </div>
                        </div>
                        <button onclick="logout()" class="text-xs bg-red-600/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-xl font-bold hover:bg-red-600/30 transition">লগআউট</button>
                    </div>
                    <div class="bg-gradient-to-r from-indigo-900/40 to-slate-900 border border-indigo-500/30 p-6 rounded-3xl text-center space-y-2 shadow-xl">
                        <p class="text-xs text-slate-400 font-semibold">আপনার বর্তমান ব্যালেন্স</p>
                        <h1 class="text-3xl font-extrabold text-emerald-400">৳${currentUser.balance.toFixed(2)}</h1>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <button onclick="currentView='jobs'; renderApp();" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center hover:border-indigo-500 transition shadow"><i class="fas fa-tasks text-indigo-400 text-lg mb-1"></i><p class="text-xs font-bold">মাইক্রো জব</p></button>
                        <button onclick="currentView='gmail'; renderApp();" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center hover:border-indigo-500 transition shadow"><i class="fas fa-envelope text-pink-400 text-lg mb-1"></i><p class="text-xs font-bold">জিমেইল সেল</p></button>
                        <button onclick="currentView='spin'; renderApp();" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center hover:border-indigo-500 transition shadow"><i class="fas fa-dharmachakra text-amber-400 text-lg mb-1"></i><p class="text-xs font-bold">লাকি স্পিন</p></button>
                        <button onclick="currentView='withdraw'; renderApp();" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center hover:border-indigo-500 transition shadow"><i class="fas fa-wallet text-emerald-400 text-lg mb-1"></i><p class="text-xs font-bold">টাকা উত্তোলন</p></button>
                        <button onclick="currentView='leaderboard'; renderApp();" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center hover:border-indigo-500 transition shadow"><i class="fas fa-trophy text-yellow-400 text-lg mb-1"></i><p class="text-xs font-bold">লিডারবোর্ড</p></button>
                        <button onclick="currentView='vip'; renderApp();" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center hover:border-indigo-500 transition shadow"><i class="fas fa-crown text-purple-400 text-lg mb-1"></i><p class="text-xs font-bold">ভিআইপি পাস</p></button>
                        <button onclick="currentView='support'; renderApp();" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center hover:border-indigo-500 transition shadow"><i class="fas fa-headset text-sky-400 text-lg mb-1"></i><p class="text-xs font-bold">সাপোর্ট</p></button>
                    </div>
                </div>
            `;
        };

        window.renderJobs = async function(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex justify-between items-center"><h3 class="text-xl font-bold">📋 মাইক্রো জবস</h3><button onclick="currentView='dashboard'; renderApp();" class="text-xs bg-slate-800 px-3 py-1.5 rounded-xl">ড্যাশবোর্ড</button></div>
                    <div id="job-list" class="space-y-3"><p class="text-xs text-slate-400">লোড হচ্ছে...</p></div>
                </div>
            `;
            try {
                const querySnapshot = await getDocs(collection(db, "jobs"));
                const list = document.getElementById('job-list');
                if(!list) return;
                if(querySnapshot.empty) { list.innerHTML = `<p class="text-xs text-slate-400">কোনো জব পাওয়া যায়নি।</p>`; return; }
                let html = '';
                querySnapshot.forEach(docSnap => {
                    const j = docSnap.data();
                    const jobId = docSnap.id;
                    let reward = currentUser.isVip ? j.reward * 1.2 : j.reward;
                    html += `
                        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-2">
                            <h4 class="font-bold text-sm text-indigo-400">${j.title}</h4>
                            <p class="text-xs text-slate-300">${j.description}</p>
                            <div class="flex justify-between items-center pt-2">
                                <a href="${j.link}" target="_blank" class="text-xs text-sky-400 underline font-semibold">কাজের লিংক ভিজিট করুন</a>
                                <span class="text-xs font-bold text-emerald-400">৳${reward.toFixed(2)}</span>
                            </div>
                            <div class="flex gap-2 pt-2">
                                <input type="text" id="proof-${jobId}" placeholder="প্রুফ দিন (যেমন: আপনার ইউজারনেম)" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none">
                                <button onclick="submitJobProof('${jobId}', ${reward})" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-xl text-xs font-bold transition">জমা দিন</button>
                            </div>
                        </div>
                    `;
                });
                list.innerHTML = html;
            } catch (err) { console.error(err); }
        };

        window.submitJobProof = async function(jobId, reward) {
            const proof = document.getElementById(`proof-${jobId}`).value;
            if(!proof) { alert("কাজের প্রমাণ লিখুন।"); return; }
            try {
                await addDoc(collection(db, "job_proofs"), {
                    jobId, userEmail: currentUser.email, userName: currentUser.name, proof, reward, status: "Pending", timestamp: serverTimestamp()
                });
                alert("প্রুফ সফলভাবে জমা হয়েছে!");
            } catch (err) { console.error(err); alert("প্রুফ জমা দিতে সমস্যা হয়েছে।"); }
        };

        window.renderGmail = function(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-xl">
                    <div class="flex justify-between items-center"><h3 class="text-xl font-bold">📧 জিমেইল সেল</h3><button onclick="currentView='dashboard'; renderApp();" class="text-xs bg-slate-800 px-3 py-1.5 rounded-xl">ড্যাশবোর্ড</button></div>
                    <p class="text-xs text-slate-400">সাধারণ রেট: ৳১৫ | ভিআইপি রেট: ৳১৭ প্রতি জিমেইল।</p>
                    <form id="gmail-form" class="space-y-3">
                        <input type="email" id="g-email" placeholder="Gmail Address" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs focus:outline-none">
                        <input type="text" id="g-pass" placeholder="Password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs focus:outline-none">
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3 rounded-xl text-xs transition">জিমেইল জমা দিন</button>
                    </form>
                </div>
            `;
            document.getElementById('gmail-form').onsubmit = submitGmail;
        };

        async function submitGmail(e) {
            e.preventDefault();
            const gmail = document.getElementById('g-email').value;
            const password = document.getElementById('g-pass').value;
            const rate = currentUser.isVip ? 17 : 15;
            try {
                await addDoc(collection(db, "gmail_orders"), {
                    userEmail: currentUser.email, userName: currentUser.name, gmail, password, rate, timestamp: serverTimestamp()
                });
                currentUser.balance += rate;
                await updateDoc(doc(db, "users", currentUser.email), { balance: currentUser.balance });
                localStorage.setItem('paylix_user', JSON.stringify(currentUser));
                alert(`জিমেইল সফলভাবে জমা হয়েছে! ব্যালেন্সে ৳${rate} যোগ করা হয়েছে।`);
                renderApp();
            } catch (err) { console.error(err); alert("জিমেইল জমা দিতে সমস্যা হয়েছে।"); }
        }

        window.renderSpin = function(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center space-y-4 shadow-xl">
                    <div class="flex justify-between items-center"><h3 class="text-xl font-bold">🎡 লাকি স্পিন</h3><button onclick="currentView='dashboard'; renderApp();" class="text-xs bg-slate-800 px-3 py-1.5 rounded-xl">ড্যাশবোর্ড</button></div>
                    <p class="text-xs text-slate-400">প্রতি স্পিন ফি: ৳১৫</p>
                    <div id="spin-result" class="text-lg font-bold text-emerald-400 py-6">স্পিন করতে নিচে ক্লিক করুন</div>
                    <button onclick="doSpin()" class="w-full bg-gradient-to-r from-amber-500 to-pink-600 hover:opacity-90 font-bold py-3 rounded-xl text-sm transition shadow-lg">স্পিন করুন (৳১৫)</button>
                </div>
            `;
        };

        window.doSpin = async function() {
            if (currentUser.balance < 15) { alert("পর্যাপ্ত ব্যালেন্স নেই!"); return; }
            currentUser.balance -= 15;
            let win = 0;
            if (!currentUser.hasSpunBefore) {
                win = Math.random() < 0.7 ? Math.floor(Math.random() * 20) + 10 : 0;
                currentUser.hasSpunBefore = true;
            } else {
                win = 0;
            }
            currentUser.balance += win;
            try {
                await updateDoc(doc(db, "users", currentUser.email), { balance: currentUser.balance, hasSpunBefore: currentUser.hasSpunBefore });
                localStorage.setItem('paylix_user', JSON.stringify(currentUser));
                document.getElementById('spin-result').innerText = win > 0 ? `অভিনন্দন! আপনি জিতেছেন ৳${win}` : `দুঃখিত, কোনো বোনাস পাননি!`;
            } catch (err) { console.error(err); }
        };

        window.renderWithdraw = function(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-xl">
                    <div class="flex justify-between items-center"><h3 class="text-xl font-bold">💳 টাকা উত্তোলন</h3><button onclick="currentView='dashboard'; renderApp();" class="text-xs bg-slate-800 px-3 py-1.5 rounded-xl">ড্যাশবোর্ড</button></div>
                    <p class="text-xs text-slate-400">উত্তোলনে ১৫% সার্ভিস চার্জ প্রযোজ্য।</p>
                    <form id="withdraw-form" class="space-y-3">
                        <select id="w-method" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs focus:outline-none"><option>Bkash</option><option>Nagad</option></select>
                        <input type="text" id="w-num" placeholder="একাউন্ট নম্বর" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs focus:outline-none">
                        <input type="number" id="w-amount" placeholder="টাকার পরিমাণ" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs focus:outline-none">
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl text-xs transition shadow-lg">উত্তোলন রিকোয়েস্ট পাঠান</button>
                    </form>
                </div>
            `;
            document.getElementById('withdraw-form').onsubmit = handleWithdraw;
        };

        async function handleWithdraw(e) {
            e.preventDefault();
            const method = document.getElementById('w-method').value;
            const number = document.getElementById('w-num').value;
            const amount = parseFloat(document.getElementById('w-amount').value);
            if (amount > currentUser.balance) { alert("পর্যাপ্ত ব্যালেন্স নেই!"); return; }
            let netAmount = amount - (amount * 0.15);

            currentUser.balance -= amount;
            try {
                await updateDoc(doc(db, "users", currentUser.email), { balance: currentUser.balance });
                await addDoc(collection(db, "withdrawals"), {
                    userEmail: currentUser.email, userName: currentUser.name, method, number, amount, netAmount, status: "Pending", timestamp: serverTimestamp()
                });
                localStorage.setItem('paylix_user', JSON.stringify(currentUser));
                alert("উত্তোলন রিকোয়েস্ট সফলভাবে জমা হয়েছে!");
                renderApp();
            } catch (err) { console.error(err); alert("উত্তোলন করতে সমস্যা হয়েছে।"); }
        }

        window.renderLeaderboard = async function(container) {
            container.innerHTML = `

        window.adminAdjustBalance = async function(email, currentBal) {
            let amt = parseFloat(prompt(`বর্তমান ব্যালেন্স ৳${currentBal}। কত যোগ (+50) বা বিয়োগ (-50) করতে চান?`));
            if(isNaN(amt)) return;
            await updateDoc(doc(db, "users", email), { balance: currentBal + amt });
            loadAdminTab('users');
        };

        window.adminToggleBlock = async function(email, status) {
            await updateDoc(doc(db, "users", email), { isBlocked: !status });
            loadAdminTab('users');
        };

        window.adminApproveWithdraw = async function(id) {
            await updateDoc(doc(db, "withdrawals", id), { status: "Approved" });
            loadAdminTab('withdrawals');
        };

        async function handleAdminPostJob(e) {
            e.preventDefault();
            const title = document.getElementById('j-title').value;
            const description = document.getElementById('j-desc').value;
            const link = document.getElementById('j-link').value;
            const reward = parseFloat(document.getElementById('j-reward').value);
            await addDoc(collection(db, "jobs"), { title, description, link, reward, timestamp: serverTimestamp() });
            loadAdminTab('jobs');
        }

        window.adminApproveProof = async function(proofId, email, reward) {
            await updateDoc(doc(db, "job_proofs", proofId), { status: "Approved" });
            const userDoc = await getDoc(doc(db, "users", email));
            if(userDoc.exists()) {
                let bal = userDoc.data().balance || 0;
                await updateDoc(doc(db, "users", email), { balance: bal + reward });
            }
            loadAdminTab('jobs');
        };

        window.adminDeleteGmail = async function(id) {
            await deleteDoc(doc(db, "gmail_orders", id));
            loadAdminTab('gmail');
        };

        window.adminApproveVip = async function(id, email) {
            await updateDoc(doc(db, "vip_requests", id), { status: "Approved" });
            await updateDoc(doc(db, "users", email), { isVip: true });
            loadAdminTab('vip');
        };

        window.addEventListener('DOMContentLoaded', () => {
            if(window.location.hash === '#admin' || window.location.hash === '#adn') {
                currentView = 'admin';
            }
            renderApp();
        });

        window.addEventListener('hashchange', () => {
            if(window.location.hash === '#admin' || window.location.hash === '#adn') {
                currentView = 'admin';
            } else if(currentView === 'admin') {
                currentView = currentUser ? 'dashboard' : 'login';

            renderApp();
