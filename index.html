<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paylix</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#1a0b2e;color:#fff;min-height:100vh;padding:15px}
.card{background:#2d1b4e;padding:25px;border-radius:16px;width:100%;max-width:440px;margin:20px auto;box-shadow:0 0 30px rgba(138,43,226,.4)}
h1,h3{text-align:center;color:#b388ff;margin-bottom:15px}
h1{font-size:24px}h3{font-size:18px}
input,textarea,select{width:100%;padding:11px;margin:6px 0;background:#1a0b2e;border:1px solid #6a1b9a;color:#fff;border-radius:8px;font-size:14px}
input:focus,textarea:focus{outline:none;border-color:#b388ff}
button{width:100%;padding:11px;margin-top:8px;background:linear-gradient(135deg,#8e24aa,#6a1b9a);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer}
button:hover{opacity:.9}
button.sm{width:auto;padding:6px 12px;margin:3px;font-size:12px}
.link{text-align:center;margin-top:12px;font-size:13px;color:#b388ff;cursor:pointer}
.hidden{display:none}
.msg{text-align:center;margin-top:8px;font-size:13px}
.err{color:#ff5252}.ok{color:#69f0ae}
.balance{font-size:30px;color:#69f0ae;margin:12px 0;text-align:center}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.menu div{background:#1a0b2e;padding:14px;border-radius:10px;border:1px solid #6a1b9a;cursor:pointer;font-size:13px;text-align:center}
.menu div:hover{border-color:#b388ff}
.list{max-height:300px;overflow-y:auto;margin-top:10px}
.item{background:#1a0b2e;padding:10px;border-radius:8px;margin:6px 0;font-size:12px;text-align:left;border-left:3px solid #8e24aa}
.item b{color:#b388ff}
.pending{color:#ffb74d}.approved{color:#69f0ae}.rejected{color:#ff5252}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{width:auto;padding:7px 12px;margin:0;font-size:12px;background:#1a0b2e;border:1px solid #6a1b9a}
.tabs button.active{background:#8e24aa}
.badge{background:#8e24aa;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:5px}
</style>
</head>
<body>

<div id="authScreen" class="card">
  <h1 id="authTitle">Paylix লগইন</h1>
  <div id="loginForm">
    <input id="lEmail" type="email" placeholder="ইমেইল">
    <input id="lPass" type="password" placeholder="পাসওয়ার্ড">
    <button onclick="doLogin()">লগইন</button>
    <div class="link" onclick="toggle('reg')">নতুন? রেজিস্টার করুন</div>
  </div>
  <div id="regForm" class="hidden">
    <input id="rName" placeholder="ইউজারনেম">
    <input id="rEmail" type="email" placeholder="ইমেইল">
    <input id="rPhone" type="tel" placeholder="ফোন নাম্বার">
    <input id="rPass" type="password" placeholder="পাসওয়ার্ড (৬+)">
    <input id="rRef" placeholder="রেফারেল কোড (ঐচ্ছিক)">
    <button onclick="doRegister()">অ্যাকাউন্ট ক্রিয়েট</button>
    <div class="link" onclick="toggle('login')">অ্যাকাউন্ট আছে? লগইন</div>
  </div>
  <div id="authMsg" class="msg"></div>
</div>

<div id="userDash" class="hidden">
  <div class="card">
    <h3>Paylix <span class="badge" id="uRefBadge"></span></h3>
    <p style="text-align:center;color:#ccc;font-size:13px">স্বাগতম, <b id="uName"></b></p>
    <div class="balance">৳ <span id="uBal">0</span></div>
    <div class="menu">
      <div onclick="page('gmail')">📧 জিমেইল সেল</div>
      <div onclick="page('tasks')">🎯 মাইক্রো টাস্ক</div>
      <div onclick="page('inbox')">📥 ইনবক্স</div>
      <div onclick="page('withdraw')">💸 উইথড্র</div>
      <div onclick="page('refer')">👥 রেফারেল</div>
      <div onclick="page('leader')">🏆 লিডারবোর্ড</div>
    </div>
    <button onclick="logout()" style="margin-top:12px">লগআউট</button>
    <div id="pageBox" style="margin-top:15px"></div>
  </div>
</div>

<div id="adminPanel" class="hidden">
  <div class="card">
    <h3>🔧 Paylix Admin</h3>
    <div class="tabs">
      <button onclick="adminTab('gmail')" id="tab-gmail">জিমেইল সেল</button>
      <button onclick="adminTab('withdraw')" id="tab-withdraw">উইথড্র</button>
      <button onclick="adminTab('users')" id="tab-users">ইউজার</button>
      <button onclick="adminTab('tasks')" id="tab-tasks">টাস্ক</button>
      <button onclick="adminTab('broadcast')" id="tab-broadcast">ব্রডকাস্ট</button>
    </div>
    <div id="adminBox"></div>
    <button onclick="logout()" style="margin-top:12px">লগআউট</button>
  </div>
</div>

<div id="toast" class="msg" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#6a1b9a;padding:10px 20px;border-radius:20px;display:none"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, addDoc, collection, query, where, getDocs, orderBy, limit, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAtY87cMTIiJyXtpflfLiLfZfa7WX1g9Mg",
  authDomain: "paylix-586b1.firebaseapp.com",
  projectId: "paylix-586b1",
  storageBucket: "paylix-586b1.firebasestorage.app",
  messagingSenderId: "353074453470",
  appId: "1:353074453470:web:026fc4a6768eb6d9499b4f"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const ADMIN_EMAIL = "hey.rafi32@gmail.com";
let U = null, D = null, isAdmin = false;

const toast = t => { const e=$('toast'); e.textContent=t; e.style.display='block'; setTimeout(()=>e.style.display='none',2500); };
const am = (t,c) => { $('authMsg').textContent=t; $('authMsg').className='msg '+(c||''); };

window.toggle = v => {
  $('loginForm').classList.toggle('hidden', v==='reg');
  $('regForm').classList.toggle('hidden', v==='login');
  $('authTitle').textContent = v==='reg'?'Paylix রেজিস্টার':'Paylix লগইন';
  am('');
};

window.doRegister = async () => {
  const name=$('rName').value.trim(), email=$('rEmail').value.trim(),
        phone=$('rPhone').value.trim(), pass=$('rPass').value, ref=$('rRef').value.trim().toUpperCase();
  if(!name||!email||!phone||pass.length<6) return am('সব তথ্য দিন (পাস ৬+)','err');
  try{
    const c = await createUserWithEmailAndPassword(auth,email,pass);
    const myCode = c.user.uid.slice(0,6).toUpperCase();
    await setDoc(doc(db,'users',c.user.uid),{
      username:name,email,phone,balance:0,isBlocked:false,
      role: email===ADMIN_EMAIL?'admin':'user',
      refCode:myCode,referredBy:ref||null,referralCount:0,createdAt:serverTimestamp()
    });
    if(ref){
      const qs = await getDocs(query(collection(db,'users'),where('refCode','==',ref)));
      if(!qs.empty) await updateDoc(doc(db,'users',qs.docs[0].id),{referralCount:increment(1)});
    }
    am('অ্যাকাউন্ট তৈরি হয়েছে!','ok');
  }catch(e){am(e.message,'err')}
};

window.doLogin = async () => {
  try{await signInWithEmailAndPassword(auth,$('lEmail').value.trim(),$('lPass').value)}
  catch(e){am(e.message,'err')}
};
window.logout = () => signOut(auth);

window.page = async p => {
  const b = $('pageBox'); b.innerHTML='লোড হচ্ছে...';
  if(p==='gmail') b.innerHTML=`<h3>📧 জিমেইল সেল</h3>
    <input id="gU" placeholder="জিমেইল ইউজারনেম"><input id="gP" type="password" placeholder="পাসওয়ার্ড">
    <button onclick="subGmail()">সাবমিট</button>`;
  if(p==='tasks') await loadTasks(b);
  if(p==='inbox') await loadInbox(b);
  if(p==='withdraw') b.innerHTML=`<h3>💸 উইথড্র</h3>
    <p style="font-size:13px;color:#ccc">সর্বনিম্ন ৳১০০ | চার্জ ১৫% (রেফারার ১০%, প্ল্যাটফর্ম ৫%)</p>
    <input id="wA" type="number" placeholder="পরিমাণ"><input id="wM" placeholder="বিকাশ/নগদ নাম্বার">
    <button onclick="subWithdraw()">রিকোয়েস্ট</button>`;
  if(p==='refer') b.innerHTML=`<h3>👥 রেফারেল</h3>
    <p style="font-size:13px">আপনার কোড: <b>${D.refCode}</b></p>
    <p style="font-size:13px">মোট রেফারেল: <b>${D.referralCount||0}</b></p>
    <p style="font-size:13px">প্রতি রেফারে ৳১০ পাবেন</p>`;
  if(p==='leader') await loadLeader(b);
};

window.subGmail = async () => {
  const u=$('gU').value.trim(), p=$('gP').value.trim();
  if(!u||!p) return toast('সব দিন');
  await addDoc(collection(db,'gmailSales'),{userId:U.uid,username:D.username,gmailUser:u,gmailPass:p,status:'pending',createdAt:serverTimestamp()});
  $('gU').value='';$('gP').value='';toast('সাবমিট হয়েছে!');
};

window.subWithdraw = async () => {
  const a=Number($('wA').value), m=$('wM').value.trim();
  if(a<100) return toast('সর্বনিম্ন ৳১০০');
  if(!m) return toast('নাম্বার দিন');
  if(a>(D.balance||0)) return toast('ব্যালেন্স নেই');
  const ch=a*0.15;
  await addDoc(collection(db,'withdrawRequests'),{userId:U.uid,username:D.username,amount:a,charge:ch,payTo:m,status:'pending',createdAt:serverTimestamp()});
  toast(`রিকোয়েস্ট জমা। চার্জ ৳${ch.toFixed(2)}`);
};

async function loadTasks(b){
  b.innerHTML='<h3>🎯 মাইক্রো টাস্ক</h3><div class="list" id="tl">লোড...</div>';
  const s = await getDocs(query(collection(db,'tasks'),orderBy('createdAt','desc'),limit(20)));
  $('tl').innerHTML = s.empty?'<p style="font-size:13px">কোনো টাস্ক নেই</p>':
    s.docs.map(d=>{const t=d.data();return `<div class="item"><b>${t.title}</b><br>${t.desc||''}<br>পুরস্কার: ৳${t.reward}<br>
    <button class="sm" onclick="claimTask('${d.id}','${t.reward}')">ক্লেইম</button></div>`}).join('');
}
window.claimTask = async (id,r)=>{
  await addDoc(collection(db,'taskClaims'),{userId:U.uid,username:D.username,taskId:id,reward:Number(r),status:'pending',createdAt:serverTimestamp()});
  toast('ক্লেইম জমা হয়েছে!');
};

async function loadInbox(b){
  b.innerHTML='<h3>📥 ইনবক্স</h3><div class="list" id="il">লোড...</div>';
  const s = await getDocs(query(collection(db,'messages'),where('receiverId','==',U.uid),orderBy('createdAt','desc'),limit(20)));
  $('il').innerHTML = s.empty?'<p style="font-size:13px">কোনো মেসেজ নেই</p>':
    s.docs.map(d=>`<div class="item">${d.data().text}<br><small style="color:#999">${d.data().from||'admin'}</small></div>`).join('');
}

async function loadLeader(b){
  b.innerHTML='<h3>🏆 টপ রেফারেলস</h3><div class="list" id="ll">লোড...</div>';
  const s = await getDocs(query(collection(db,'users'),orderBy('referralCount','desc'),limit(10)));
  $('ll').innerHTML = s.docs.map((d,i)=>`<div class="item">#${i+1} ${d.data().username} — ${d.data().referralCount||0} রেফারেল</div>`).join('');
}

window.adminTab = async t => {
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  $('tab-'+t).classList.add('active');
  const b=$('adminBox'); b.innerHTML='লোড...';
  if(t==='gmail'){
    const s = await getDocs(query(collection(db,'gmailSales'),orderBy('createdAt','desc'),limit(30)));
    b.innerHTML='<h3>জিমেইল সেল</h3><div class="list">'+s.docs.map(d=>{const x=d.data();
      return `<div class="item"><b>${x.username}</b><br>ইউজার: ${x.gmailUser}<br>পাস: ${x.gmailPass}<br>
      স্ট্যাটাস: <span class="${x.status}">${x.status}</span><br>
      ${x.status==='pending'?`<button class="sm" onclick="approveGmail('${d.id}','${x.userId}',500)">অ্যাপ্রুভ ৳৫০০</button><button class="sm" onclick="rejectItem('gmailSales','${d.id}')">রিজেক্ট</button>`:''}</div>`}).join('')+'</div>';
  }
  if(t==='withdraw'){
    const s = await getDocs(query(collection(db,'withdrawRequests'),orderBy('createdAt','desc'),limit(30)));
    b.innerHTML='<h3>উইথড্র</h3><div class="list">'+s.docs.map(d=>{const x=d.data();
      return `<div class="item"><b>${x.username}</b><br>৳${x.amount} | চার্জ ৳${x.charge.toFixed(2)}<br>${x.payTo}<br>
      <span class="${x.status}">${x.status}</span><br>
      ${x.status==='pending'?`<button class="sm" onclick="approveWithdraw('${d.id}','${x.userId}',${x.amount})">অ্যাপ্রুভ</button><button class="sm" onclick="rejectItem('withdrawRequests','${d.id}')">রিজেক্ট</button>`:''}</div>`}).join('')+'</div>';
  }
  if(t==='users'){
    const s = await getDocs(query(collection(db,'users'),orderBy('createdAt','desc'),limit(30)));
    b.innerHTML='<h3>ইউজার</h3><div class="list">'+s.docs.map(d=>{const x=d.data();
      return `<div class="item"><b>${x.username}</b> ${x.isBlocked?'<span class="rejected">[ব্লকড]</span>':''}<br>${x.email}<br>৳${x.balance||0}<br>
      <button class="sm" onclick="addBal('${d.id}',50)">+৫০</button>
      <button class="sm" onclick="addBal('${d.id}',-50)">-৫০</button>
      <button class="sm" onclick="toggleBlock('${d.id}',${!x.isBlocked})">${x.isBlocked?'আনব্লক':'ব্লক'}</button></div>`}).join('')+'</div>';
  }
  if(t==='tasks'){
    const s = await getDocs(query(collection(db,'tasks'),orderBy('createdAt','desc'),limit(20)));
    b.innerHTML=`<h3>টাস্ক পোস্ট</h3>
      <input id="tTitle" placeholder="টাস্ক টাইটেল"><input id="tDesc" placeholder="বিবরণ"><input id="tRew" type="number" placeholder="পুরস্কার ৳">
      <button onclick="addTask()">পোস্ট করুন</button>
      <div class="list">${s.docs.map(d=>{const x=d.data();return `<div class="item"><b>${x.title}</b><br>৳${x.reward}<br>${x.desc||''}<button class="sm" onclick="delItem('tasks','${d.id}')">ডিলিট</button></div>`}).join('')}</div>`;
  }
  if(t==='broadcast'){
    b.innerHTML=`<h3>ব্রডকাস্ট</h3><textarea id="bText" style="width:100%;padding:10px;background:#1a0b2e;border:1px solid #6a1b9a;color:#fff;border-radius:8px;min-height:80px"></textarea>
      <button onclick="broadcast()">সবাইকে পাঠান</button>`;
  }
};

window.approveGmail = async (id,uid,reward)=>{
  await updateDoc(doc(db,'gmailSales',id),{status:'approved'});
  await updateDoc(doc(db,'users',uid),{balance:increment(reward)});
  toast('অ্যাপ্রুভ + ব্যালেন্স যোগ'); adminTab('gmail');
};
window.approveWithdraw = async (id,uid,amt)=>{
  await updateDoc(doc(db,'withdrawRequests',id),{status:'approved'});
  await updateDoc(doc(db,'users',uid),{balance:increment(-amt)});
  toast('উইথড্র অ্যাপ্রুভ'); adminTab('withdraw');
};
window.rejectItem = async (col,id)=>{ await updateDoc(doc(db,col,id),{status:'rejected'}); toast('রিজেক্ট'); };
window.addBal = async (uid,amt)=>{ await updateDoc(doc(db,'users',uid),{balance:increment(amt)}); toast('ব্যালেন্স আপডেট'); adminTab('users'); };
window.toggleBlock = async (uid,v)=>{ await updateDoc(doc(db,'users',uid),{isBlocked:v}); toast(v?'ব্লক':'আনব্লক'); adminTab('users'); };
window.addTask = async ()=>{
  const t=$('tTitle').value.trim(), d=$('tDesc').value.trim(), r=Number($('tRew').value);
  if(!t||!r) return toast('টাইটেল ও পুরস্কার দিন');
  await addDoc(collection(db,'tasks'),{title:t,desc:d,reward:r,createdAt:serverTimestamp()});
  toast('টাস্ক পোস্টেড'); adminTab('tasks');
};
window.delItem = async (col,id)=>{ await updateDoc(doc(db,col,id),{status:'deleted'}); toast('ডিলিট'); adminTab('tasks'); };
window.broadcast = async ()=>{
  const t=$('bText').value.trim(); if(!t) return toast('মেসেজ লিখুন');
  const s = await getDocs(collection(db,'users'));
  for(const u of s.docs){ await addDoc(collection(db,'messages'),{receiverId:u.id,text:t,from:'admin',createdAt:serverTimestamp()}); }
  toast('সবাইকে পাঠানো হয়েছে'); $('bText').value='';
};

onAuthStateChanged(auth, async user => {
  if(user){
    U=user;
    const s = await getDoc(doc(db,'users',user.uid));
    D = s.data()||{};
    isAdmin = (D.role==='admin') || (user.email===ADMIN_EMAIL);
    if(D.isBlocked){ await signOut(auth); return am('অ্যাকাউন্ট ব্লকড','err'); }
    $('authScreen').classList.add('hidden');
    if(isAdmin){
      $('userDash').classList.add('hidden');
      $('adminPanel').classList.remove('hidden');
      adminTab('gmail');
    }else{
      $('adminPanel').classList.add('hidden');
      $('userDash').classList.remove('hidden');
      $('uName').textContent = D.username||'ইউজার';
      $('uBal').textContent = D.balance||0;
      $('uRefBadge').textContent = 'কোড: '+D.refCode;
      $('pageBox').innerHTML='';
    }
  }else{
    U=null;D=null;isAdmin=false;
    $('authScreen').classList.remove('hidden');
    $('userDash').classList.add('hidden');
    $('adminPanel').classList.add('hidden');
    toggle('login');
  }
});
</script>
</body>
  </html>
