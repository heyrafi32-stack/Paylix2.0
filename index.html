<script>
let db = JSON.parse(localStorage.getItem('paylix_db')) || { users: [], gmails: [], withdraws: [], jobs: [] };
let currentUser = localStorage.getItem('paylix_current') || null;
let isAdminLogged = false;
let currentSectorPrice = 10;
function saveDB() { localStorage.setItem('paylix_db', JSON.stringify(db)); }

// এনিমেশন টাইমিং (মাত্র ১.৫ সেকেন্ড)
window.onload = () => {
  setTimeout(() => {
    let splash = document.getElementById('page-splash');
    if(splash) {
      splash.style.opacity = '0';
      setTimeout(() => {
        splash.style.display = 'none';
        if(window.location.hash === '#admin') { 
          openPage('page-admin-login'); 
        }
        else if(currentUser) { 
          loadUserHome(); 
        } 
        else { 
          openPage('page-login'); 
        }
      }, 400);
    }
  }, 1500);
};

function openPage(id) { 
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); 
  document.getElementById(id).classList.add('active'); 
  window.scrollTo(0,0); 
}

function loginAdmin() {
  const user = document.getElementById('admin-user').value; const pass = document.getElementById('admin-pass').value;
  if(user === 'admin' && pass === 'admin123') { 
    isAdminLogged = true; openPage('page-admin'); loadAdminData('gmail'); 
    document.getElementById('admin-user').value = ''; document.getElementById('admin-pass').value = ''; 
  } 
  else { alert('ভুল ইউজারনেম বা পাসওয়ার্ড!'); }
}

function logoutAdmin() { isAdminLogged = false; history.replaceState(null, null, ' '); openPage('page-login'); }

function registerUser() {
  const name = document.getElementById('reg-name').value; const email = document.getElementById('reg-email').value; const pass = document.getElementById('reg-pass').value;
  if(!name || !email || !pass) return alert('সব ঘর পূরণ করুন');
  if(db.users.find(u => u.email === email)) return alert('এই ইমেইল দিয়ে অ্যাকাউন্ট আছে!');
  db.users.push({ name, email, pass, balance: 0, blocked: false }); saveDB(); 
  alert('সফলভাবে অ্যাকাউন্ট তৈরি হয়েছে!'); openPage('page-login');
}

function loginUser() {
  const email = document.getElementById('log-email').value; const pass = document.getElementById('log-pass').value;
  const user = db.users.find(u => u.email === email && u.pass === pass);
  if(user) {
    if(user.blocked) { return alert('আপনার অ্যাকাউন্টটি ব্লক করা হয়েছে! আনব্লক করতে অ্যাডমিনের সাথে যোগাযোগ করুন: @Owner_Paylix'); }
    currentUser = email; localStorage.setItem('paylix_current', email); loadUserHome();
  } else { alert('ভুল ইমেইল বা পাসওয়ার্ড!'); }
}

function loadUserHome() {
  const user = db.users.find(u => u.email === currentUser);
  if(!user) { logoutUser(); return; }
  document.getElementById('user-balance').innerText = '৳ ' + user.balance;
  document.getElementById('set-name').value = user.name;
  let txns = db.gmails.filter(g => g.user === currentUser && g.status === 'approved').map(g => `Gmail Sell: ৳${g.price} (Approved)`).concat(db.withdraws.filter(w => w.user === currentUser).map(w => `Withdraw: ৳${w.amount}`));
  const txnList = document.getElementById('user-txn-list');
  if(txns.length === 0) txnList.innerHTML = '<div class="txn-row" style="justify-content:center;color:#b9a4dd">কোনো লেনদেন নেই</div>';
  else txnList.innerHTML = txns.map(t => `<div class="txn-row"><span>${t}</span></div>`).join('');
  const jobList = document.getElementById('user-job-list');
  if(db.jobs.length === 0) { jobList.innerHTML = '<div class="form-box" style="text-align:center">এখনো কোনো কাজ পোস্ট করা হয়নি।</div>'; } 
  else { jobList.innerHTML = db.jobs.map(j => `<div class="form-box" style="margin-bottom:10px;text-align:center"><h3 style="margin-bottom:8px;color:#c084fc">${j.title}</h3><p style="font-size:1.1rem;font-weight:bold;margin-bottom:10px">৳ ${j.price}</p><button class="btn small-btn btn-green">কাজ শুরু করুন</button></div>`).join(''); }
  openPage('page-home');
}

function logoutUser() { currentUser = null; localStorage.removeItem('paylix_current'); openPage('page-login'); }
function selectSector(price) { currentSectorPrice = price; document.querySelectorAll('.sector').forEach(s => s.classList.remove('active')); event.currentTarget.classList.add('active'); }

function submitGmail() {
  const gmail = document.getElementById('gmail-id').value.trim();
  const pass = document.getElementById('gmail-pass').value.trim();
  if(!gmail || !pass) return alert('সব তথ্য দিন');
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if(!emailRegex.test(gmail)) return alert('সঠিক জিমেইল আইডি দিন (যেমন: example@gmail.com)');
  const isDuplicate = db.gmails.some(g => g.gmail === gmail || g.pass === pass);
  if(isDuplicate) return alert('এই জিমেইল বা পাসওয়ার্ড আগেই সাবমিট করা হয়েছে!');
  db.gmails.push({ user: currentUser, gmail: gmail, pass: pass, price: currentSectorPrice, status: 'pending' });
  saveDB(); loadUserHome(); alert('সফলভাবে সাবমিট হয়েছে! অ্যাডমিন Approve করলে ব্যালেন্স যোগ হবে।');
}

function submitWithdraw() {
  const method = document.getElementById('w-method').value; const number = document.getElementById('w-number').value; const amount = parseInt(document.getElementById('w-amount').value);
  if(!number || !amount) return alert('সব তথ্য দিন');
  if(amount < 100) return alert('সর্বনিম্ন ১০০ টাকা');
  const user = db.users.find(u => u.email === currentUser);
  if(user.balance < amount) return alert('পর্যাপ্ত ব্যালেন্স নেই!');
  user.balance -= amount; db.withdraws.push({ user: currentUser, method, number, amount, status: 'pending' }); saveDB(); loadUserHome(); alert('রিকোয়েস্ট পাঠানো হয়েছে!');
}
function saveSettings() { const user = db.users.find(u => u.email === currentUser); user.name = document.getElementById('set-name').value; saveDB(); alert('সেভ হয়েছে!'); }

// ================= অ্যাডমিন প্যানেল লজিক =================
function loadAdminData(type) {
  if(!isAdminLogged) return;
  const tableBody = document.querySelector('#admin-table tbody'); 
  const tableHead = document.querySelector('#admin-table thead'); 
  const jobForm = document.getElementById('admin-job-form');
  
  tableBody.innerHTML = ''; jobForm.style.display = 'none'; 

  if(type === 'gmail') {
    tableHead.innerHTML = '<tr><th>User Account</th><th>Gmail</th><th>Pass</th><th>Status</th><th>Action</th></tr>';
    if(db.gmails.length === 0) { tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center">কোনো জিমেইল সাবমিট হয়নি</td></tr>'; }
    db.gmails.forEach((g, index) => {
      let statusBadge = g.status === 'approved' ? '<span style="color:#10b981;font-weight:bold">✅ Approved</span>' : g.status === 'rejected' ? '<span style="color:#ef4444;font-weight:bold">❌ Rejected</span>' : '<span style="color:#fbbf24;font-weight:bold">⏳ Pending</span>';
      let actionBtns = g.status === 'pending' ? `<button class="btn small-btn btn-green" onclick="approveGmail(${index})" style="font-size:0.65rem;padding:4px 8px;">Approve</button> <button class="btn small-btn btn-red" onclick="rejectGmail(${index})" style="font-size:0.65rem;padding:4px 8px;">Reject</button>` : `<button class="btn small-btn btn-red" onclick="deleteGmail(${index})" style="font-size:0.65rem;padding:4px 8px;">Delete</button>`;
      tableBody.innerHTML += `<tr><td style="color:#fff">${g.user}</td><td>${g.gmail}</td><td><span id="pass-${index}" style="display:none">${g.pass}</span> <button class="btn small-btn" style="background:#555;padding:3px 6px;font-size:.6rem" onclick="toggleAdminPass(${index})">👁️</button></td><td>${statusBadge}</td><td>${actionBtns}</td></tr>`;
    });
  } 
  else if(type === 'withdraw') {
    tableHead.innerHTML = '<tr><th>User Account</th><th>Method</th><th>Number</th><th>Amount</th></tr>';
    if(db.withdraws.length === 0) { tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center">কোনো উইথড্র রিকোয়েস্ট নেই</td></tr>'; }
    db.withdraws.forEach(w => { tableBody.innerHTML += `<tr><td>${w.user}</td><td>${w.method}</td><td>${w.number}</td><td>৳${w.amount}</td></tr>`; });
  } 
  else if(type === 'users') {
    tableHead.innerHTML = '<tr><th>User</th><th>Status</th><th>Action</th></tr>';
    db.users.forEach(u => {
      let status = u.blocked ? '<span style="color:red">Blocked</span>' : '<span style="color:#10b981">Active</span>';
      let btnText = u.blocked ? 'Unblock' : 'Block'; let btnClass = u.blocked ? 'btn-green' : 'btn-red';
      tableBody.innerHTML += `<tr><td>${u.name}<br><small style="color:#b9a4dd">${u.email}</small></td><td>${status}</td><td><button class="btn small-btn ${btnClass}" onclick="toggleBlock('${u.email}')">${btnText}</button></td></tr>`;
    });
  } 
  else if(type === 'jobs') {
    jobForm.style.display = 'block'; tableHead.innerHTML = '<tr><th>Job Title</th><th>Price</th><th>Action</th></tr>';
    if(db.jobs.length === 0) { tableBody.innerHTML = '<tr><td colspan="3" style="text-align:center">No jobs posted yet</td></tr>'; } 
    else { db.jobs.forEach((j, index) => { tableBody.innerHTML += `<tr><td>${j.title}</td><td>৳${j.price}</td><td><button class="btn small-btn btn-red" onclick="deleteJob(${index})">Delete</button></td></tr>`; }); }
  }
}

function toggleAdminPass(index) { const el = document.getElementById('pass-' + index); el.style.display = el.style.display === 'none' ? 'inline' : 'none'; }

function approveGmail(index) {
  if(!isAdminLogged) return;
  if(confirm('আপনি কি নিশ্চিত এই জিমেইলটি Approve করবেন? এর ফলে ইউজারের একাউন্টে ৳' + db.gmails[index].price + ' যোগ হবে।')) {
    db.gmails[index].status = 'approved'; 
    const user = db.users.find(u => u.email === db.gmails[index].user); 
    if(user) user.balance += db.gmails[index].price; 
    saveDB(); loadAdminData('gmail'); alert('Approve সফল হয়েছে! ইউজারের একাউন্টে টাকা যোগ হয়েছে।');
  }
}

function rejectGmail(index) {
  if(!isAdminLogged) return;
  if(confirm('আপনি কি এই জিমেইলটি Reject করবেন? ইউজার কোনো টাকা পাবে না।')) {
    db.gmails[index].status = 'rejected'; saveDB(); loadAdminData('gmail'); alert('জিমেইলটি Reject করা হয়েছে।');
  }
}

function deleteGmail(index) {
  if(!isAdminLogged) return;
  if(confirm('আপনি কি এই রেকর্ডটি ডিলিট করতে চান?')) { db.gmails.splice(index, 1); saveDB(); loadAdminData('gmail'); }
}

function toggleBlock(email) { if(!isAdminLogged) return; const user = db.users.find(u => u.email === email); user.blocked = !user.blocked; saveDB(); loadAdminData('users'); }

function addJob() {
  if(!isAdminLogged) return;
  const title = document.getElementById('job-title').value; const price = document.getElementById('job-price').value;
  if(!title || !price) return alert('সব ঘর পূরণ করুন');
  db.jobs.push({ title, price }); saveDB(); document.getElementById('job-title').value = ''; document.getElementById('job-price').value = ''; loadAdminData('jobs'); alert('নতুন কাজ পোস্ট হয়েছে!');
}

function deleteJob(index) { if(!isAdminLogged) return; if(confirm('আপনি কি এই কাজটি ডিলিট করতে চান?')) { db.jobs.splice(index, 1); saveDB(); loadAdminData('jobs'); } }
</script>
</body>
</html>
