<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paylix - Micro-Task & Earning Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
    <div id="app" class="p-4 max-w-4xl mx-auto"></div>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentUser = JSON.parse(localStorage.getItem('paylix_user')) || null;
        let currentView = currentUser ? 'dashboard' : 'login';

        function renderApp() {
            const app = document.getElementById('app');
            if (window.location.hash === '#admin' || window.location.hash === '#adn') {
                renderAdminPanel(app);
                return;
            }
            if (!currentUser) {
                currentView === 'register' ? renderRegister(app) : renderLogin(app);
            } else {
                if (currentView === 'dashboard') renderDashboard(app);
                else if (currentView === 'jobs') renderJobs(app);
                else if (currentView === 'gmail') renderGmail(app);
                else if (currentView === 'spin') renderSpin(app);
                else if (currentView === 'withdraw') renderWithdraw(app);
                else if (currentView === 'leaderboard') renderLeaderboard(app);
                else if (currentView === 'vip') renderVip(app);
                else if (currentView === 'support') renderSupport(app);
                else if (currentView === 'admin') renderAdminPanel(app);
            }
        }
                function renderLogin(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-8 space-y-6 mt-10 shadow-2xl">
                    <h2 class="text-2xl font-bold text-center text-indigo-400">Paylix লগইন</h2>
                    <form onsubmit="handleLogin(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">ইমেইল</label>
                            <input type="email" id="login-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">পাসওয়ার্ড</label>
                            <input type="password" id="login-pass" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl shadow-lg transition">লগইন</button>
                    </form>
                    <p class="text-xs text-center text-slate-400">অ্যাকাউন্ট নেই? <button onclick="currentView='register'; renderApp();" class="text-indigo-400 font-bold hover:underline">রেজিস্ট্রেশন করুন</button></p>
                </div>
            `;
        }

        function renderRegister(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-8 space-y-6 mt-10 shadow-2xl">
                    <h2 class="text-2xl font-bold text-center text-indigo-400">Paylix একাউন্ট তৈরি</h2>
                    <form onsubmit="handleRegister(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">আপনার নাম</label>
                            <input type="text" id="reg-name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">ইমেইল</label>
                            <input type="email" id="reg-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">পাসওয়ার্ড</label>
                            <input type="password" id="reg-pass" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">মোবাইল নম্বর (বিকাশ/নগদ)</label>
                            <input type="text" id="reg-phone" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl shadow-lg transition">রেজিস্ট্রেশন</button>
                    </form>
                    <p class="text-xs text-center text-slate-400">ইতিমধ্যে অ্যাকাউন্ট আছে? <button onclick="currentView='login'; renderApp();" class="text-indigo-400 font-bold hover:underline">লগইন করুন</button></p>
                </div>
            `;
                }
                function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            db.collection("users").doc(email).get().then((doc) => {
                if (!doc.exists) { alert("এই ইমেইল দিয়ে কোনো অ্যাকাউন্ট পাওয়া যায়নি!"); return; }
                const u = doc.data();
                if (u.isBlocked) { alert("আপনার অ্যাকাউন্টটি ব্লক করা হয়েছে!"); return; }
                if (u.pass !== pass) { alert("ভুল পাসওয়ার্ড!"); return; }
                currentUser = u;
                localStorage.setItem('paylix_user', JSON.stringify(currentUser));
                currentView = 'dashboard';
                renderApp();
            }).catch((error) => { console.error(error); alert("লগইন করতে সমস্যা হয়েছে।"); });
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const phone = document.getElementById('reg-phone').value;
            db.collection("users").doc(email).get().then((doc) => {
                if (doc.exists) { alert("এই ইমেইল দিয়ে ইতিমধ্যে অ্যাকাউন্ট রয়েছে!"); return; }
                const newUser = { name, email, pass, phone, balance: 0, isVip: false, isBlocked: false, referCount: 0, hasSpunBefore: false };
                db.collection("users").doc(email).set(newUser).then(() => {
                    alert("সফলভাবে অ্যাকাউন্ট তৈরি হয়েছে! এবার লগইন করুন।");
                    currentView = 'login';
                    renderApp();
                });
            });
        }

        function logout() {
            localStorage.removeItem('paylix_user');
            currentUser = null;
            currentView = 'login';
            renderApp();
        }

        function renderDashboard(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl flex justify-between items-center shadow-xl">
                        <div>
                            <h2 class="text-xl font-bold">${currentUser.name} ${currentUser.isVip ? '👑 VIP' : ''}</h2>
                            <p class="text-xs text-slate-400">একাউন্ট: ${currentUser.phone}</p>
                        </div>
                        <button onclick="logout()" class="text-xs bg-red-600/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-xl font-bold hover:bg-red-600/30 transition">লগআউট</button>
                    </div>
                    <div class="bg-gradient-to-r from-indigo-900/40 to-slate-900 border border-indigo-500/30 p-6 rounded-3xl text-center space-y-2 shadow-xl">
                        <p class="text-xs text-slate-400 font-semibold">আপনার বর্তমান ব্যালেন্স</p>
                        <h1 class="text-3xl font-extrabold text-emerald-400">৳${currentUser.balance.toFixed(2)}</h1>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <button onclick="currentView='jobs'; renderApp();" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center hover:border-indigo-500 transition shadow"><i class="fas fa-tasks text-indigo-400 text-lg mb-1"></i><p class="text-xs font-bold">মাইক্রো জব</p></button>
                        <button onclick="currentView='gmail'; renderApp();" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center hover:border-indigo-500 transition shadow"><i class="fas fa-envelope text-pink-400 text-lg mb-1"></i><p class="text-xs font-bold">জিমেইল সেল</p></button>
                        <button onclick="currentView='spin'; renderApp();" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center hover:border-indigo-500 transition shadow"><i class="fas fa-dharmachakra text-amber-400 text-lg mb-1"></i><p class="text-xs font-bold">লাকি স্পিন</p></button>
                        <button onclick="currentView='withdraw'; renderApp();" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center hover:border-indigo-500 transition shadow"><i class="fas fa-wallet text-emerald-400 text-lg mb-1"></i><p class="text-xs font-bold">টাকা উত্তোলন</p></button>
                        <button onclick="currentView='leaderboard'; renderApp();" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center hover:border-indigo-500 transition shadow"><i class="fas fa-trophy text-yellow-400 text-lg mb-1"></i><p class="text-xs font-bold">লিডারবোর্ড</p></button>
                        <button onclick="currentView='vip'; renderApp();" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center hover:border-indigo-500 transition shadow"><i class="fas fa-crown text-purple-400 text-lg mb-1"></i><p class="text-xs font-bold">ভিআইপি পাস</p></button>
                        <button onclick="currentView='support'; renderApp();" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center hover:border-indigo-500 transition shadow"><i class="fas fa-headset text-sky-400 text-lg mb-1"></i><p class="text-xs font-bold">সাপোর্ট</p></button>
                    </div>
                </div>
            `;
        }
                function renderJobs(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex justify-between items-center"><h3 class="text-xl font-bold">📋 মাইক্রো জবস</h3><button onclick="currentView='dashboard'; renderApp();" class="text-xs bg-slate-800 px-3 py-1.5 rounded-xl">ড্যাশবোর্ড</button></div>
                    <div id="job-list" class="space-y-3"><p class="text-xs text-slate-400">লোড হচ্ছে...</p></div>
                </div>
            `;
            db.collection("jobs").get().then((snapshot) => {
                const list = document.getElementById('job-list');
                if(!list) return;
                if(snapshot.empty) { list.innerHTML = `<p class="text-xs text-slate-400">কোনো জব পাওয়া যায়নি।</p>`; return; }
                let html = '';
                snapshot.forEach(doc => {
                    const j = doc.data();
                    let reward = currentUser.isVip ? j.reward * 1.2 : j.reward;
                    html += `
                        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-2">
                            <h4 class="font-bold text-sm text-indigo-400">${j.title}</h4>
                            <p class="text-xs text-slate-300">${j.description}</p>
                            <div class="flex justify-between items-center pt-2">
                                <a href="${j.link}" target="_blank" class="text-xs text-sky-400 underline font-semibold">কাজের লিংক ভিজিট করুন</a>
                                <span class="text-xs font-bold text-emerald-400">৳${reward.toFixed(2)}</span>
                            </div>
                            <div class="flex gap-2 pt-2">
                                <input type="text" id="proof-${doc.id}" placeholder="প্রুফ দিন (যেমন: আপনার ইউজারনেম)" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none">
                                <button onclick="submitJobProof('${doc.id}', ${reward})" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-xl text-xs font-bold transition">জমা দিন</button>
                            </div>
                        </div>
                    `;
                });
                list.innerHTML = html;
            });
        }

        function submitJobProof(jobId, reward) {
            const proof = document.getElementById(`proof-${jobId}`).value;
            if(!proof) { alert("কাজের প্রমাণ লিখুন।"); return; }
            db.collection("job_proofs").add({
                jobId, userEmail: currentUser.email, userName: currentUser.name, proof, reward, status: "Pending", timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => alert("প্রুফ সফলভাবে জমা হয়েছে! অ্যাডমিন যাচাই করে ব্যালেন্স যুক্ত করবেন।"));
        }

        function renderGmail(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-xl">
                    <div class="flex justify-between items-center"><h3 class="text-xl font-bold">📧 জিমেইল সেল</h3><button onclick="currentView='dashboard'; renderApp();" class="text-xs bg-slate-800 px-3 py-1.5 rounded-xl">ড্যাশবোর্ড</button></div>
                    <p class="text-xs text-slate-400">সাধারণ রেট: ৳১৫ | ভিআইপি রেট: ৳১৭ প্রতি জিমেইল।</p>
                    <form onsubmit="submitGmail(event)" class="space-y-3">
                        <input type="email" id="g-email" placeholder="Gmail Address" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs focus:outline-none">
                        <input type="text" id="g-pass" placeholder="Password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs focus:outline-none">
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3 rounded-xl text-xs transition">জিমেইল জমা দিন</button>
                    </form>
                </div>
            `;
        }

        function submitGmail(e) {
            e.preventDefault();
            const gmail = document.getElementById('g-email').value;
            const password = document.getElementById('g-pass').value;
            const rate = currentUser.isVip ? 17 : 15;
            db.collection("gmail_orders").add({
                userEmail: currentUser.email, userName: currentUser.name, gmail, password, rate, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                currentUser.balance += rate;
                db.collection("users").doc(currentUser.email).update({ balance: currentUser.balance }).then(() => {
                    localStorage.setItem('paylix_user', JSON.stringify(currentUser));
                    alert(`জিমেইল সফলভাবে জমা হয়েছে! ব্যালেন্সে ৳${rate} যোগ করা হয়েছে।`);
                    renderApp();
                });
            });
        }
                function renderSpin(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center space-y-4 shadow-xl">
                    <div class="flex justify-between items-center"><h3 class="text-xl font-bold">🎡 লাকি স্পিন</h3><button onclick="currentView='dashboard'; renderApp();" class="text-xs bg-slate-800 px-3 py-1.5 rounded-xl">ড্যাশবোর্ড</button></div>
                    <p class="text-xs text-slate-400">প্রতি স্পিন ফি: ৳১৫</p>
                    <div id="spin-result" class="text-lg font-bold text-emerald-400 py-6">স্পিন করতে নিচে ক্লিক করুন</div>
                    <button onclick="doSpin()" class="w-full bg-gradient-to-r from-amber-500 to-pink-600 hover:opacity-90 font-bold py-3 rounded-xl text-sm transition shadow-lg">স্পিন করুন (৳১৫)</button>
                </div>
            `;
        }

        function doSpin() {
            if (currentUser.balance < 15) { alert("পর্যাপ্ত ব্যালেন্স নেই!"); return; }
            currentUser.balance -= 15;
            let win = 0;
            if (!currentUser.hasSpunBefore) {
                win = Math.random() < 0.7 ? Math.floor(Math.random() * 20) + 10 : 0;
                currentUser.hasSpunBefore = true;
            } else {
                win = 0;
            }
            currentUser.balance += win;
            db.collection("users").doc(currentUser.email).update({ balance: currentUser.balance, hasSpunBefore: currentUser.hasSpunBefore }).then(() => {
                localStorage.setItem('paylix_user', JSON.stringify(currentUser));
                document.getElementById('spin-result').innerText = win > 0 ? `অভিনন্দন! আপনি জিতেছেন ৳${win}` : `দুঃখিত, কোনো বোনাস পাননি!`;
            });
        }

        function renderWithdraw(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-xl">
                    <div class="flex justify-between items-center"><h3 class="text-xl font-bold">💳 টাকা উত্তোলন</h3><button onclick="currentView='dashboard'; renderApp();" class="text-xs bg-slate-800 px-3 py-1.5 rounded-xl">ড্যাশবোর্ড</button></div>
                    <p class="text-xs text-slate-400">উত্তোলনে ১৫% সার্ভিস চার্জ প্রযোজ্য।</p>
                    <form onsubmit="handleWithdraw(event)" class="space-y-3">
                        <select id="w-method" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs focus:outline-none"><option>Bkash</option><option>Nagad</option></select>
                        <input type="text" id="w-num" placeholder="একাউন্ট নম্বর" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs focus:outline-none">
                        <input type="number" id="w-amount" placeholder="টাকার পরিমাণ" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs focus:outline-none">
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl text-xs transition shadow-lg">উত্তোলন রিকোয়েস্ট পাঠান</button>
                    </form>
                </div>
            `;
        }

        function handleWithdraw(e) {
            e.preventDefault();
            const method = document.getElementById('w-method').value;
            const number = document.getElementById('w-num').value;
            const amount = parseFloat(document.getElementById('w-amount').value);
            if (amount > currentUser.balance) { alert("পর্যাপ্ত ব্যালেন্স নেই!"); return; }
            let netAmount = amount - (amount * 0.15);

            currentUser.balance -= amount;
            db.collection("users").doc(currentUser.email).update({ balance: currentUser.balance }).then(() => {
                db.collection("withdrawals").add({
                    userEmail: currentUser.email, userName: currentUser.name, method, number, amount, netAmount, status: "Pending", timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    localStorage.setItem('paylix_user', JSON.stringify(currentUser));
                    alert("উত্তোলন রিকোয়েস্ট সফলভাবে জমা হয়েছে!");
                    renderApp();
                });
            });
        }
                function renderLeaderboard(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto space-y-4">
                    <div class="flex justify-between items-center"><h3 class="text-xl font-bold">🏆 লিডারবোর্ড</h3><button onclick="currentView='dashboard'; renderApp();" class="text-xs bg-slate-800 px-3 py-1.5 rounded-xl">ড্যাশবোর্ড</button></div>
                    <div id="lb-list" class="bg-slate-900 border border-slate-800 rounded-3xl p-4 space-y-2 shadow-xl"><p class="text-xs text-slate-400">লোড হচ্ছে...</p></div>
                </div>
            `;
            db.collection("users").orderBy("balance", "desc").limit(10).get().then((snapshot) => {
                let html = '';
                snapshot.forEach(doc => {
                    const u = doc.data();
                    html += `<div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs"><span class="font-bold">${u.name}</span><span class="text-emerald-400 font-bold">৳${u.balance.toFixed(2)}</span></div>`;
                });
                document.getElementById('lb-list').innerHTML = html;
            });
        }

        function renderVip(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center space-y-4 shadow-xl">
                    <div class="flex justify-between items-center"><h3 class="text-xl font-bold">👑 VIP মেম্বারশিপ</h3><button onclick="currentView='dashboard'; renderApp();" class="text-xs bg-slate-800 px-3 py-1.5 rounded-xl">ড্যাশবোর্ড</button></div>

        function renderAdminDashboard(container) {
            container.innerHTML = `

                        <button onclick="loadAdminTab('vip')" class="px-3 py-1.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800" id="tab-vip">ভিআইপি</button>
                    </div>
                    <div id="adm-tab-content" class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl"></div>
                </div>
            `;
            loadAdminTab('users');
        }

        function loadAdminTab(tabName) {
            ['users', 'withdrawals', 'jobs', 'gmail', 'vip'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if(btn) {
                    btn.className = t === tabName ? "px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white" : "px-3 py-1.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800";
                }
            });
            const cont = document.getElementById('adm-tab-content');
            if(!cont) return;

            if(tabName === 'users') {
                cont.innerHTML = `<h4 class="font-bold text-sm mb-3">সকল ইউজার তালিকা</h4><div id="adm-u-list" class="space-y-2">লোড হচ্ছে...</div>`;
                db.collection("users").get().then(snap => {
                    let html = '';
                    snap.forEach(doc => {
                        const u = doc.data();
                        let isBlocked = u.isBlocked || false;
                        html += `
                            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                                <div><span class="font-bold">${u.name}</span> (${u.email}) - <span class="text-emerald-400 font-bold">৳${u.balance.toFixed(2)}</span></div>
                                <div class="flex gap-2">
                                    <button onclick="adminAdjustBalance('${u.email}', ${u.balance})" class="bg-indigo-600/20 text-indigo-400 px-2 py-1 rounded-lg">ব্যালেন্স এডিট</button>
                                    <button onclick="adminToggleBlock('${u.email}', ${isBlocked})" class="${isBlocked?'text-emerald-400':'text-red-400'} font-bold">${isBlocked?'আনব্লক':'ব্লক'}</button>
                                </div>
                            </div>
                        `;
                    });
                    document.getElementById('adm-u-list').innerHTML = html;
                });
            } else if(tabName === 'withdrawals') {
                cont.innerHTML = `<h4 class="font-bold text-sm mb-3">উত্তোলন রিকোয়েস্ট</h4><div id="adm-w-list" class="space-y-2">লোড হচ্ছে...</div>`;
                db.collection("withdrawals").get().then(snap => {
                    let html = '';
                    if(snap.empty) { cont.innerHTML = `<p class="text-xs text-slate-400">কোনো রিকোয়েস্ট নেই।</p>`; return; }
                    snap.forEach(doc => {
                        const w = doc.data();
                        html += `
                            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                                <div><b>${w.userName}</b> (${w.method}: ${w.number}) - ৳${w.amount} | নিট: ৳${w.netAmount.toFixed(2)} | <span class="${w.status==='Approved'?'text-emerald-400':'text-amber-400'}">${w.status}</span></div>
                                ${w.status==='Pending'?`<button onclick="adminApproveWithdraw('${doc.id}')" class="bg-emerald-600 text-white px-2 py-1 rounded-lg">অনুমোদন</button>`:''}
                            </div>
                        `;
                    });
                    document.getElementById('adm-w-list').innerHTML = html;
                });
            } else if(tabName === 'jobs') {
                cont.innerHTML = `
                    <div class="space-y-4">
                        <form onsubmit="handleAdminPostJob(event)" class="space-y-2 bg-slate-950 p-3 rounded-xl border border-slate-800">
                            <h5 class="font-bold text-xs text-indigo-400">নতুন জব পোস্ট</h5>
                            <input type="text" id="j-title" placeholder="শিরোনাম" required class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs">
                            <input type="text" id="j-desc" placeholder="বিবরণ" required class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs">
                            <input type="url" id="j-link" placeholder="লিংক" required class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs">
                            <input type="number" step="0.5" id="j-reward" placeholder="রিওয়ার্ড (টাকা)" required class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs">
                            <button type="submit" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">পোস্ট করুন</button>
                        </form>
                        <h5 class="font-bold text-xs">জমা হওয়া প্রুফসমূহ</h5>
                        <div id="adm-p-list" class="space-y-2">লোড হচ্ছে...</div>
                    </div>
                `;
                db.collection("job_proofs").get().then(snap => {
                    let html = '';
                    if(snap.empty) { document.getElementById('adm-p-list').innerHTML = `<p class="text-xs text-slate-400">কোনো প্রুফ নেই।</p>`; return; }
                    snap.forEach(doc => {
                        const p = doc.data();
                        html += `
                            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                                <div><b>${p.userName}</b> - প্রুফ: ${p.proof} | রিওয়ার্ড: ৳${p.reward} | <span class="${p.status==='Approved'?'text-emerald-400':'text-amber-400'}">${p.status}</span></div>
                                ${p.status==='Pending'?`<button onclick="adminApproveProof('${doc.id}', '${p.userEmail}', ${p.reward})" class="bg-emerald-600 text-white px-2 py-1 rounded-lg">অনুমোদন</button>`:''}
                            </div>
                        `;
                    });
                    document.getElementById('adm-p-list').innerHTML = html;
                });
            } else if(tabName === 'gmail') {
                cont.innerHTML = `<h4 class="font-bold text-sm mb-3">জমা হওয়া জিমেইল স্টক</h4><div id="adm-g-list" class="space-y-2">লোড হচ্ছে...</div>`;
                db.collection("gmail_orders").get().then(snap => {
                    let html = '';
                    if(snap.empty) { cont.innerHTML = `<p class="text-xs text-slate-400">কোনো জিমেইল নেই।</p>`; return; }
                    snap.forEach(doc => {
                        const g = doc.data();
                        html += `<div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center text-xs"><span><b>${g.userName}</b> - ${g.gmail} : ${g.password} (৳${g.rate})</span><button onclick="adminDeleteGmail('${doc.id}')" class="text-red-400 font-bold">মুছুন</button></div>`;
                    });
                    document.getElementById('adm-g-list').innerHTML = html;
                });
            } else if(tabName === 'vip') {
                cont.innerHTML = `<h4 class="font-bold text-sm mb-3">ভিআইপি রিকোয়েস্ট</h4><div id="adm-v-list" class="space-y-2">লোড হচ্ছে...</div>`;
                db.collection("vip_requests").get().then(snap => {
                    let html = '';
                    if(snap.empty) { cont.innerHTML = `<p class="text-xs text-slate-400">কোনো ভিআইপি রিকোয়েস্ট নেই।</p>`; return; }
                    snap.forEach(doc => {
                        const v = doc.data();
                        html += `
                            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                                <div><b>${v.userName}</b> - TrxID: ${v.trxId} | <span class="${v.status==='Approved'?'text-emerald-400':'text-amber-400'}">${v.status}</span></div>
                                ${v.status==='Pending'?`<button onclick="adminApproveVip('${doc.id}', '${v.userEmail}')" class="bg-emerald-600 text-white px-2 py-1 rounded-lg">অনুমোদন</button>`:''}
                            </div>
                        `;
                    });
                    document.getElementById('adm-v-list').innerHTML = html;
                });
            }
        }

        function adminAdjustBalance(email, currentBal) {
            let amt = parseFloat(prompt(`বর্তমান ব্যালেন্স ৳${currentBal}। কত যোগ (+50) বা বিয়োগ (-50) করতে চান?`));
            if(isNaN(amt)) return;
            db.collection("users").doc(email).update({ balance: currentBal + amt }).then(() => loadAdminTab('users'));
        }

        function adminToggleBlock(email, status) {
            db.collection("users").doc(email).update({ isBlocked: !status }).then(() => loadAdminTab('users'));
        }

        function adminApproveWithdraw(id) {
            db.collection("withdrawals").doc(id).update({ status: "Approved" }).then(() => loadAdminTab('withdrawals'));
        }

        function handleAdminPostJob(e) {
            e.preventDefault();
            const title = document.getElementById('j-title').value;
            const description = document.getElementById('j-desc').value;
            const link = document.getElementById('j-link').value;
            const reward = parseFloat(document.getElementById('j-reward').value);
            db.collection("jobs").add({ title, description, link, reward, timestamp: firebase.firestore.FieldValue.serverTimestamp() }).then(() => loadAdminTab('jobs'));
        }

        function adminApproveProof(proofId, email, reward) {
            db.collection("job_proofs").doc(proofId).update({ status: "Approved" }).then(() => {
                db.collection("users").doc(email).get().then(doc => {
                    if(doc.exists) {
                        let bal = doc.data().balance || 0;
                        db.collection("users").doc(email).update({ balance: bal + reward }).then(() => loadAdminTab('jobs'));
                    }
                });
            });
        }

        function adminDeleteGmail(id) {
            db.collection("gmail_orders").doc(id).delete().then(() => loadAdminTab('gmail'));
        }

        function adminApproveVip(id, email) {
            db.collection("vip_requests").doc(id).update({ status: "Approved" }).then(() => {
                db.collection("users").doc(email).update({ isVip: true }).then(() => loadAdminTab('vip'));
            });
                }

            return `
                <div class="w-full bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 my-4 text-center overflow-hidden shadow-inner">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Sponsored Ad</span>
                        <span class="text-[10px] text-slate-600">Adsterra / Monetag Network</span>
                    </div>
                    <div class="py-6 bg-slate-950/80 rounded-xl border border-dashed border-slate-800 text-slate-400 text-xs flex flex-col items-center justify-center space-y-1">
                        <i class="fas fa-ad text-indigo-400 text-lg"></i>
                        <span>[Ad Banner Slot - High Revenue Impression Area]</span>
                    </div>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', () => {
            if(window.location.hash === '#admin' || window.location.hash === '#adn') {
                currentView = 'admin';
            }
            renderApp();
        });

        window.addEventListener('hashchange', () => {
            if(window.location.hash === '#admin' || window.location.hash === '#adn') {
                currentView = 'admin';
            } else if(currentView === 'admin') {
                currentView = currentUser ? 'dashboard' : 'login';
            }
            renderApp();
        });
    </script>
