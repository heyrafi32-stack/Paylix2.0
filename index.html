<link rel="icon" href="https://i.postimg.cc/PxzQZ9VJ/file-0000000030d882118003721bfa9dff12.png">
<style>
  :root{
    --bg:#160826; --bg2:#1f0b36; --panel:#2a0f47; --panel2:#3a1563;
    --purple:#8b3dff; --purple2:#b478ff; --accent:#00e0a4; --accent2:#ffd166;
    --danger:#ff4d6d; --text:#f3ecff; --muted:#b9a5d6; --border:rgba(180,120,255,.22);
    --shadow:0 10px 40px rgba(139,61,255,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
  html,body{background:var(--bg);color:var(--text);min-height:100vh}
  body{
    background: radial-gradient(1200px 600px at 10% -10%, rgba(139,61,255,.25), transparent 60%),
                radial-gradient(900px 500px at 110% 10%, rgba(0,224,164,.12), transparent 60%), var(--bg);
  }
  a{color:var(--purple2);text-decoration:none}
  button{cursor:pointer;font-family:inherit}
  input,select,textarea{font-family:inherit}
  .hidden{display:none !important}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  .navbar{
    position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);
    background:rgba(22,8,38,.75);border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;padding:10px 16px;
  }
  .brand{display:flex;align-items:center;gap:10px}
  .brand img{width:36px;height:36px;border-radius:10px;box-shadow:0 4px 14px rgba(139,61,255,.6)}
  .brand span{font-weight:800;letter-spacing:1px;font-size:19px;background:linear-gradient(90deg,#b478ff,#00e0a4);-webkit-background-clip:text;background-clip:text;color:transparent}
  .nav-right{display:flex;gap:10px;align-items:center}
  .btn{border:none;border-radius:12px;padding:11px 18px;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--purple),#5b1fb0);box-shadow:0 6px 22px rgba(139,61,255,.45);transition:transform .15s, filter .2s;}
  .btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.accent{background:linear-gradient(135deg,#00e0a4,#009e74);box-shadow:0 6px 22px rgba(0,224,164,.4);color:#062b20}
  .btn.gold{background:linear-gradient(135deg,#ffd166,#e0a800);color:#2a1d00;box-shadow:0 6px 22px rgba(255,209,102,.4)}
  .btn.danger{background:linear-gradient(135deg,#ff4d6d,#a81b35);box-shadow:0 6px 22px rgba(255,77,109,.4)}
  .btn.ghost{background:transparent;border:1px solid var(--border);box-shadow:none;color:var(--text)}
  .btn.small{padding:7px 12px;font-size:12px;border-radius:9px}
  .btn.block{display:block;width:100%}.auth-card{max-width:430px;margin:40px auto;background:linear-gradient(160deg,var(--panel),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:28px;box-shadow:var(--shadow);}
  .auth-card img.logo{width:80px;height:80px;border-radius:20px;display:block;margin:0 auto 14px;box-shadow:var(--shadow)}
  .auth-card h2{text-align:center;font-size:24px;margin-bottom:6px}
  .auth-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.5px;font-weight:600}
  .field input{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);outline:none;font-size:14px;}
  .field input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(139,61,255,.2)}
  .switch-line{text-align:center;font-size:13px;color:var(--muted);margin-top:16px}
  .dash-hero{background:linear-gradient(135deg,#3a1563,#1f0b36);border:1px solid var(--border);border-radius:22px;padding:22px;margin-top:18px;position:relative;overflow:hidden;}
  .dash-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(0,224,164,.35),transparent 70%);}
  .dash-hero small{color:var(--muted);letter-spacing:1px;font-size:12px}
  .balance{font-size:42px;font-weight:800;margin:6px 0;letter-spacing:1px;background:linear-gradient(90deg,#fff,#b478ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .userline{color:var(--muted);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:18px}  .tile{background:linear-gradient(160deg,var(--panel),var(--bg2));border:1px solid var(--border);border-radius:18px;padding:18px;transition:transform .15s;cursor:pointer;}
  .tile:hover{transform:translateY(-3px);border-color:var(--purple)}
  .tile .ico{font-size:26px;margin-bottom:8px;display:block}
  .tile h3{font-size:15px;margin-bottom:4px}
  .tile p{font-size:12px;color:var(--muted)}
  .section{margin-top:22px}
  .section h2{font-size:19px;margin-bottom:12px;letter-spacing:.5px}
  .card{background:linear-gradient(160deg,var(--panel),var(--bg2));border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px;}
  .job-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .job-row .title{font-weight:700;font-size:15px}
  .job-row .desc{font-size:12px;color:var(--muted);margin-top:3px;max-width:520px}
  .pill{background:rgba(0,224,164,.15);color:var(--accent);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:linear-gradient(135deg,var(--purple),#5b1fb0);color:#fff;padding:12px 22px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);transition:transform .35s ease;z-index:10000;max-width:90%;text-align:center;}
  #toast.show{transform:translateX(-50%) translateY(0)}
  #toast.err{background:linear-gradient(135deg,#ff4d6d,#a81b35)}
  #toast.ok{background:linear-gradient(135deg,#00e0a4,#009e74);color:#062b20}
  .wheel-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;padding:10px}
  #wheel{width:260px;height:260px;border-radius:50%;border:8px solid var(--purple2);box-shadow:0 0 40px rgba(139,61,255,.6), inset 0 0 30px rgba(139,61,255,.4);transition:transform 4s cubic-bezier(.17,.67,.12,1);background:conic-gradient(#8b3dff 0deg 45deg, #3a1563 45deg 90deg, #00e0a4 90deg 135deg, #3a1563 135deg 180deg, #ffd166 180deg 225deg, #3a1563 225deg 270deg, #ff4d6d 270deg 315deg, #3a1563 315deg 360deg);position:relative;}
  #wheel::after{content:"🎯";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;filter:drop-shadow(0 0 8px rgba(0,0,0,.5));}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase; background: rgba(139,61,255,0.1);}
  .table-wrap{overflow-x:auto;border-radius:14px}
  table tr:hover { background: rgba(139,61,255,0.05); }
  .badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700}
  .badge.pending{background:rgba(255,209,102,.2);color:var(--accent2)}
  .badge.approved{background:rgba(0,224,164,.2);color:var(--accent)}
  .badge.rejected{background:rgba(255,77,109,.2);color:var(--danger)}
  .badge.cancelled{background:rgba(255,77,109,.2);color:var(--danger)}
  .badge.blocked{background:rgba(255,77,109,.2);color:var(--danger)}
  .badge.active{background:rgba(0,224,164,.2);color:var(--accent)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .tabs button{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted);padding:9px 16px;border-radius:12px;font-size:13px;font-weight:600;}
  .tabs button.active{background:linear-gradient(135deg,var(--purple),#5b1fb0);color:#fff;border-color:transparent}
  .eye{cursor:pointer;user-select:none;font-size:16px}
  .admin-box .field input{background:rgba(255,255,255,.06)}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}
  .foot{text-align:center;color:var(--muted);font-size:12px;padding:26px 0 40px}
  @media(max-width:560px){.balance{font-size:34px}.auth-card{padding:22px}}
</style>
</head>

<script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const page = $("#page");
const state = { user: null, isAdmin: false };

function toast(msg, type=""){
  const t = $("#toast");
  t.textContent = msg;
  t.className = "show " + type;
  clearTimeout(t._tid);
  t._tid = setTimeout(()=>{ t.className = t.className.replace("show","").trim(); }, 2800);
}
function money(n){ return "৳" + Number(n || 0).toFixed(2); }
function esc(s){ return String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function emailKey(email){ return email.toLowerCase().trim(); }
function saveSession(email){ localStorage.setItem("paylix_user", emailKey(email)); }
function getSession(){ return localStorage.getItem("paylix_user"); }
function clearSession(){ localStorage.removeItem("paylix_user"); }async function boot(){
  $("#app").classList.remove("hidden");
  const hash = (location.hash || "").toLowerCase();
  if (hash === "#admin" || hash === "#adn") { renderAdminLogin(); return; }
  const urlParams = new URLSearchParams(window.location.search);
  const refParam = urlParams.get('ref');
  if (refParam) localStorage.setItem('paylix_ref', refParam);

  const email = getSession();
  if (email) {
    const snap = await getDoc(doc(db, "users", email));
    if (snap.exists()) {
      const data = snap.data();
      if (data.blocked) { clearSession(); toast("আপনার অ্যাকাউন্ট ব্লক করা হয়েছে।", "err"); renderAuth("login"); return; }
      state.user = { email, ...data };
      if (localStorage.getItem("paylix_joined") === "yes") renderDashboard();
      else renderCommunityJoin();
      return;
    }
    clearSession();
  }
  renderAuth("login");
}
window.addEventListener("hashchange", ()=>{
  const hash = (location.hash || "").toLowerCase();
  if (hash === "#admin" || hash === "#adn") renderAdminLogin();
  else if (state.user) renderDashboard();
  else renderAuth("login");
});
boot();

function renderCommunityJoin(){
  page.innerHTML = `
    <div class="auth-card" style="margin-top:20px; max-width:480px;">
      <img class="logo" src="${LOGO}" alt="Paylix"/>
      <h2 style="text-align:center; color:var(--accent2)">🚀 Join Our Community</h2>
      <p class="sub">ড্যাশবোর্ডে প্রবেশ করতে নিচের ৩টি স্টেপ সম্পন্ন করুন</p>
      <div class="card" style="margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
        <div><b>1. YouTube</b><br><span style="font-size:12px; color:var(--muted)">চ্যানেল সাবস্ক্রাইব করুন</span></div>
        <a href="${YT_LINK}" target="_blank" class="btn small danger">Subscribe</a>
      </div>
      <div class="card" style="margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
        <div><b>2. Telegram Group</b><br><span style="font-size:12px; color:var(--muted)">গ্রুপে জয়েন করুন</span></div>
        <a href="${TG_GROUP}" target="_blank" class="btn small accent">Join Group</a>
      </div>
      <div class="card" style="margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;">
        <div><b>3. Telegram Channel</b><br><span style="font-size:12px; color:var(--muted)">চ্যানেলে জয়েন করুন</span></div>
        <a href="${TG_CHANNEL}" target="_blank" class="btn small accent">Join Channel</a>
      </div>
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px; background:rgba(255,255,255,0.05); padding:12px; border-radius:10px; border:1px solid var(--border);">
        <input type="checkbox" id="joinCheck" style="width:20px; height:20px; accent-color:var(--accent); cursor:pointer;" />
        <label for="joinCheck" style="font-size:13px; cursor:pointer; color:var(--text);">আমি সবগুলোতে জয়েন করেছি</label>
      </div>
      <button class="btn accent block" id="verifyJoin" style="opacity:0.5; pointer-events:none;">Verify & Continue</button>
      <div class="switch-line" style="margin-top:15px;">সাপোর্ট প্রয়োজন? <a href="https://t.me/${TG_USERNAME}" target="_blank">@${TG_USERNAME}</a></div>
    </div>`;
  const check = $("#joinCheck"), btn = $("#verifyJoin");
  check.onchange = ()=>{
    if (check.checked) { btn.style.opacity = "1"; btn.style.pointerEvents = "auto"; } 
    else { btn.style.opacity = "0.5"; btn.style.pointerEvents = "none"; }
  };
  btn.onclick = ()=>{
    localStorage.setItem("paylix_joined", "yes");
    toast("ধন্যবাদ! ড্যাশবোর্ড আনলক হয়েছে ✅", "ok");
    renderDashboard();
  };
                      }function renderAuth(mode="login"){
  state.user = null; state.isAdmin = false;
  $("#navUser").textContent = ""; $("#logoutBtn").classList.add("hidden");
  page.innerHTML = `
    <div class="auth-card">
      <img class="logo" src="${LOGO}" alt="Paylix"/>
      <h2>${mode === "login" ? "Welcome Back" : "Create Account"}</h2>
      <p class="sub">${mode === "login" ? "Log in to continue earning" : "Join Paylix and start earning today"}</p>
      ${mode === "register" ? `<div class="field"><label>Full Name</label><input id="regName" placeholder="Your name" autocomplete="name"/></div>` : ""}
      <div class="field"><label>Email</label><input id="authEmail" type="email" placeholder="you@example.com" autocomplete="email"/></div>
      <div class="field"><label>Password</label><input id="authPass" type="password" placeholder="••••••••" autocomplete="current-password"/></div>
      ${mode === "register" ? `<div class="field"><label>Referral Email (optional)</label><input id="regRef" type="email" placeholder="referrer@example.com" value="${localStorage.getItem('paylix_ref') || ''}"/></div>` : ""}
      <button class="btn block" id="authSubmit">${mode === "login" ? "Login" : "Register"}</button>
      <div class="switch-line">
        ${mode === "login" ? `নতুন? <a href="#" id="switchAuth">Register করুন</a>` : `অ্যাকাউন্ট আছে? <a href="#" id="switchAuth">Login করুন</a>`}
      </div>
    </div>`;
  $("#switchAuth").onclick = (e)=>{ e.preventDefault(); renderAuth(mode === "login" ? "register" : "login"); };
  $("#authSubmit").onclick = ()=> mode === "login" ? doLogin() : doRegister();
}

async function doRegister(){
  const name = $("#regName").value.trim(), email = emailKey($("#authEmail").value);
  const pass = $("#authPass").value, refEmail = emailKey($("#regRef").value || "");
  if (!name || !email || !pass) return toast("সব ঘর পূরণ করুন।", "err");
  if (!/^\S+@\S+\.\S+$/.test(email)) return toast("সঠিক ইমেইল দিন।", "err");
  if (pass.length < 4) return toast("পাসওয়ার্ড কমপক্ষে ৪ অক্ষর।", "err");
  if (email === ADMIN_EMAIL) return toast("এই ইমেইল ব্যবহার করা যাবে না।", "err");
  const ref = await getDoc(doc(db, "users", email));
  if (ref.exists()) return toast("এই ইমেইলে অ্যাকাউন্ট আছে।", "err");
  let referredBy = "";
  if (refEmail) {
    if (refEmail === email) return toast("নিজেকে রেফার করা যাবে না।", "err");
    const rSnap = await getDoc(doc(db, "users", refEmail));
    if (!rSnap.exists()) return toast("রেফার ইমেইল পাওয়া যায়নি।", "err");
    referredBy = refEmail;
  }
  const data = { name, email, password: pass, referredBy, balance: 0, hasSpunBefore: false, blocked: false, totalEarned: 0, createdAt: serverTimestamp() };
  await setDoc(doc(db, "users", email), data);
  saveSession(email); state.user = { email, ...data };
  toast("রেজিস্ট্রেশন সফল! 🎉", "ok"); renderCommunityJoin();
}async function doLogin(){
  const email = emailKey($("#authEmail").value), pass = $("#authPass").value;
  if (!email || !pass) return toast("ইমেইল ও পাসওয়ার্ড দিন।", "err");
  const snap = await getDoc(doc(db, "users", email));
  if (!snap.exists()) return toast("অ্যাকাউন্ট পাওয়া যায়নি।", "err");
  const data = snap.data();
  if (data.password !== pass) return toast("পাসওয়ার্ড ভুল।", "err");
  if (data.blocked) return toast("আপনার অ্যাকাউন্ট ব্লকড।", "err");
  saveSession(email); state.user = { email, ...data };
  toast("লগইন সফল!", "ok");
  if (localStorage.getItem("paylix_joined") === "yes") renderDashboard();
  else renderCommunityJoin();
}

async function refreshUser(){
  const snap = await getDoc(doc(db, "users", state.user.email));
  if (snap.exists()) state.user = { email: state.user.email, ...snap.data() };
}

async function renderDashboard(){
  await refreshUser();
  $("#navUser").textContent = state.user.name || state.user.email;
  $("#logoutBtn").classList.remove("hidden");
  let noticeText = "Paylix-এ স্বাগতম! নিয়ম মেনে কাজ করুন।"; 
  try { const snap = await getDoc(doc(db, "settings", "notice")); if (snap.exists()) noticeText = snap.data().text; } catch(e) {}
  const topSnap = await getDocs(query(collection(db, "users"), orderBy("totalEarned", "desc")));
  const topUsers = []; topSnap.forEach(d => { if(topUsers.length < 5 && d.data().email !== ADMIN_EMAIL) topUsers.push(d.data()); });
  const jobsSnap = await getDocs(query(collection(db, "jobs"), orderBy("createdAt", "desc")));
  const jobs = jobsSnap.docs.map(d=>({ id: d.id, ...d.data() }));

  page.innerHTML = `
    <div class="dash-hero">
      <small>বর্তমান ব্যালেন্স</small>
      <div class="balance" id="balDisplay">${money(state.user.balance)}</div>
      <div class="userline">👋 ${esc(state.user.name)} • ${esc(state.user.email)}</div>
    </div>
    <div class="card" style="background:rgba(255,209,102,0.1); border-color:var(--accent2); color:var(--accent2); font-size:13px; margin-top:12px; display:flex; align-items:center; gap:10px;">
      <span style="font-size:18px;">📢</span> <div>${esc(noticeText)}</div>
    </div>    <div class="grid">
      <div class="tile" id="goJobs"><span class="ico">💼</span><h3>Micro Jobs</h3><p>কাজ করে আয় করুন</p></div>

      <div class="tile" id="goWithdraw"><span class="ico">💸</span><h3>Withdraw</h3><p>বিকাশ / নগদ (min ৳${MIN_WITHDRAW})</p></div>
      <div class="tile" id="goInvite"><span class="ico">🎁</span><h3>Invite Friends</h3><p>বন্ধু রেফার করে ১০% বোনাস নিন</p></div>
      <div class="tile" id="goSupport"><span class="ico">🎧</span><h3>Support</h3><p>২৪/৭ হেল্প সেন্টার</p></div>
    </div>

    <div class="section">
      <h2>🏆 Top Earners</h2>
      <div class="card">
        ${topUsers.length ? topUsers.map((u, i) => `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border);">
            <div style="display:flex; gap:10px; align-items:center;">
              <b style="color:${i===0?'#ffd166':i===1?'#b478ff':i===2?'#00e0a4':'var(--muted)'}; font-size:16px;">#${i+1}</b>
              <span>${esc(u.name || "User")}</span>
            </div>

          </div>`).join("") : `<div style="color:var(--muted); text-align:center;">কেউ এখনো আয় করেনি।</div>`}

    </div>

    <div class="section">
      <h2>💼 Available Micro Jobs</h2>
      <div id="jobsList">
        ${jobs.length ? jobs.map(j => `

            <div class="job-row">
              <div><div class="title">${esc(j.title)}</div><div class="desc">${esc(j.description || "")}</div></div>
              <span class="pill">৳${Number(j.reward||0).toFixed(2)}</span>
            </div>
            <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
              <a class="btn small" href="${esc(j.link)}" target="_blank" rel="noopener" onclick="startJobTimer('${j.id}')">কাজ করুন</a>
              <button class="btn small accent" id="jobBtn_${j.id}" onclick="submitJobProof('${j.id}', '${esc(j.title)}', ${j.reward})" disabled style="opacity:0.5;">জমা দিন (৩০s)</button>
            </div>
          </div>`).join("") : `<div class="card" style="color:var(--muted)">এই মুহূর্তে কোনো কাজ নেই।</div>`}
      </div>

    <div class="section">
      <h2>📊 আমার কার্যক্রম</h2>

          <thead><tr><th>Type</th><th>Amount</th><th>Status</th><th>Time</th></tr></thead>
          <tbody id="historyBody"><tr><td colspan="4" style="color:var(--muted)">লোড হচ্ছে...</td></tr></tbody>
        </table></div></div>
    </div>`;
  $("#goJobs").onclick = ()=> page.scrollIntoView({behavior:"smooth"});
  $("#goSponsor").onclick = renderSponsorTasks;
  $("#goAdMarket").onclick = renderAdMarket;
  $("#goGmail").onclick = renderGmailSell;
  $("#goSpin").onclick = renderSpin;
  $("#goWithdraw").onclick = renderWithdraw;
  $("#goInvite").onclick = renderInvite;
  $("#goSupport").onclick = renderSupport;
  $("#logoutBtn").onclick = ()=>{ clearSession(); state.user=null; location.hash=""; renderAuth("login"); };
  loadHistory();
}async function loadHistory(){
  try{
    const wSnap = await getDocs(query(collection(db, "withdraws"), where("email","==",state.user.email)));
    const gSnap = await getDocs(query(collection(db, "gmails"), where("email","==",state.user.email)));
    const sSnap = await getDocs(query(collection(db, "sponsorSubs"), where("userEmail","==",state.user.email)));
    const rows = [];
    wSnap.forEach(d=>{ const x = d.data(); let statusText = x.status; if (x.status === "approved" && x.paymentRef) { statusText = `approved (Ref: ${x.paymentRef})`; } rows.push({ type: "Withdraw", amount: "-৳" + Number(x.amount || 0).toFixed(2), status: statusText, ts: x.createdAt }); });
    gSnap.forEach(d=>{ const x=d.data(); rows.push({type:"Gmail Sell", amount:"+৳"+Number(x.reward||0).toFixed(2), status:x.status||"pending", ts:x.createdAt}); });
    sSnap.forEach(d=>{ const x=d.data(); rows.push({type:"Sponsor Task", amount:"+৳"+Number(x.payout||0).toFixed(2), status:x.status, ts:x.createdAt}); });
    rows.sort((a,b)=> (b.ts?.seconds||0)-(a.ts?.seconds||0));
    const tb = $("#historyBody"); if (!tb) return;
    tb.innerHTML = rows.length ? rows.map(r=>`<tr><td>${esc(r.type)}</td><td>${esc(r.amount)}</td><td><span class="badge ${r.status.split(" ")[0]}">${esc(r.status)}</span></td><td>${r.ts?.toDate ? r.ts.toDate().toLocaleString() : "—"}</td></tr>`).join("") : `<tr><td colspan="4" style="color:var(--muted)">কোনো রেকর্ড নেই।</td></tr>`;
  }catch(e){ console.error(e); }
}

function renderGmailSell(){

      <img class="logo" src="${LOGO}"/><h2>📧 Gmail Sell</h2>

      <div class="field"><label>Gmail Address</label><input id="gEmail" placeholder="example@gmail.com"/></div>

      <button class="btn accent block" id="gSubmit">সাবমিট করুন</button>
    </div>`;
  $("#backBtn").onclick = renderDashboard;
  $("#gSubmit").onclick = async ()=>{
    const gEmail = $("#gEmail").value.trim(), gPass = $("#gPass").value.trim();
    if (!gEmail || !gPass) return toast("সব তথ্য দিন।", "err");
    if (!/^\S+@\S+\.\S+$/.test(gEmail)) return toast("সঠিক জিমেইল দিন।", "err");
    await addDoc(collection(db, "gmails"), { email: state.user.email, gmail: gEmail, gmailPass: gPass, reward: GMAIL_SELL_RATE, status: "pending", createdAt: serverTimestamp() });
    toast("জিমেইল সাবমিট হয়েছে! অ্যাডমিন Approve করলে টাকা যোগ হবে ✅", "ok"); renderDashboard();
  };
}

function renderSpin(){
  const spun = !!state.user.hasSpunBefore;
  page.innerHTML = `
    <button class="btn ghost small" id="backBtn">← Back</button>
    <div class="auth-card" style="margin-top:16px;max-width:520px">
      <h2 style="text-align:center">🎡 Lucky Spin</h2>
      <p class="sub">স্পিন ফি ৳${SPIN_FEE} • প্রথম স্পিনে নিশ্চিত ৳${FIRST_SPIN_REWARD}</p>
      <div class="wheel-wrap">
        <div id="wheel"></div>
        <div style="color:var(--muted);font-size:13px;text-align:center">${spun ? "⚠️ আপনি আগে স্পিন করেছেন — পরবর্তী স্পিনে কোনো রিওয়ার্ড নেই।" : "🎁 আপনার প্রথম স্পিন — নিশ্চিত ৳"+FIRST_SPIN_REWARD}</div>
        <button class="btn gold block" id="spinBtn" style="max-width:260px">Spin Now (৳${SPIN_FEE})</button>
      </div>
    </div>`;
  $("#backBtn").onclick = renderDashboard;
  let spinning = false;
  $("#spinBtn").onclick = async ()=>{
    if (spinning) return; await refreshUser();
    if (state.user.balance < SPIN_FEE) return toast("পর্যাপ্ত ব্যালেন্স নেই।", "err");
    spinning = true;
    const isFirst = !state.user.hasSpunBefore, reward = isFirst ? FIRST_SPIN_REWARD : 0;
    const wheel = $("#wheel"); wheel.style.transform = `rotate(${5 + Math.random()*3}deg)`;
    setTimeout(async ()=>{
      await updateDoc(doc(db,"users",state.user.email), { balance: increment(reward - SPIN_FEE), totalEarned: increment(reward), hasSpunBefore: true });
      await addDoc(collection(db,"spins"), { email: state.user.email, fee: SPIN_FEE, reward, createdAt: serverTimestamp() });
      toast(reward > 0 ? `🎉 আপনি জিতেছেন ৳${reward}!` : `😢 এবার ৳${reward} — আবার চেষ্টা করুন`, reward>0?"ok":"err");
      spinning = false; renderDashboard();
    }, 4200);
  };
}

window.startJobTimer = function(jobId) {
  const btn = document.getElementById(`jobBtn_${jobId}`);
  if (!btn || btn.dataset.started === "1") return;
  btn.dataset.started = "1"; let timeLeft = 30;
  const interval = setInterval(() => {
    timeLeft--; btn.textContent = `জমা দিন (${timeLeft}s)`;
    if (timeLeft <= 0) { clearInterval(interval); btn.textContent = "জমা দিন"; btn.disabled = false; btn.style.opacity = "1"; }
  }, 1000);
};
window.submitJobProof = async function(jobId, title, reward){
  const proof = prompt("টাস্ক সম্পন্ন করার প্রমাণ (যেমন: আপনার নাম বা আইডি) দিন:");
  if (!proof) return toast("প্রমাণ ছাড়া জমা দেওয়া যাবে না।", "err");
  await addDoc(collection(db, "jobProofs"), { userEmail: state.user.email, jobId, jobTitle: title, proof, reward: Number(reward), status: "pending", createdAt: serverTimestamp() });
  toast("কাজ জমা হয়েছে! অ্যাডমিন Approve করলে টাকা পাবেন ✅", "ok");
};function renderWithdraw(){
  page.innerHTML = `
    <button class="btn ghost small" id="backBtn">← Back</button>
    <div class="auth-card" style="margin-top:16px">
      <h2 style="text-align:center">💸 Withdraw</h2>
      <p class="sub">সর্বনিম্ন ৳${MIN_WITHDRAW} • ১৫% চার্জ প্রযোজ্য</p>
      <div class="field"><label>Method</label>
        <select id="wMethod" style="width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text)">
          <option value="bKash">bKash</option><option value="Nagad">Nagad</option>
        </select>
      </div>
      <div class="field"><label>Account Number</label><input id="wNumber" placeholder="01XXXXXXXXX"/></div>
      <div class="field"><label>Amount (৳)</label><input id="wAmount" type="number" min="${MIN_WITHDRAW}" placeholder="${MIN_WITHDRAW}"/></div>
      <div class="card" style="background:rgba(255,209,102,.08);border-color:rgba(255,209,102,.3);font-size:13px;color:var(--accent2)">⚠️ চার্জ ১৫% কাটা হবে। আপনি পাবেন: <b id="wNet">৳0.00</b></div>
      <button class="btn accent block" id="wSubmit">Request Withdraw</button>
    </div>`;
  $("#backBtn").onclick = renderDashboard;
  const amtEl = $("#wAmount"), netEl = $("#wNet");
  amtEl.oninput = ()=>{ netEl.textContent = money(Number(amtEl.value||0) * (1 - WITHDRAW_CHARGE)); };
  $("#wSubmit").onclick = async ()=>{
    const method = $("#wMethod").value, number = $("#wNumber").value.trim(), amount = Number(amtEl.value);
    if (!number || number.length < 11) return toast("সঠিক নাম্বার দিন।", "err");
    if (!amount || amount < MIN_WITHDRAW) return toast(`সর্বনিম্ন ৳${MIN_WITHDRAW}`, "err");
    await refreshUser(); if (state.user.balance < amount) return toast("পর্যাপ্ত ব্যালেন্স নেই।", "err");
    const gSnap = await getDocs(query(collection(db, "gmails"), where("email","==",state.user.email)));
    const jSnap = await getDocs(query(collection(db, "jobProofs"), where("userEmail","==",state.user.email)));
    const sSnap = await getDocs(query(collection(db, "sponsorSubs"), where("userEmail","==",state.user.email)));
    let approvedTasks = 0;
    gSnap.forEach(d => { if(d.data().status === "approved") approvedTasks++; });
    jSnap.forEach(d => { if(d.data().status === "approved") approvedTasks++; });
    sSnap.forEach(d => { if(d.data().status === "approved") approvedTasks++; });
    if (approvedTasks < 1) return toast("প্রথমে অন্তত ১টি কাজ সম্পন্ন করুন, তারপর টাকা তুলুন।", "err");
    await updateDoc(doc(db,"users",state.user.email), { balance: increment(-amount) });
    await addDoc(collection(db,"withdraws"), { email: state.user.email, name: state.user.name, method, number, amount, netAmount: amount * (1 - WITHDRAW_CHARGE), status: "pending", createdAt: serverTimestamp() });
    toast("উইথড্র রিকোয়েস্ট পাঠানো হয়েছে ✅", "ok"); renderDashboard();
  };
}
