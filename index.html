            <div class="flex justify-center space-x-6 text-xs font-medium">

                <a href="https://t.me/paylix_official" target="_blank" class="hover:text-indigo-400 transition"><i class="fab fa-telegram-plane text-sky-400"></i> অফিসিয়াল চ্যানেল</a>

    <!-- Application Script -->
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AlzaSyAt87cMTIiJyXtpfIfLiLfZfa7WX1g9Mg",
            authDomain: "paylix-586b1.firebaseapp.com",
            projectId: "paylix-586b1",
            storageBucket: "paylix-586b1.appspot.com",
            messagingSenderId: "353074453470",
            appId: "1:353074453470:web:679e99a4021eeed9499b4f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // App State
        let currentUser = JSON.parse(localStorage.getItem('paylix_user')) || null;
        let currentView = 'dashboard';

        // Check hash for admin panel (#admin or #adn)
        window.addEventListener('hashchange', checkAdminHash);
        window.addEventListener('load', () => {
            checkAdminHash();
            renderApp();
        });        function checkAdminHash() {
            if (window.location.hash === '#admin' || window.location.hash === '#adn') {
                currentView = 'admin';
                renderApp();
            }
        }

        function switchView(viewName) {
            currentView = viewName;
            if(viewName !== 'admin') {
                window.location.hash = '';
            }
            renderApp();
        }

        // --- AUTHENTICATION & UI RENDERERS ---
        function renderApp() {
            renderNav();
            const container = document.getElementById('app-view-container');
            
            if (!currentUser && currentView !== 'admin' && currentView !== 'login' && currentView !== 'register') {
                renderLanding(container);
                return;
            }

            if (currentView === 'login') {
                renderLogin(container);
            } else if (currentView === 'register') {
                renderRegister(container);
            } else if (currentView === 'admin') {
                renderAdminPanel(container);
            } else if (currentUser) {
                if (currentUser.isBlocked) {
                    container.innerHTML = `
                        <div class="max-w-md mx-auto bg-red-950/40 border border-red-500/30 rounded-2xl p-8 text-center space-y-4 my-12">
                            <div class="w-16 h-16 bg-red-500/20 text-red-400 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">🚫</div>
                            <h2 class="text-2xl font-bold text-red-400">আপনার অ্যাকাউন্টটি ব্লক করা হয়েছে!</h2>
                            <p class="text-slate-300 text-sm">অনিয়ম বা শর্ত ভঙ্গের কারণে অ্যাডমিন আপনার অ্যাকাউন্ট সাময়িকভাবে বা স্থায়ীভাবে ব্লক করেছেন। সহায়তার জন্য যোগাযোগ করুন।</p>
                            <a href="https://t.me/Owner_Paylix" target="_blank" class="inline-block bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2.5 rounded-xl transition">হেল্পলাইনে যোগাযোগ করুন</a>
                            <div class="pt-4"><button onclick="logout()" class="text-xs text-slate-400 hover:text-white underline">লগআউট করুন</button></div>
                        </div>
                    `;
                    return;
                }

                if (currentView === 'dashboard') renderDashboard(container);
                else if (currentView === 'jobs') renderJobs(container);
                else if (currentView === 'gmail') renderGmail(container);
                else if (currentView === 'spin') renderSpin(container);
                else if (currentView === 'withdraw') renderWithdraw(container);
                else if (currentView === 'leaderboard') renderLeaderboard(container);
                else if (currentView === 'vip') renderVip(container);
                else if (currentView === 'support') renderSupport(container);
            }
        }

        function renderNav() {
            const navSec = document.getElementById('auth-nav-section');
            if (currentUser) {
                navSec.innerHTML = `

                `;
            }
        }

        function logout() {
            localStorage.removeItem('paylix_user');
            currentUser = null;
            currentView = 'dashboard';
            renderApp();
                          }        // --- VIEWS CODE ---

                    <div class="flex justify-center gap-4 pt-4">
                        <button onclick="switchView('register')" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-8 py-3 rounded-2xl shadow-xl shadow-indigo-600/30 transition">অ্যাকাউন্ট খুলুন</button>
                        <button onclick="switchView('login')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold px-8 py-3 rounded-2xl border border-slate-700 transition">লগইন করুন</button>
                    </div>
                </div>
            `;
        }

        function renderLogin(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl my-6">
                    <h3 class="text-2xl font-bold text-center mb-6">লগইন করুন</h3>
                    <form onsubmit="handleLogin(event)" class="space-y-4">

                </div>
            `;
        }

        function renderRegister(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl my-6">

                            <input type="email" id="reg-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">

                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">পাসওয়ার্ড</label>
                            <input type="password" id="reg-pass" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">

                    </form>
                    <p class="text-center text-xs text-slate-400 mt-6">ইতিমধ্যে অ্যাকাউন্ট আছে? <span onclick="switchView('login')" class="text-indigo-400 cursor-pointer font-semibold underline">লগইন করুন</span></p>
                </div>
            `;
        }        // --- DASHBOARD ---
        function renderDashboard(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <!-- User Welcome Banner -->
                    <div class="bg-gradient-to-r from-indigo-900/60 to-purple-900/60 border border-indigo-500/30 rounded-3xl p-6 flex flex-col md:flex-row justify-between items-center gap-4 shadow-xl">
                        <div>
                            <h2 class="text-2xl font-bold">স্বাগতম, ${currentUser.name}! 👋</h2>
                            <p class="text-xs text-indigo-200 mt-1">আপনার Paylix অ্যাকাউন্টটি বর্তমানে সম্পূর্ণ সচল রয়েছে।</p>
                        </div>
                        <div class="bg-slate-900/80 border border-indigo-500/40 px-6 py-3 rounded-2xl text-center">
                            <span class="text-xs text-slate-400 block uppercase tracking-wider">বর্তমান ব্যালেন্স</span>
                            <span class="text-2xl font-extrabold text-emerald-400">৳<span id="dash-bal">${currentUser.balance.toFixed(2)}</span></span>
                        </div>
                    </div>

                    <!-- Navigation Grid -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div onclick="switchView('jobs')" class="bg-slate-900 border border-slate-800 hover:border-indigo-500/50 p-5 rounded-2xl cursor-pointer transition text-center space-y-2 group">
                            <div class="w-12 h-12 bg-indigo-500/10 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto text-xl group-hover:scale-110 transition"><i class="fas fa-briefcase"></i></div>
                            <h4 class="font-bold text-sm">Micro Jobs</h4>
                            <p class="text-[11px] text-slate-400">কাজ করে আয় করুন</p>
                        </div>
                        <div onclick="switchView('gmail')" class="bg-slate-900 border border-slate-800 hover:border-pink-500/50 p-5 rounded-2xl cursor-pointer transition text-center space-y-2 group">
                            <div class="w-12 h-12 bg-pink-500/10 text-pink-400 rounded-2xl flex items-center justify-center mx-auto text-xl group-hover:scale-110 transition"><i class="fas fa-envelope"></i></div>
                            <h4 class="font-bold text-sm">Gmail Sell</h4>
                            <p class="text-[11px] text-slate-400">জিমেইল বিক্রি করুন</p>
                        </div>
                        <div onclick="switchView('spin')" class="bg-slate-900 border border-slate-800 hover:border-amber-500/50 p-5 rounded-2xl cursor-pointer transition text-center space-y-2 group">
                            <div class="w-12 h-12 bg-amber-500/10 text-amber-400 rounded-2xl flex items-center justify-center mx-auto text-xl group-hover:scale-110 transition"><i class="fas fa-dharmachakra"></i></div>
                            <h4 class="font-bold text-sm">Lucky Spin</h4>
                            <p class="text-[11px] text-slate-400">স্পিন করে ভাগ্য পরীক্ষা</p>
                        </div>
                        <div onclick="switchView('withdraw')" class="bg-slate-900 border border-slate-800 hover:border-emerald-500/50 p-5 rounded-2xl cursor-pointer transition text-center space-y-2 group">
                            <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto text-xl group-hover:scale-110 transition"><i class="fas fa-wallet"></i></div>
                            <h4 class="font-bold text-sm">Withdraw</h4>
                            <p class="text-[11px] text-slate-400">টাকা উত্তোলন করুন</p>
                        </div>
                    </div>

                    <!-- Additional Features Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div onclick="switchView('leaderboard')" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl cursor-pointer hover:border-indigo-500/40 transition flex items-center space-x-4">

                            <div>

                            </div>
                        </div>
                        <div onclick="switchView('vip')" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl cursor-pointer hover:border-pink-500/40 transition flex items-center space-x-4">
                            <div class="w-10 h-10 bg-pink-500/10 text-pink-400 rounded-xl flex items-center justify-center"><i class="fas fa-crown"></i></div>
                            <div>
                                <h5 class="font-bold text-sm">VIP মেম্বারশিপ</h5>
                                <p class="text-xs text-slate-400">${currentUser.isVip ? 'সক্রিয় VIP অ্যাকাউন্ট' : 'ভিআইপি হয়ে আয় বাড়ান'}</p>
                            </div>
                        </div>
                        <div onclick="switchView('support')" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl cursor-pointer hover:border-sky-500/40 transition flex items-center space-x-4">
                            <div class="w-10 h-10 bg-sky-500/10 text-sky-400 rounded-xl flex items-center justify-center"><i class="fas fa-headset"></i></div>

                                <p class="text-xs text-slate-400">যেকোনো সমস্যায় যোগাযোগ</p>

              // --- MICRO JOBS ---
        function renderJobs(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xl font-bold">Micro Jobs (মাইক্রো জবস)</h3>
                        <button onclick="switchView('dashboard')" class="text-xs bg-slate-800 px-3 py-1.5 rounded-xl text-slate-300 hover:text-white">ড্যাশবোর্ড</button>
                    </div>
                    <div id="jobs-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <p class="text-slate-400 text-sm">লোড হচ্ছে...</p>
                    </div>
                </div>
            `;
            loadJobsList();
        }

        function loadJobsList() {
            db.collection("jobs").get().then((snapshot) => {
                const list = document.getElementById('jobs-list');
                if (!list) return;
                if (snapshot.empty) {
                    list.innerHTML = `<p class="text-slate-400 text-sm col-span-2 text-center py-8">এই মুহূর্তে কোনো জব উপলব্ধ নেই।</p>`;
                    return;
                }
                let html = '';
                snapshot.forEach((doc) => {
                    const job = doc.data();
                    let reward = currentUser && currentUser.isVip ? job.reward * 1.2 : job.reward;
                    html += `
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
                            <div class="flex justify-between items-start">
                                <h4 class="font-bold text-base text-indigo-300">${job.title}</h4>
                                <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full text-xs font-bold">৳${reward.toFixed(2)}</span>
                            </div>
                            <p class="text-xs text-slate-300">${job.description}</p>

        function adminAdjustBalance(email, currentBal) {
            let amountStr = prompt(`বর্তমান ব্যালেন্স ৳${currentBal}। কত টাকা যোগ (যেমন: 50) বা বিয়োগ (যেমন: -50) করতে চান?`);
            if(!amountStr) return;
            let diff = parseFloat(amountStr);
            if(isNaN(diff)) {
                alert("সঠিক পরিমাণ লিখুন।");
                return;
            }
            let newBal = currentBal + diff;
            db.collection("users").doc(email).update({ balance: newBal }).then(() => {
                alert("ব্যালেন্স সফলভাবে আপডেট করা হয়েছে!");
                loadAdminTab('users');
            });
        }
