<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Paylix</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;background:#0d1b15;color:#fff;display:flex;justify-content:center;overflow-x:hidden}
  .app{width:100%;max-width:500px;min-height:100vh;padding:16px;padding-bottom:90px;position:relative}
  .page{display:none}.page.active{display:block}
  #page-splash{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;position:fixed;top:0;left:0;width:100%;z-index:999;background:#0d1b15}
  .splash-logo{width:100px;border-radius:22px;margin-bottom:15px}
  .splash-text{font-size:1.8rem;font-weight:800;color:#34d399}
  .form-box{background:#132e22;border:1px solid #1f4e38;border-radius:16px;padding:16px;margin-bottom:14px}
  .field{margin-bottom:12px}.field label{font-size:0.75rem;color:#a7f3d0;display:block;margin-bottom:4px}
  .field input,.field select{width:100%;padding:12px;border-radius:10px;border:1px solid #1f4e38;background:#0d1b15;color:#fff;font-size:0.9rem;outline:none}
  .btn{border:none;cursor:pointer;font-weight:600;border-radius:12px;padding:12px;font-size:0.9rem;color:#fff;width:100%;background:#10b981}
  .back-btn{color:#34d399;font-size:0.85rem;cursor:pointer;margin-bottom:12px;font-weight:600}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:0.75rem}
  th,td{padding:8px;border-bottom:1px solid #1f4e38;text-align:left}
  th{color:#34d399}
</style>
</head>
<body>

<div class="app">  
  <div id="page-splash">
    <img src="https://i.postimg.cc/PxzQZ9VJ/file-0000000030d882118003721bfa9dff12.png" class="splash-logo">
    <div class="splash-text">Paylix</div>
  </div>  

  <!-- Login Page -->
  <div id="page-login" class="page">
    <div style="margin-top:10vh">
      <div style="font-size:1.6rem;font-weight:800;text-align:center;color:#34d399;margin-bottom:20px">লগইন করুন</div>
      <div class="form-box">
        <div class="field"><label>ইমেইল</label><input type="text" id="log-email" placeholder="example@gmail.com"></div>
        <div class="field"><label>পাসওয়ার্ড</label><input type="password" id="log-pass" placeholder="••••••••"></div>
        <button class="btn" onclick="loginUser()">লগইন</button>
      </div>
      <div style="text-align:center;font-size:0.85rem;color:#94a3b8">অ্যাকাউন্ট নেই? <span onclick="openPage('page-register')" style="color:#34d399;cursor:pointer">রেজিস্ট্রেশন</span></div>
    </div>
  </div>  

  <!-- Register Page -->
  <div id="page-register" class="page">
    <div class="back-btn" onclick="openPage('page-login')">← ফিরে যান</div>
    <div style="font-size:1.6rem;font-weight:800;text-align:center;color:#34d399;margin-bottom:20px">নতুন অ্যাকাউন্ট</div>
    <div class="form-box">
      <div class="field"><label>নাম</label><input type="text" id="reg-name" placeholder="নাম"></div>
      <div class="field"><label>ইমেইল</label><input type="text" id="reg-email" placeholder="example@gmail.com"></div>
      <div class="field"><label>পাসওয়ার্ড</label><input type="password" id="reg-pass" placeholder="••••••••"></div>
      <div class="field"><label>রেফার কোড (ঐচ্ছিক)</label><input type="text" id="reg-ref" placeholder="রেফার ইমেইল"></div>
      <button class="btn" onclick="registerUser()">রেজিস্ট্রেশন</button>
    </div>
  </div>  

  <!-- Home Page -->
  <div id="page-home" class="page">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h3>Paylix 🚀</h3>
      <button class="btn" style="width:auto;padding:6px 12px;font-size:0.75rem;background:#ef4444" onclick="logoutUser()">লগআউট</button>
    </div>
    <div class="form-box" style="background:linear-gradient(135deg,#064e3b,#022c22)">
      <div style="font-size:0.8rem;color:#a7f3d0">AVAILABLE BALANCE</div>
      <div style="font-size:2rem;font-weight:800;margin:8px 0" id="main-bal">৳0</div>
      <button class="btn" onclick="openPage('page-withdraw')">Withdraw (১৫% চার্জ)</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">
      <div class="form-box" style="text-align:center;cursor:pointer" onclick="openPage('page-spin')"><h3>🎰</h3><p>Spin & Earn</p></div>
      <div class="form-box" style="text-align:center;cursor:pointer" onclick="openPage('page-gmail-sell')"><h3>📧</h3><p>Gmail Sell</p></div>
    </div>
  </div>

  <!-- Spin Page -->
  <div id="page-spin" class="page">
    <div class="back-btn" onclick="openPage('page-home')">← ফিরে যান</div>
    <div class="form-box" style="text-align:center">
      <h3>🎰 লাকি স্পিন (ফি: ১৫ টাকা)</h3>
      <button class="btn" style="margin-top:20px" onclick="playSpin()">স্পিন করুন</button>
    </div>
  </div>

  <!-- Gmail Sell Page -->
  <div id="page-gmail-sell" class="page">
    <div class="back-btn" onclick="openPage('page-home')">← ফিরে যান</div>
    <h3>📧 Gmail Sell (৳১৫)</h3>
    <div class="form-box" style="margin-top:10px">
      <div class="field"><label>জিমেইল</label><input type="email" id="sell-gmail" placeholder="gmail@gmail.com"></div>
      <div class="field"><label>পাসওয়ার্ড</label><input type="password" id="sell-gpass" placeholder="password"></div>
      <button class="btn" onclick="submitGmailOrder()">জমা দিন</button>
    </div>
  </div>

  <!-- Withdraw Page -->
  <div id="page-withdraw" class="page">
    <div class="back-btn" onclick="openPage('page-home')">← ফিরে যান</div>
    <h3>টাকা উত্তোলন</h3>
    <div class="form-box" style="margin-top:10px">
      <div class="field"><label>মেথড</label><select id="w-method"><option>বিকাশ</option><option>নগদ</option></select></div>
      <div class="field"><label>নম্বর</label><input type="number" id="w-number" placeholder="017XXXXXXXX"></div>
      <div class="field"><label>পরিমাণ (সর্বনিম্ন ১০০)</label><input type="number" id="w-amount" placeholder="100"></div>
      <button class="btn" onclick="submitWithdraw()">রিকোয়েস্ট পাঠান</button>
    </div>
  </div>

  <!-- Admin Login Page -->
  <div id="page-admin-login" class="page">
    <div style="margin-top:15vh">
      <h3 style="color:#f59e0b;text-align:center;margin-bottom:20px">🛡️ Admin Portal</h3>
      <div class="form-box">
        <div class="field"><label>অ্যাডমিন ইমেইল</label><input type="text" id="admin-user" placeholder="hey.rafi32@gmail.com"></div>
        <div class="field"><label>পাসওয়ার্ড</label><input type="password" id="admin-pass" placeholder="••••••••"></div>
        <button class="btn" style="background:#f59e0b" onclick="loginAdmin()">প্রবেশ করুন</button>
      </div>
    </div>
  </div>

  <!-- Admin Panel -->
  <div id="page-admin" class="page">
    <h3 style="color:#f59e0b;margin-bottom:12px">🛡️ Admin Panel</h3>
    <div style="display:flex;gap:5px;margin-bottom:10px">
      <button class="btn" style="padding:6px;font-size:0.7rem" onclick="loadAdminData('gmail')">Gmail Orders</button>
      <button class="btn" style="padding:6px;font-size:0.7rem;background:#3b82f6" onclick="loadAdminData('withdraw')">Withdraws</button>
      <button class="btn" style="padding:6px;font-size:0.7rem;background:#ef4444" onclick="openPage('page-login')">লগআউট</button>
    </div>
    <div class="form-box" style="overflow-x:auto">
      <table id="admin-table">
        <thead><tr><th>Info</th><th>Details</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AlzaSyAt87cMTIiJyXtpfIfLiLfZfa7WX1g9Mg",
    authDomain: "paylix-586b1.firebaseapp.com",
    projectId: "paylix-586b1",
    storageBucket: "paylix-586b1.appspot.com",
    messagingSenderId: "353074453470",
    appId: "1:353074453470:web:679e99a4021eeed9499b4f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  let currentUser = localStorage.getItem('paylix_current') || null;

  window.openPage = function(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0,0);
  };

  window.addEventListener('DOMContentLoaded', () => {
    let splash = document.getElementById('page-splash');
    
    if (window.location.hash === '#admin' || window.location.hash === '#adn') {
      if(splash) splash.style.display = 'none';
      openPage('page-admin-login');
      return;
    }

    setTimeout(() => {
      if (splash) splash.style.display = 'none';
      if (currentUser) { loadUserHome(); openPage('page-home'); }
      else { openPage('page-login'); }
    }, 1000);
  });

  window.registerUser = async function() {
    const name = document.getElementById('reg-name').value;
    const email = document.getElementById('reg-email').value;
    const pass = document.getElementById('reg-pass').value;
    const ref = document.getElementById('reg-ref').value;
    if (!name || !email || !pass) return alert('সব ঘর পূরণ করুন');
    try {
      const q = query(collection(db, "users"), where("email", "==", email));
      const snap = await getDocs(q);
      if (!snap.empty) return alert('এই ইমেইল দিয়ে অ্যাকাউন্ট আছে!');
      await addDoc(collection(db, "users"), { name, email, pass, balance: 0, referralBalance: 0, refBy: ref || null });
      alert('রেজিস্ট্রেশন সফল!');
      openPage('page-login');
    } catch(e) { alert('ত্রুটি ঘটেছে!'); }
  };

  window.loginUser = async function() {
    const email = document.getElementById('log-email').value;
    const pass = document.getElementById('log-pass').value;
    try {
      const q = query(collection(db, "users"), where("email", "==", email), where("pass", "==", pass));
      const snap = await getDocs(q);
      if (!snap.empty) {
        currentUser = email;
        localStorage.setItem('paylix_current', email);
        loadUserHome();
        openPage('page-home');
      } else { alert('ভুল ইমেইল বা পাসওয়ার্ড!'); }
    } catch(e) { alert('সার্ভার সমস্যা!'); }
  };

  window.loadUserHome = async function() {
    if (!currentUser) return;
    const q = query(collection(db, "users"), where("email", "==", currentUser));
    const snap = await getDocs(q);
    if (!snap.empty) {
      const u = snap.docs[0].data();
      document.getElementById('main-bal').innerText = `৳${u.balance || 0}`;
    }
  };

  window.submitGmailOrder = async function() {
    const gmail = document.getElementById('sell-gmail').value;
    const gpass = document.getElementById('sell-gpass').value;
    if (!gmail || !gpass) return alert('সব ঘর পূরণ করুন!');
    try {
      await addDoc(collection(db, "gmails"), { user: currentUser, gmail, password: gpass, price: 15, status: 'pending' });
      alert('জিমেইল জমা হয়েছে!');
      openPage('page-home');
    } catch(e) { alert('ত্রুটি!'); }
  };

  window.submitWithdraw = async function() {
    const method = document.getElementById('w-method').value;
    const number = document.getElementById('w-number').value;
    const amount = parseFloat(document.getElementById('w-amount').value);
    if (!amount || amount < 100) return alert('সর্বনিম্ন ১০০ টাকা!');
    const q = query(collection(db, "users"), where("email", "==", currentUser));
    const snap = await getDocs(q);
    const uDoc = snap.docs[0];
    const uData = uDoc.data();
    if (uData.balance < amount) return alert('পর্যাপ্ত ব্যালেন্স নেই!');
    
    const userReceive = amount * 0.85; 
    const refBonus = amount * 0.10;   

    await updateDoc(doc(db, "users", uDoc.id), { balance: uData.balance - amount });
    await addDoc(collection(db, "withdraw"), { user: currentUser, method, number, requested: amount, received: userReceive, status: 'pending' });

    if (uData.refBy) {
      const refQ = query(collection(db, "users"), where("email", "==", uData.refBy));
      const refSnap = await getDocs(refQ);
      if (!refSnap.empty) {
        await updateDoc(doc(db, "users", refSnap.docs[0].id), { referralBalance: (refSnap.docs[0].data().referralBalance || 0) + refBonus });
      }
    }
    alert(`উইথড্র রিকোয়েস্ট সফল! আপনি পাবেন ৳${userReceive}`);
    loadUserHome();
    openPage('page-home');
  };

  window.playSpin = async function() {
    const cost = 15;
    const q = query(collection(db, "users"), where("email", "==", currentUser));
    const snap = await getDocs(q);
    const uDoc = snap.docs[0];
    const uData = uDoc.data();
    if (uData.balance < cost) return alert('১৫ টাকা প্রয়োজন!');
    let reward = Math.random() < 0.55 ? 0 : Math.random() < 0.85 ? 2 : 5;
    await updateDoc(doc(db, "users", uDoc.id), { balance: uData.balance + (reward - cost) });
    alert(`স্পিন সম্পন্ন! জিতেছেন ৳${reward}`);
    loadUserHome();
  };

  window.loginAdmin = function() {
    const user = document.getElementById('admin-user').value.trim();
    const pass = document.getElementById('admin-pass').value.trim();
    
    if (user === 'hey.rafi32@gmail.com' && pass === 'rafi2026') {
      openPage('page-admin');
      loadAdminData('withdraw');
    } else {
      alert('ভুল ইমেইল বা পাসওয়ার্ড!');
    }
  };

  window.loadAdminData = async function(type) {
    const tbody = document.querySelector('#admin-table tbody');
    tbody.innerHTML = 'লোড হচ্ছে...';
    try {
      const snap = await getDocs(collection(db, type === 'gmail' ? "gmails" : "withdraw"));
      tbody.innerHTML = '';
      snap.forEach(d => {
        let item = d.data();
        tbody.innerHTML += `<tr><td><b>${item.user}</b><br>${type==='gmail'?item.gmail:item.number}</td><td>৳${type==='gmail'?item.price:item.requested} (${item.password || item.status})</td></tr>`;
      });
    } catch(e) { tbody.innerHTML = `<tr><td colspan="2">ত্রুটি!</td></tr>`; }
  };

  window.logoutUser = function() {
    localStorage.removeItem('paylix_current');
    currentUser = null;
    openPage('page-login');
  };
</script>
</body>
</html>
