<style>
  :root{
    --bg:#160826;
    --bg2:#1f0b36;
    --panel:#2a0f47;
    --panel2:#3a1563;
    --purple:#8b3dff;
    --purple2:#b478ff;
    --accent:#00e0a4;
    --accent2:#ffd166;
    --danger:#ff4d6d;
    --text:#f3ecff;
    --muted:#b9a5d6;
    --border:rgba(180,120,255,.22);
    --shadow:0 10px 40px rgba(139,61,255,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
  html,body{background:var(--bg);color:var(--text);min-height:100vh}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(139,61,255,.25), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(0,224,164,.12), transparent 60%),
      var(--bg);
  }
  a{color:var(--purple2);text-decoration:none}
  button{cursor:pointer;font-family:inherit}
  input,select{font-family:inherit}
  .hidden{display:none !important}
  #splash{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 30%, #3a1563, #160826 70%);
    z-index:9999;transition:opacity .6s ease, visibility .6s;
  }
  #splash img{width:130px;height:130px;border-radius:28px;box-shadow:var(--shadow);animation:pulse 2s infinite}
  #splash h1{margin-top:20px;font-size:34px;letter-spacing:2px;background:linear-gradient(90deg,#b478ff,#00e0a4);-webkit-background-clip:text;background-clip:text;color:transparent}
  #splash p{color:var(--muted);margin-top:6px;font-size:13px;letter-spacing:1px}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  .navbar{
    position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);
    background:rgba(22,8,38,.75);border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;padding:10px 16px;
  }
  .brand{display:flex;align-items:center;gap:10px}
  .brand img{width:36px;height:36px;border-radius:10px;box-shadow:0 4px 14px rgba(139,61,255,.6)}
  .brand span{font-weight:800;letter-spacing:1px;font-size:19px;background:linear-gradient(90deg,#b478ff,#00e0a4);-webkit-background-clip:text;background-clip:text;color:transparent}
  .nav-right{display:flex;gap:10px;align-items:center}
  .btn{
    border:none;border-radius:12px;padding:11px 18px;font-weight:700;font-size:14px;color:#fff;
    background:linear-gradient(135deg,var(--purple),#5b1fb0);box-shadow:0 6px 22px rgba(139,61,255,.45);
    transition:transform .15s, filter .2s;
  }
  .btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.accent{background:linear-gradient(135deg,#00e0a4,#009e74);box-shadow:0 6px 22px rgba(0,224,164,.4);color:#062b20}
  .btn.gold{background:linear-gradient(135deg,#ffd166,#e0a800);color:#2a1d00;box-shadow:0 6px 22px rgba(255,209,102,.4)}
  .btn.danger{background:linear-gradient(135deg,#ff4d6d,#a81b35);box-shadow:0 6px 22px rgba(255,77,109,.4)}
  .btn.ghost{background:transparent;border:1px solid var(--border);box-shadow:none;color:var(--text)}
  .btn.small{padding:7px 12px;font-size:12px;border-radius:9px}
  .btn.block{display:block;width:100%}
  .auth-card{
    max-width:430px;margin:40px auto;background:linear-gradient(160deg,var(--panel),var(--bg2));
    border:1px solid var(--border);border-radius:22px;padding:28px;box-shadow:var(--shadow);
  }
  .auth-card img.logo{width:80px;height:80px;border-radius:20px;display:block;margin:0 auto 14px;box-shadow:var(--shadow)}
  .auth-card h2{text-align:center;font-size:24px;margin-bottom:6px}
  .auth-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.5px;font-weight:600}
  .field input{
    width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--border);
    background:rgba(255,255,255,.05);color:var(--text);outline:none;font-size:14px;
  }
  .field input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(139,61,255,.2)}
  .switch-line{text-align:center;font-size:13px;color:var(--muted);margin-top:16px}
  .dash-hero{
    background:linear-gradient(135deg,#3a1563,#1f0b36);
    border:1px solid var(--border);border-radius:22px;padding:22px;margin-top:18px;
    position:relative;overflow:hidden;
  }
  .dash-hero::after{
    content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;

  .dash-hero small{color:var(--muted);letter-spacing:1px;font-size:12px}
  .balance{font-size:42px;font-weight:800;margin:6px 0;letter-spacing:1px;

  .userline{color:var(--muted);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:18px}
  .tile{
    background:linear-gradient(160deg,var(--panel),var(--bg2));

  .tile h3{font-size:15px;margin-bottom:4px}
  .tile p{font-size:12px;color:var(--muted)}
  .section{margin-top:22px}
  .section h2{font-size:19px;margin-bottom:12px;letter-spacing:.5px}
  .card{
    background:linear-gradient(160deg,var(--panel),var(--bg2));
    border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px;
  }
  .job-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .job-row .title{font-weight:700;font-size:15px}
  .job-row .desc{font-size:12px;color:var(--muted);margin-top:3px;max-width:520px}
  .pill{background:rgba(0,224,164,.15);color:var(--accent);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
  #toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);
    background:linear-gradient(135deg,var(--purple),#5b1fb0);color:#fff;padding:12px 22px;
    border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);
    transition:transform .35s ease;z-index:10000;max-width:90%;text-align:center;
  }
  #toast.show{transform:translateX(-50%) translateY(0)}
  #toast.err{background:linear-gradient(135deg,#ff4d6d,#a81b35)}
  #toast.ok{background:linear-gradient(135deg,#00e0a4,#009e74);color:#062b20}
  .wheel-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;padding:10px}
  #wheel{
    width:260px;height:260px;border-radius:50%;
    border:8px solid var(--purple2);
    box-shadow:0 0 40px rgba(139,61,255,.6), inset 0 0 30px rgba(139,61,255,.4);
    transition:transform 4s cubic-bezier(.17,.67,.12,1);
    background:conic-gradient(
      #8b3dff 0deg 45deg, #3a1563 45deg 90deg,
      #00e0a4 90deg 135deg, #3a1563 135deg 180deg,
      #ffd166 180deg 225deg, #3a1563 225deg 270deg,
      #ff4d6d 270deg 315deg, #3a1563 315deg 360deg
    );
    position:relative;
  }
  #wheel::after{
    content:"🎯";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:44px;filter:drop-shadow(0 0 8px rgba(0,0,0,.5));
  }
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase; background: rgba(139,61,255,0.1);}
  .table-wrap{overflow-x:auto;border-radius:14px}
  table tr:hover { background: rgba(139,61,255,0.05); }
  .badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700}
  .badge.pending{background:rgba(255,209,102,.2);color:var(--accent2)}
  .badge.approved{background:rgba(0,224,164,.2);color:var(--accent)}
  .badge.rejected{background:rgba(255,77,109,.2);color:var(--danger)}
  .badge.cancelled{background:rgba(255,77,109,.2);color:var(--danger)}
  .badge.blocked{background:rgba(255,77,109,.2);color:var(--danger)}
  .badge.active{background:rgba(0,224,164,.2);color:var(--accent)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .tabs button{
    background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted);
    padding:9px 16px;border-radius:12px;font-size:13px;font-weight:600;
  }
  .tabs button.active{background:linear-gradient(135deg,var(--purple),#5b1fb0);color:#fff;border-color:transparent}
  .eye{cursor:pointer;user-select:none;font-size:16px}
  .admin-box .field input{background:rgba(255,255,255,.06)}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}
  .foot{text-align:center;color:var(--muted);font-size:12px;padding:26px 0 40px}
  @media(max-width:560px){
    .balance{font-size:34px}
    .auth-card{padding:22px}
  }
</style>

<body>

<script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const page = $("#page");
const state = { user: null, isAdmin: false };

function toast(msg, type=""){
  const t = $("#toast");
  t.textContent = msg;
  t.className = "show " + type;
  clearTimeout(t._tid);
  t._tid = setTimeout(()=>{ t.className = t.className.replace("show","").trim(); }, 2800);
}
function money(n){ return "৳" + Number(n || 0).toFixed(2); }
function esc(s){ return String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function emailKey(email){ return email.toLowerCase().trim(); }
function saveSession(email){ localStorage.setItem("paylix_user", emailKey(email)); }
function getSession(){ return localStorage.getItem("paylix_user"); }
function clearSession(){ localStorage.removeItem("paylix_user"); }

setTimeout(()=>{
  const sp = $("#splash");
  sp.style.opacity = 0; sp.style.visibility = "hidden";
  setTimeout(()=> sp.remove(), 600);
  boot();
}, 1800);

async function boot(){
  $("#app").classList.remove("hidden");
  const hash = (location.hash || "").toLowerCase();
  if (hash === "#admin" || hash === "#adn") { renderAdminLogin(); return; }

  const urlParams = new URLSearchParams(window.location.search);
  const refParam = urlParams.get('ref');
  if (refParam) {
    localStorage.setItem('paylix_ref', refParam);
  }

  const email = getSession();
  if (email) {
    const snap = await getDoc(doc(db, "users", email));
    if (snap.exists()) {
      const data = snap.data();
      if (data.blocked) {
        clearSession();
        toast("আপনার অ্যাকাউন্ট ব্লক করা হয়েছে।", "err");
        renderAuth("login");
        return;
      }
      state.user = { email, ...data };
      
      if (localStorage.getItem("paylix_joined") === "yes") {
        renderDashboard();
      } else {
        renderCommunityJoin();
      }
      return;
    }
    clearSession();
  }
  renderAuth("login");
}

window.addEventListener("hashchange", ()=>{
  const hash = (location.hash || "").toLowerCase();
  if (hash === "#admin" || hash === "#adn") renderAdminLogin();
  else if (state.user) renderDashboard();
  else renderAuth("login");
});

function renderCommunityJoin(){
  page.innerHTML = `
    <div class="auth-card" style="margin-top:20px; max-width:480px;">
      <img class="logo" src="${LOGO}" alt="Paylix"/>
      <h2 style="text-align:center; color:var(--accent2)">🚀 Join Our Community</h2>
      <p class="sub">ড্যাশবোর্ডে প্রবেশ করতে নিচের ৩টি স্টেপ সম্পন্ন করুন</p>
      
      <div class="card" style="margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
        <div><b>1. YouTube</b><br><span style="font-size:12px; color:var(--muted)">চ্যানেল সাবস্ক্রাইব করুন</span></div>
        <a href="${YT_LINK}" target="_blank" class="btn small danger">Subscribe</a>
      </div>
      
      <div class="card" style="margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
        <div><b>2. Telegram Group</b><br><span style="font-size:12px; color:var(--muted)">গ্রুপে জয়েন করুন</span></div>
        <a href="${TG_GROUP}" target="_blank" class="btn small accent">Join Group</a>
      </div>
      
      <div class="card" style="margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;">
        <div><b>3. Telegram Channel</b><br><span style="font-size:12px; color:var(--muted)">চ্যানেলে জয়েন করুন</span></div>
        <a href="${TG_CHANNEL}" target="_blank" class="btn small accent">Join Channel</a>
      </div>
      
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px; background:rgba(255,255,255,0.05); padding:12px; border-radius:10px; border:1px solid var(--border);">
        <input type="checkbox" id="joinCheck" style="width:20px; height:20px; accent-color:var(--accent); cursor:pointer;" />
        <label for="joinCheck" style="font-size:13px; cursor:pointer; color:var(--text);">আমি সবগুলোতে জয়েন করেছি</label>
      </div>
      
      <button class="btn accent block" id="verifyJoin" style="opacity:0.5; pointer-events:none;">Verify & Continue</button>
      
      <div class="switch-line" style="margin-top:15px;">
        সাপোর্ট প্রয়োজন? <a href="https://t.me/${TG_USERNAME}" target="_blank">@${TG_USERNAME}</a>
      </div>
    </div>
  `;

  const check = $("#joinCheck");
  const btn = $("#verifyJoin");

  check.onchange = ()=>{
    if (check.checked) {
      btn.style.opacity = "1";
      btn.style.pointerEvents = "auto";
    } else {
      btn.style.opacity = "0.5";
      btn.style.pointerEvents = "none";
    }
  };

  btn.onclick = ()=>{
    localStorage.setItem("paylix_joined", "yes");
    toast("ধন্যবাদ! ড্যাশবোর্ড আনলক হয়েছে ✅", "ok");
    renderDashboard();
  };function renderAuth(mode="login"){
  state.user = null;
  state.isAdmin = false;
  $("#navUser").textContent = "";
  $("#logoutBtn").classList.add("hidden");
  page.innerHTML = `
    <div class="auth-card">
      <img class="logo" src="${LOGO}" alt="Paylix"/>
      <h2>${mode === "login" ? "Welcome Back" : "Create Account"}</h2>
      <p class="sub">${mode === "login" ? "Log in to continue earning" : "Join Paylix and start earning today"}</p>

      ${mode === "register" ? `
      <div class="field">
        <label>Full Name</label>
        <input id="regName" placeholder="Your name" autocomplete="name"/>
      </div>` : ""}

      <div class="field">
        <label>Email</label>
        <input id="authEmail" type="email" placeholder="you@example.com" autocomplete="email"/>
      </div>

      <div class="field">
        <label>Password</label>
        <input id="authPass" type="password" placeholder="••••••••" autocomplete="current-password"/>
      </div>

      ${mode === "register" ? `
      <div class="field">
        <label>Referral Email (optional)</label>
        <input id="regRef" type="email" placeholder="referrer@example.com" value="${localStorage.getItem('paylix_ref') || ''}"/>
      </div>` : ""}

      <button class="btn block" id="authSubmit">${mode === "login" ? "Login" : "Register"}</button>
      <div class="switch-line">
        ${mode === "login"
          ? `নতুন? <a href="#" id="switchAuth">Register করুন</a>`
          : `অ্যাকাউন্ট আছে? <a href="#" id="switchAuth">Login করুন</a>`}
      </div>
    </div>
  `;
  $("#switchAuth").onclick = (e)=>{ e.preventDefault(); renderAuth(mode === "login" ? "register" : "login"); };
  $("#authSubmit").onclick = ()=> mode === "login" ? doLogin() : doRegister();
}

async function doRegister(){
  const name = $("#regName").value.trim();
  const email = emailKey($("#authEmail").value);
  const pass = $("#authPass").value;
  const refEmail = emailKey($("#regRef").value || "");

  if (!name || !email || !pass) return toast("সব ঘর পূরণ করুন।", "err");
  if (!/^\S+@\S+\.\S+$/.test(email)) return toast("সঠিক ইমেইল দিন।", "err");
  if (pass.length < 4) return toast("পাসওয়ার্ড কমপক্ষে ৪ অক্ষর।", "err");
  if (email === ADMIN_EMAIL) return toast("এই ইমেইল ব্যবহার করা যাবে না।", "err");

  const ref = await getDoc(doc(db, "users", email));
  if (ref.exists()) return toast("এই ইমেইলে অ্যাকাউন্ট আছে।", "err");

  let referredBy = "";
  if (refEmail) {
    if (refEmail === email) return toast("নিজেকে রেফার করা যাবে না।", "err");
    const rSnap = await getDoc(doc(db, "users", refEmail));
    if (!rSnap.exists()) return toast("রেফার ইমেইল পাওয়া যায়নি।", "err");
    referredBy = refEmail;
  }

  const data = {
    name, email, password: pass,
    referredBy,
    balance: 0,
    hasSpunBefore: false,
    blocked: false,
    totalEarned: 0,
    createdAt: serverTimestamp()
  };
  await setDoc(doc(db, "users", email), data);
  saveSession(email);
  state.user = { email, ...data };
  toast("রেজিস্ট্রেশন সফল! 🎉", "ok");
  renderCommunityJoin();
}

async function doLogin(){
  const email = emailKey($("#authEmail").value);
  const pass = $("#authPass").value;
  if (!email || !pass) return toast("ইমেইল ও পাসওয়ার্ড দিন।", "err");

  const snap = await getDoc(doc(db, "users", email));
  if (!snap.exists()) return toast("অ্যাকাউন্ট পাওয়া যায়নি।", "err");
  const data = snap.data();
  if (data.password !== pass) return toast("পাসওয়ার্ড ভুল।", "err");

async function loadHistory(){
  try{
    const wSnap = await getDocs(query(collection(db, "withdraws"), where("email","==",state.user.email)));
    const gSnap = await getDocs(query(collection(db, "gmails"), where("email","==",state.user.email)));
    const sSnap = await getDocs(query(collection(db, "sponsorSubs"), where("userEmail","==",state.user.email)));
    const rows = [];
    wSnap.forEach(d=>{ 
      const x = d.data(); 
      let statusText = x.status;
      if (x.status === "approved" && x.paymentRef) {
        statusText = `approved (Ref: ${x.paymentRef})`;
      }
      rows.push({
        type: "Withdraw", 
        amount: "-৳" + Number(x.amount || 0).toFixed(2), 
        status: statusText, 
        ts: x.createdAt
      }); 
    });
    gSnap.forEach(d=>{ const x=d.data(); rows.push({type:"Gmail Sell", amount:"+৳"+Number(x.reward||0).toFixed(2), status:x.status||"pending", ts:x.createdAt}); });
    sSnap.forEach(d=>{ const x=d.data(); rows.push({type:"Sponsor Task", amount:"+৳"+Number(x.payout||0).toFixed(2), status:x.status, ts:x.createdAt}); });
    rows.sort((a,b)=> (b.ts?.seconds||0)-(a.ts?.seconds||0));
    const tb = $("#historyBody");
    if (!tb) return;
    tb.innerHTML = rows.length ? rows.map(r=>`
      <tr>
        <td>${esc(r.type)}</td>
        <td>${esc(r.amount)}</td>
        <td><span class="badge ${r.status.split(" ")[0]}">${esc(r.status)}</span></td>
        <td>${r.ts?.toDate ? r.ts.toDate().toLocaleString() : "—"}</td>
      </tr>`).join("") : `<tr><td colspan="4" style="color:var(--muted)">কোনো রেকর্ড নেই।</td></tr>`;
  }catch(e){ console.error(e); }
}

window.startJobTimer = function(jobId) {
  const btn = document.getElementById(`jobBtn_${jobId}`);
  if (!btn || btn.dataset.started === "1") return;
  btn.dataset.started = "1";
  let timeLeft = 30;
  const interval = setInterval(() => {
    timeLeft--;
    btn.textContent = `জমা দিন (${timeLeft}s)`;
    if (timeLeft <= 0) {
      clearInterval(interval);
      btn.textContent = "জমা দিন";
      btn.disabled = false;
      btn.style.opacity = "1";
    }
  }, 1000);
};

window.openAdProof = function(jobId, title, reward){
  $("#adContent").innerHTML = `
    <div class="card">
      <h3 style="color:var(--accent); margin-bottom:10px;">প্রমাণ জমা দিন</h3>
      <p style="font-size:12px; color:var(--muted); margin-bottom:10px;">কাজ: ${esc(title)}</p>
      
      <div class="field">
        <label>স্ক্রিনশট আপলোড করুন</label>
        <input type="file" id="proofImg" accept="image/*" style="width:100%; padding:10px; background:rgba(255,255,255,0.05); border-radius:10px; border:1px solid var(--border); color:#fff;"/>
      </div>
      <div class="field">
        <label>অতিরিক্ত তথ্য (Optional)</label>
        <input id="proofText" placeholder="যেমন: আমার ইউটিউব নাম Rahim"/>
      </div>
      
      <button class="btn accent block" id="submitProofBtn">Submit Proof</button>
      <button class="btn ghost block" id="cancelProofBtn" style="margin-top:10px;">Cancel</button>
    </div>`;  $("#cancelProofBtn").onclick = renderDoAd;
  
  $("#submitProofBtn").onclick = async ()=>{
    const file = $("#proofImg").files[0];
    const text = $("#proofText").value.trim();
    if (!file) return toast("স্ক্রিনশট ছাড়া সাবমিট করা যাবে না।", "err");

    toast("আপলোড হচ্ছে... একটু অপেক্ষা করুন", "ok");
    
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = async () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        const MAX_SIZE = 600;
        if (width > height && width > MAX_SIZE) {
          height *= MAX_SIZE / width;
          width = MAX_SIZE;
        } else if (height > MAX_SIZE) {
          width *= MAX_SIZE / height;
          height = MAX_SIZE;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const base64data = canvas.toDataURL('image/jpeg', 0.5);

        await addDoc(collection(db, "adProofs"), {
          userEmail: state.user.email,
          jobId: jobId,
          jobTitle: title,
          proofImage: base64data,
          proofText: text,
          reward: reward,
          status: "pending",
          createdAt: serverTimestamp()
        });

        toast("প্রমাণ জমা হয়েছে! অ্যাডমিন Approve করলে টাকা পাবেন ✅", "ok");
        renderDoAd();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  };
};

window.approveAdProof = async function(proofId, workerEmail, reward, jobId){
  if (!confirm("Approve করলে ইউজার টাকা পাবে। নিশ্চিত?")) return;
  
  await updateDoc(doc(db, "adProofs", proofId), { status: "approved" });
  await updateDoc(doc(db, "users", workerEmail), { 
    balance: increment(reward),
    totalEarned: increment(reward)
  });

  const jobSnap = await getDoc(doc(db, "adJobs", jobId));
  if(jobSnap.exists()){
    const jobData = jobSnap.data();
    const completed = (jobData.completedSlots || 0) + 1;
    await updateDoc(doc(db, "adJobs", jobId), { 
      completedSlots: completed,
      status: completed >= jobData.totalSlots ? "completed" : "active"
    });
  }

  toast("প্রমাণ Approve হয়েছে এবং টাকা যোগ হয়েছে ✅", "ok");
  adminAdProofs();
};

async function adminIncome(){
  const c = $("#adminContent");
  c.innerHTML = `<div class="card">হিসাব লোড হচ্ছে...</div>`;
  
  const wSnap = await getDocs(collection(db, "withdraws"));
  let totalWithdrawReq = 0;
  let totalChargeEarned = 0;
  
  wSnap.forEach(d => {
    const w = d.data();
    if (w.status === "approved") {
      totalWithdrawReq += Number(w.amount || 0);
      totalChargeEarned += Number(w.amount || 0) * WITHDRAW_CHARGE;
    }
  });

  const spinSnap = await getDocs(collection(db, "spins"));
  let totalSpinFee = 0;
  spinSnap.forEach(d => {
    totalSpinFee += Number(d.data().fee || 0);
  });

  c.innerHTML = `
    <div class="card" style="background:linear-gradient(135deg, #1f0b36, #160826); border:1px solid #00e0a4;">
      <h3 style="color:#00e0a4; text-align:center; margin-bottom:15px;">📊 Paylix Profit Overview</h3>
      
      <div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #3a1563;">
        <span>Withdraw Charge (১৫%):</span>
        <b style="color:#00e0a4;">${money(totalChargeEarned)}</b>
      </div>
      
      <div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #3a1563;">
        <span>Spin Fees Income:</span>
        <b style="color:#00e0a4;">${money(totalSpinFee)}</b>
      </div>
      
      <div style="display:flex; justify-content:space-between; padding:15px 10px; margin-top:10px; background:rgba(0,224,164,0.1); border-radius:10px;">
        <span style="font-weight:bold;">মোট আয় (Approx):</span>
        <b style="color:#ffd166; font-size:18px;">${money(totalChargeEarned + totalSpinFee)}</b>
      </div>
      
      <div style="display:flex; justify-content:space-between; padding:10px; margin-top:10px; background:rgba(255,77,109,0.1); border-radius:10px;">
        <span>Total Withdrawn (Users):</span>
        <b style="color:#ff4d6d;">${money(totalWithdrawReq)}</b>
      </div>
    </div>
  `;
}
