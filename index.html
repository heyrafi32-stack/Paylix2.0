<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paylix - Admin Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { cyan: '#06b6d4', purple: '#a855f7', dark: '#0f172a', card: '#1e293b', accent: '#3b82f6' } } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #0b0f19; color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-10">

    <!-- ADMIN LOGIN SECTION -->
    <div id="admin-login-section" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-red-500/30 w-full max-w-md rounded-2xl p-6 shadow-2xl">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-red-500/10 border border-red-500/30 text-red-500 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h2 class="text-2xl font-bold text-white">অ্যাডমিন লগইন</h2>
                <p class="text-xs text-red-400 mt-1">শুধুমাত্র অনুমোদিত ব্যক্তির জন্য</p>
            </div>
            
            <form id="admin-login-form" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-300 mb-1">অ্যাডমিন ইমেইল</label>
                    <input type="email" id="admin-email" required placeholder="hey.rafi32@gmail.com" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">পাসওয়ার্ড</label>
                    <input type="password" id="admin-password" required placeholder="rafi2026" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                </div>
                <p id="admin-error" class="text-red-400 text-xs text-center hidden"></p>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-red-600/20">
                    <i class="fa-solid fa-lock mr-2"></i> প্রবেশ করুন
                </button>
            </form>
            <div class="mt-4 text-center">
                <a href="index.html" class="text-xs text-cyan-400 hover:underline">ইউজার সাইটে ফিরে যান</a>
            </div>
        </div>
                    </div><!-- MAIN ADMIN DASHBOARD -->
    <div id="admin-main" class="hidden flex-col min-h-screen">
        
        <header class="sticky top-0 z-40 bg-slate-900 border-b border-red-500/30">
            <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <img src="https://i.postimg.cc/PxzQZ9VJ/file-0000000030d882118003721bfa9dff12.png" alt="Paylix Logo" class="h-8 w-8 rounded-full grayscale opacity-80">
                    <div>
                        <h1 class="text-lg font-bold text-white">Paylix <span class="text-red-500">Admin</span></h1>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-xs text-slate-400"><i class="fa-solid fa-circle text-emerald-500 text-[10px] mr-1"></i> System Online</span>
                    <button onclick="adminLogout()" class="text-red-400 hover:text-red-300 text-sm bg-red-500/10 px-3 py-1.5 rounded-lg border border-red-500/20 transition">
                        <i class="fa-solid fa-right-from-bracket mr-1"></i> লগআউট
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <div class="text-xs text-slate-400 mb-1">মোট ইউজার</div>
                    <div id="admin-stat-users" class="text-xl font-bold text-white">0 জন</div>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <div class="text-xs text-slate-400 mb-1">পেন্ডিং জিমেইল</div>
                    <div id="admin-stat-gmails" class="text-xl font-bold text-amber-400">0 টি</div>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <div class="text-xs text-slate-400 mb-1">পেন্ডিং উইথড্র</div>
                    <div id="admin-stat-withdraws" class="text-xl font-bold text-red-400">0 টি</div>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <div class="text-xs text-slate-400 mb-1">সিস্টেম স্ট্যাটাস</div>
                    <div class="text-xl font-bold text-emerald-400">Active</div>
                </div>
            </div>

            <div class="flex overflow-x-auto gap-2 mb-6 border-b border-slate-800 pb-2 custom-scrollbar">
                <button onclick="switchAdminTab('adm-gmail')" class="adm-tab bg-red-500/20 text-red-400 px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap border border-red-500/30">জিমেইল স্টক</button>
                <button onclick="switchAdminTab('adm-withdraw')" class="adm-tab bg-slate-800 text-slate-300 px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap">উইথড্র রিকোয়েস্ট</button>
                <button onclick="switchAdminTab('adm-users')" class="adm-tab bg-slate-800 text-slate-300 px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap">ইউজার ম্যানেজমেন্ট</button>
                <button onclick="switchAdminTab('adm-settings')" class="adm-tab bg-slate-800 text-slate-300 px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap">সেটিংস</button>
            </div>        <div id="adm-gmail" class="adm-section space-y-4">
                <h3 class="text-lg font-bold text-white mb-2">জমা পড়া জিমেইল স্টক</h3>
                <div id="admin-gmail-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <div id="adm-withdraw" class="adm-section hidden space-y-4">
                <h3 class="text-lg font-bold text-white mb-2">উইথড্র রিকোয়েস্ট (বিকাশ/নগদ)</h3>
                <div id="admin-withdrawals-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <div id="adm-users" class="adm-section hidden space-y-4">
                <h3 class="text-lg font-bold text-white mb-2">সব ইউজারের লিস্ট</h3>
                <div id="admin-users-list" class="space-y-3"></div>
            </div>

            <div id="adm-settings" class="adm-section hidden space-y-8">
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                    <h3 class="text-lg font-bold text-white mb-4">গ্লোবাল নোটিশ আপডেট</h3>
                    <div class="flex flex-col md:flex-row gap-3">
                        <input type="text" id="admin-notice-input" placeholder="নতুন নোটিশ লিখুন..." class="flex-grow bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none">
                        <button onclick="saveGlobalNotice()" class="bg-cyan-600 hover:bg-cyan-700 text-white font-bold px-6 py-3 rounded-xl transition text-sm">আপডেট করুন</button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div><script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, where, getDocs, serverTimestamp, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtY87cMTIiJyXtpflfLiLfZfa7WX1g9Mg",
            authDomain: "paylix-586b1.firebaseapp.com",
            projectId: "paylix-586b1",
            storageBucket: "paylix-586b1.firebasestorage.app",
            messagingSenderId: "353074453470",
            appId: "1:353074453470:web:679e99a4021eeed9499b4f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const SECRET_ADMIN_EMAIL = "hey.rafi32@gmail.com";
        const SECRET_ADMIN_PASS = "rafi2026";

        const adminLoginSection = document.getElementById('admin-login-section');
        const adminMain = document.getElementById('admin-main');
        const adminLoginForm = document.getElementById('admin-login-form');
        const adminError = document.getElementById('admin-error');

        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-password').value;
            const btn = adminLoginForm.querySelector('button[type="submit"]');
            
            adminError.classList.add('hidden');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> চেক করা হচ্ছে...';
            btn.disabled = true;

            if(email !== SECRET_ADMIN_EMAIL || pass !== SECRET_ADMIN_PASS) {
                setTimeout(() => {
                    adminError.innerText = "ভুল ইমেইল বা পাসওয়ার্ড!";
                    adminError.classList.remove('hidden');
                    btn.innerHTML = '<i class="fa-solid fa-lock mr-2"></i> প্রবেশ করুন';
                    btn.disabled = false;
                }, 500);
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (error) {
                adminError.innerText = "ফায়ারবেস এরর: " + error.message;
                adminError.classList.remove('hidden');
                btn.innerHTML = '<i class="fa-solid fa-lock mr-2"></i> প্রবেশ করুন';
                btn.disabled = false;
            }
        });

        onAuthStateChanged(auth, async (user) => {
            if(user && user.email === SECRET_ADMIN_EMAIL) {
                adminLoginSection.classList.add('hidden');
                adminMain.classList.remove('hidden');
                adminMain.classList.add('flex');
                loadAdminData();
            } else {
                if(user) await signOut(auth);
                adminLoginSection.classList.remove('hidden');
                adminMain.classList.add('hidden');
                adminMain.classList.remove('flex');
                adminLoginForm.reset();
                const btn = adminLoginForm.querySelector('button[type="submit"]');
                btn.innerHTML = '<i class="fa-solid fa-lock mr-2"></i> প্রবেশ করুন';
                btn.disabled = false;
            }
        });

        window.adminLogout = function() { signOut(auth); }

        window.switchAdminTab = function(tabId) {
            document.querySelectorAll('.adm-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            
            document.querySelectorAll('.adm-tab').forEach(btn => {
                btn.classList.remove('bg-red-500/20', 'text-red-400', 'border', 'border-red-500/30');
                btn.classList.add('bg-slate-800', 'text-slate-300');
            });
            event.target.classList.remove('bg-slate-800', 'text-slate-300');
            event.target.classList.add('bg-red-500/20', 'text-red-400', 'border', 'border-red-500/30');
        }        function loadAdminData() {
            onSnapshot(query(collection(db, "gmail_submissions")), (snap) => {
                const container = document.getElementById('admin-gmail-list');
                container.innerHTML = '';
                let pendingCount = 0;
                snap.forEach(docSnap => {
                    const g = docSnap.data();
                    if(g.status === 'pending') {
                        pendingCount++;
                        container.innerHTML += `
                            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-sm space-y-2">
                                <div class="flex justify-between">
                                    <span class="text-white font-bold">${g.gmailEmail}</span>
                                    <span class="text-amber-400 font-bold">৳${g.rate}</span>
                                </div>
                                <p class="text-slate-400 bg-slate-900 p-2 rounded">Pass: ${g.gmailPass}</p>
                                <p class="text-xs text-slate-500">ইউজার: ${g.userName}</p>
                                <div class="flex gap-2 pt-2">
                                    <button onclick="approveGmail('${docSnap.id}', '${g.userId}')" class="flex-1 bg-emerald-600 text-white px-3 py-2 rounded font-bold text-xs">Approve</button>
                                    <button onclick="rejectGmail('${docSnap.id}', '${g.userId}')" class="flex-1 bg-red-600 text-white px-3 py-2 rounded font-bold text-xs">Reject</button>
                                </div>
                            </div>
                        `;
                    }
                });
                if(container.innerHTML === '') container.innerHTML = '<p class="text-sm text-slate-500">কোনো পেন্ডিং জিমেইল নেই।</p>';
                document.getElementById('admin-stat-gmails').innerText = `${pendingCount} টি`;
            });

            onSnapshot(query(collection(db, "withdrawals")), (snap) => {
                const container = document.getElementById('admin-withdrawals-list');
                container.innerHTML = '';
                let pendingWths = 0;
                snap.forEach(docSnap => {
                    const w = docSnap.data();
                    if(w.status === 'pending') {
                        pendingWths++;
                        container.innerHTML += `
                            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-sm space-y-2">
                                <div class="flex justify-between">
                                    <strong class="text-white">${w.userName}</strong>
                                    <span class="text-red-400 font-bold">৳${w.amount}</span>
                                </div>
                                <p class="text-slate-400">মেথড: <b>${w.method}</b> | নম্বর: <b>${w.number}</b></p>
                                <button onclick="approveWithdrawal('${docSnap.id}')" class="w-full bg-emerald-600 text-white px-3 py-2 rounded font-bold text-xs mt-2">Payment Done (Approve)</button>
                            </div>
                        `;
                    }
                });
                if(container.innerHTML === '') container.innerHTML = '<p class="text-sm text-slate-500">কোনো পেন্ডিং উইথড্র নেই।</p>';
                document.getElementById('admin-stat-withdraws').innerText = `${pendingWths} টি`;
            });

            onSnapshot(query(collection(db, "users")), (snap) => {
                const container = document.getElementById('admin-users-list');
                container.innerHTML = '';
                let userCount = 0;
                snap.forEach(docSnap => {
                    userCount++;
                    const u = docSnap.data();
                    const statusColor = u.isBlocked ? 'text-red-400' : 'text-emerald-400';
                    const statusText = u.isBlocked ? 'Blocked' : 'Active';
                    container.innerHTML += `
                        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-sm flex flex-col md:flex-row justify-between md:items-center gap-4">
                            <div>
                                <strong class="text-white text-base">${u.name}</strong> <span class="text-slate-500">(${u.email})</span>
                                <p class="text-slate-400 mt-1">ব্যালেন্স: <b class="text-emerald-400">৳${(u.balance || 0).toFixed(2)}</b></p>
                                <p class="text-xs mt-1">Status: <b class="${statusColor}">${statusText}</b></p>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                <button onclick="editUserBalancePrompt('${docSnap.id}', ${u.balance || 0})" class="bg-cyan-600 text-white px-3 py-1.5 rounded text-xs font-bold">Edit Balance</button>
                                <button onclick="toggleBlockUser('${docSnap.id}', ${u.isBlocked || false})" class="bg-red-600 text-white px-3 py-1.5 rounded text-xs font-bold">${u.isBlocked ? 'Unblock' : 'Block'}</button>
                            </div>
                        </div>
                    `;
                });
                document.getElementById('admin-stat-users').innerText = `${userCount} জন`;
            });
        }

        window.saveGlobalNotice = async function() {
            const val = document.getElementById('admin-notice-input').value;
            if (val) {
                await setDoc(doc(db, "settings", "global_notice"), { text: val });
                showToast('নোটিশ আপডেট হয়েছে!', 'success');
            }
        }

        window.approveGmail = async function(gmailId, userId) {
            try {
                await updateDoc(doc(db, "gmail_submissions", gmailId), { status: "approved" });
                const userRef = doc(db, "users", userId);
                const userSnap = await getDoc(userRef);
                await updateDoc(userRef, { balance: userSnap.data().balance + 20 });
                showToast('জিমেইল অ্যাপ্রুভড!', 'success');
            } catch(e) { showToast('সমস্যা: ' + e.message, 'error'); }
        }
        window.rejectGmail = async function(gmailId, userId) {
            await updateDoc(doc(db, "gmail_submissions", gmailId), { status: "rejected" });
            showToast('জিমেইল রিজেক্টেড।', 'info');
        }

        window.approveWithdrawal = async function(wthId) {
            await updateDoc(doc(db, "withdrawals", wthId), { status: "approved" });
            showToast('উইথড্র পেমেন্ট অ্যাপ্রুভড!', 'success');
        }

        window.editUserBalancePrompt = async function(userId, currentBal) {
            const newBal = prompt("নতুন ব্যালেন্স দিন:", currentBal);
            if (newBal !== null && !isNaN(newBal)) {
                await updateDoc(doc(db, "users", userId), { balance: parseFloat(newBal) });
                showToast('ব্যালেন্স আপডেট হয়েছে!', 'success');
            }
        }

        window.toggleBlockUser = async function(userId, currentStatus) {
            try {
                await updateDoc(doc(db, "users", userId), { isBlocked: !currentStatus });
                showToast(currentStatus ? 'ইউজার আনব্লক হয়েছে!' : 'ইউজার ব্লক হয়েছে!', 'success');
            } catch(e) { showToast('সমস্যা: ' + e.message, 'error'); }
        }

        window.showToast = function(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600' : (type === 'error' ? 'bg-red-600' : 'bg-cyan-600');
            toast.className = `${bgClass} text-white text-sm px-5 py-3 rounded-xl shadow-lg mb-2`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3000);
        }
    </script>
</body>
</html>
