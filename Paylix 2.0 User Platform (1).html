<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paylix 2.0 - Micro Tasking Platform</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Hind Siliguri', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Firebase SDK Compat v9 (Fixed for live hosting) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Inter', 'Hind Siliguri', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-panel { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .gradient-card { background: linear-gradient(135deg, #059669 0%, #0d9488 50%, #4f46e5 100%); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex justify-center items-start">

    <!-- TOAST NOTIFICATION -->
    <div id="toastContainer" class="fixed top-4 z-50 left-1/2 -translate-x-1/2 w-11/12 max-w-sm pointer-events-none flex flex-col space-y-2"></div>

    <!-- MAIN APP CONTAINER -->
    <div id="appContainer" class="w-full max-w-md min-h-screen bg-slate-900 border-x border-slate-800 relative flex flex-col justify-between shadow-2xl pb-20">

        <!-- HEADER -->
        <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 p-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-teal-400 flex items-center justify-center text-white text-xl font-black shadow-lg shadow-brand-500/20">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div>
                    <h1 class="font-black text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-brand-400 bg-clip-text text-transparent">Paylix 2.0</h1>
                    <p class="text-[10px] text-slate-400">মাইক্রো টাস্কিং প্ল্যাটফর্ম</p>
                </div>
            </div>
            <div id="headerActions"></div>
        </header>

        <!-- MAIN VIEW -->
        <main id="mainView" class="flex-1 p-4 overflow-y-auto"></main>

        <!-- BOTTOM NAV -->
        <nav id="bottomNav" class="hidden fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 px-4 py-2.5 z-40 flex justify-around items-center">
            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center text-brand-400">
                <i class="fa-solid fa-house text-lg mb-0.5"></i>
                <span class="text-[10px] font-bold">হোম</span>
            </button>
            <button onclick="switchTab('gmail')" id="nav-gmail" class="flex flex-col items-center text-slate-400 hover:text-brand-400">
                <i class="fa-solid fa-envelope text-lg mb-0.5"></i>
                <span class="text-[10px] font-bold">জিমেইল সেল</span>
            </button>
            <button onclick="switchTab('tasks')" id="nav-tasks" class="flex flex-col items-center text-slate-400 hover:text-brand-400">
                <i class="fa-solid fa-list-check text-lg mb-0.5"></i>
                <span class="text-[10px] font-bold">টাস্ক</span>
            </button>
            <button onclick="switchTab('withdraw')" id="nav-withdraw" class="flex flex-col items-center text-slate-400 hover:text-brand-400">
                <i class="fa-solid fa-wallet text-lg mb-0.5"></i>
                <span class="text-[10px] font-bold">উইথড্র</span>
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-slate-400 hover:text-brand-400">
                <i class="fa-solid fa-user text-lg mb-0.5"></i>
                <span class="text-[10px] font-bold">প্রোফাইল</span>
            </button>
        </nav>
    </div>

    <script>
        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyAtY87cMTIiJyXtpflfLiLfZfa7WX1g9Mg",
            authDomain: "paylix-586b1.firebaseapp.com",
            projectId: "paylix-586b1",
            storageBucket: "paylix-586b1.firebasestorage.app",
            messagingSenderId: "353074453470",
            appId: "1:353074453470:web:026fc4a6768eb6d9499b4f",
            databaseURL: "https://paylix-586b1-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        let currentUser = JSON.parse(localStorage.getItem('paylix_session_v2')) || null;
        let currentTab = 'dashboard';
        let allGmailsCache = {};
        let allUsersCache = {};

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const isSuccess = type === 'success';
            toast.className = `pointer-events-auto p-3.5 rounded-2xl shadow-xl flex items-center space-x-3 text-xs font-semibold text-white border bg-slate-800/95 ${isSuccess ? 'border-brand-500/40 text-emerald-300' : 'border-rose-500/40 text-rose-300'}`;
            toast.innerHTML = `<i class="fa-solid ${isSuccess ? 'fa-circle-check text-brand-400' : 'fa-circle-exclamation text-rose-400'} text-base"></i><span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initDatabase();
            if (!currentUser) renderAuthView();
            else renderUserApp();
        });

        function initDatabase() {
            db.ref('users').on('value', (snap) => {
                allUsersCache = snap.val() || {};
                if (currentUser && allUsersCache[currentUser.phone]) {
                    currentUser = allUsersCache[currentUser.phone];
                    localStorage.setItem('paylix_session_v2', JSON.stringify(currentUser));
                    if (['dashboard', 'profile'].includes(currentTab)) renderTabContent();
                }
            });

            db.ref('gmailSubmissions').on('value', (snap) => {
                allGmailsCache = snap.val() || {};
                if (currentTab === 'gmail') renderTabContent();
            });
        }

        function renderAuthView(isSignup = false) {
            document.getElementById('bottomNav').classList.add('hidden');
            document.getElementById('headerActions').innerHTML = '';
            document.getElementById('mainView').innerHTML = `
                <div class="py-6 space-y-6">
                    <div class="text-center space-y-2">
                        <div class="w-16 h-16 bg-gradient-to-tr from-brand-600 to-indigo-600 rounded-3xl mx-auto flex items-center justify-center text-3xl text-white shadow-xl shadow-brand-500/20">
                            <i class="fa-solid fa-user-check"></i>
                        </div>
                        <h2 class="text-2xl font-extrabold text-white">${isSignup ? 'নতুন অ্যাকাউন্ট খুলুন' : 'লগইন করুন'}</h2>
                        <p class="text-xs text-slate-400">Paylix 2.0 - সহজ ইনকাম প্ল্যাটফর্ম</p>
                    </div>

                    <div class="glass-panel p-6 rounded-3xl space-y-4 border border-slate-800">
                        ${isSignup ? `
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">আপনার নাম</label>
                                <input type="text" id="authName" placeholder="পূর্ণ নাম লিখুন" class="w-full bg-slate-900 border border-slate-700/80 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-brand-500">
                            </div>
                        ` : ''}
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">মোবাইল নম্বর</label>
                            <input type="tel" id="authPhone" placeholder="01XXXXXXXXX" class="w-full bg-slate-900 border border-slate-700/80 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-brand-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">পাসওয়ার্ড</label>
                            <input type="password" id="authPass" placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700/80 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-brand-500">
                        </div>
                        ${isSignup ? `
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">রেফারেল কোড (ঐচ্ছিক)</label>
                                <input type="text" id="authRef" placeholder="রেফার কোড থাকলে দিন" class="w-full bg-slate-900 border border-slate-700/80 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-brand-500">
                            </div>
                        ` : ''}

                        <button onclick="${isSignup ? 'handleSignup()' : 'handleUserLogin()'}" class="w-full bg-gradient-to-r from-brand-600 to-teal-600 hover:from-brand-500 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-brand-500/20 text-xs transition">
                            ${isSignup ? 'সাইন আপ অ্যাকাউন্ট' : 'লগইন করুন'}
                        </button>

                        <div class="text-center pt-2">
                            <button onclick="renderAuthView(${!isSignup})" class="text-xs text-brand-400 font-medium hover:underline">
                                ${isSignup ? 'ইতিমধ্যে অ্যাকাউন্ট আছে? লগইন করুন' : 'নতুন একাউন্ট করতে চান? সাইন আপ'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        async function handleSignup() {
            const name = document.getElementById('authName').value.trim();
            const phone = document.getElementById('authPhone').value.trim();
            const pass = document.getElementById('authPass').value.trim();
            const refCode = document.getElementById('authRef').value.trim();

            if (!name || !phone || !pass) return showToast('সবগুলো ফিল্ড পূরণ করুন!', 'error');
            if (phone.length < 11) return showToast('১১ ডিজিটের মোবাইল নম্বর দিন!', 'error');

            const userSnap = await db.ref('users/' + phone).once('value');
            if (userSnap.exists()) return showToast('এই নম্বরে ইতিমধ্যে অ্যাকাউন্ট আছে!', 'error');

            let referrerPhone = null;
            if (refCode) {
                for (let p in allUsersCache) {
                    if (allUsersCache[p].myRefCode === refCode) {
                        referrerPhone = p;
                        break;
                    }
                }
            }

            const newUser = {
                name: name,
                phone: phone,
                password: pass,
                balance: 0,
                totalEarned: 0,
                referralEarnings: 0,
                myRefCode: 'PLX-' + Math.floor(10000 + Math.random() * 90000),
                referredBy: referrerPhone || '',
                createdAt: new Date().toISOString()
            };

            await db.ref('users/' + phone).set(newUser);

            if (referrerPhone && allUsersCache[referrerPhone]) {
                const rUser = allUsersCache[referrerPhone];
                await db.ref('users/' + referrerPhone).update({
                    balance: (rUser.balance || 0) + 10,
                    referralEarnings: (rUser.referralEarnings || 0) + 10
                });
            }

            currentUser = newUser;
            localStorage.setItem('paylix_session_v2', JSON.stringify(currentUser));
            showToast('অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে!');
            renderUserApp();
        }

        async function handleUserLogin() {
            const phone = document.getElementById('authPhone').value.trim();
            const pass = document.getElementById('authPass').value.trim();

            if (!phone || !pass) return showToast('নম্বর ও পাসওয়ার্ড দিন!', 'error');

            const snap = await db.ref('users/' + phone).once('value');
            if (!snap.exists()) return showToast('অ্যাকাউন্ট পাওয়া যায়নি!', 'error');

            const userVal = snap.val();
            if (userVal.password !== pass) return showToast('ভুল পাসওয়ার্ড!', 'error');

            currentUser = userVal;
            localStorage.setItem('paylix_session_v2', JSON.stringify(currentUser));
            showToast('লগইন সফল হয়েছে!');
            renderUserApp();
        }

        function handleUserLogout() {
            currentUser = null;
            localStorage.removeItem('paylix_session_v2');
            showToast('লগআউট করা হয়েছে');
            renderAuthView();
        }

        function renderUserApp() {
            document.getElementById('bottomNav').classList.remove('hidden');
            document.getElementById('headerActions').innerHTML = `
                <button onclick="handleUserLogout()" class="w-8 h-8 rounded-xl bg-slate-800 text-slate-400 border border-slate-700 flex items-center justify-center hover:bg-rose-500/20 hover:text-rose-400">
                    <i class="fa-solid fa-power-off text-xs"></i>
                </button>
            `;
            switchTab(currentTab);
        }

        function switchTab(tabName) {
            currentTab = tabName;
            ['dashboard', 'gmail', 'tasks', 'withdraw', 'profile'].forEach(t => {
                const btn = document.getElementById('nav-' + t);
                if (btn) {
                    btn.className = t === tabName ? "flex flex-col items-center text-brand-400" : "flex flex-col items-center text-slate-400 hover:text-brand-400";
                }
            });
            renderTabContent();
        }

        function renderTabContent() {
            const view = document.getElementById('mainView');
            if (currentTab === 'dashboard') renderDashboardTab(view);
            else if (currentTab === 'gmail') renderGmailTab(view);
            else if (currentTab === 'tasks') renderTasksTab(view);
            else if (currentTab === 'withdraw') renderWithdrawTab(view);
            else if (currentTab === 'profile') renderProfileTab(view);
        }

        function renderDashboardTab(container) {
            container.innerHTML = `
                <div class="space-y-5">
                    <div class="gradient-card p-6 rounded-3xl text-white shadow-xl relative overflow-hidden">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <span class="text-xs text-emerald-100 font-medium">বর্তমান ব্যালেন্স</span>
                                <h2 class="text-3xl font-black mt-0.5 tracking-tight">৳ ${(currentUser.balance || 0).toFixed(2)}</h2>
                            </div>
                            <span class="bg-white/20 px-3 py-1 rounded-full text-[10px] font-bold">এক্টিভ অ্যাকাউন্ট</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 pt-4 border-t border-white/20 text-xs">
                            <div class="bg-black/10 p-2.5 rounded-2xl">
                                <span class="text-[10px] text-emerald-100 block">মোট আর্নিং</span>
                                <span class="font-black text-sm">৳ ${(currentUser.totalEarned || 0).toFixed(2)}</span>
                            </div>
                            <div class="bg-black/10 p-2.5 rounded-2xl">
                                <span class="text-[10px] text-emerald-100 block">রেফার বোনাস</span>
                                <span class="font-black text-sm">৳ ${(currentUser.referralEarnings || 0).toFixed(2)}</span>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="switchTab('gmail')" class="glass-panel p-4 rounded-2xl text-left border border-slate-800 hover:border-brand-500/50">
                            <i class="fa-solid fa-envelope text-brand-400 text-2xl mb-2"></i>
                            <h4 class="font-bold text-xs text-white">জিমেইল সেল</h4>
                            <p class="text-[10px] text-slate-400">প্রতিটি ফিক্সড ৳২০</p>
                        </button>
                        <button onclick="switchTab('withdraw')" class="glass-panel p-4 rounded-2xl text-left border border-slate-800 hover:border-indigo-500/50">
                            <i class="fa-solid fa-wallet text-indigo-400 text-2xl mb-2"></i>
                            <h4 class="font-bold text-xs text-white">উইথড্র</h4>
                            <p class="text-[10px] text-slate-400">বিকাশ ও নগদ</p>
                        </button>
                    </div>

                    <div class="glass-panel p-5 rounded-3xl border border-slate-800 space-y-3">
                        <h3 class="font-bold text-xs text-white">রেফার কোড: <span class="text-brand-400 font-mono">${currentUser.myRefCode}</span></h3>
                        <p class="text-[11px] text-slate-400">বন্ধুদের রেফার করে প্রতি সাইনআপে ১০ টাকা বোনাস পান।</p>
                    </div>
                </div>
            `;
        }

        function renderGmailTab(container) {
            container.innerHTML = `
                <div class="space-y-5">
                    <div class="bg-slate-900 p-5 rounded-3xl border border-brand-500/30">
                        <h2 class="text-base font-black text-white">জিমেইল সেল করুন (৳২০)</h2>
                        <p class="text-xs text-slate-400 mt-1">সঠিক পাসওয়ার্ডসহ জিমেইল জমা দিন। অ্যাডমিন ভেরিফাই করলে ২০ টাকা ব্যালেন্স যোগ হবে।</p>
                    </div>

                    <div class="glass-panel p-5 rounded-3xl border border-slate-800 space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">জিমেইল এড্রেস</label>
                            <input type="email" id="gmailAddress" placeholder="example@gmail.com" class="w-full bg-slate-900 border border-slate-700 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-brand-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">পাসওয়ার্ড</label>
                            <input type="text" id="gmailPassword" placeholder="জিমেইলের পাসওয়ার্ড" class="w-full bg-slate-900 border border-slate-700 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-brand-500">
                        </div>
                        <button onclick="handleGmailSubmit()" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3.5 rounded-2xl text-xs transition">
                            সাবমিট করুন (৳২০)
                        </button>
                    </div>

                    <div class="glass-panel p-5 rounded-3xl border border-slate-800 space-y-3">
                        <h3 class="font-bold text-xs text-white">আপনার জমাকৃত জিমেইল ইতিহাস</h3>
                        <div class="space-y-2">${getUserGmailListHtml()}</div>
                    </div>
                </div>
            `;
        }

        function getUserGmailListHtml() {
            let userItems = [];
            for (let id in allGmailsCache) {
                if (allGmailsCache[id].userPhone === currentUser.phone) userItems.push(allGmailsCache[id]);
            }
            if (userItems.length === 0) return `<p class="text-xs text-slate-500 text-center py-3">কোনো জিমেইল সাবমিট করা হয়নি</p>`;
            return userItems.map(item => `
                <div class="bg-slate-900 p-3 rounded-2xl border border-slate-800 flex justify-between items-center text-xs">
                    <div>
                        <span class="font-bold text-slate-200 block">${item.email}</span>
                        <span class="text-[10px] text-slate-500">${item.date}</span>
                    </div>
                    <span class="px-2 py-0.5 rounded-lg text-[10px] font-bold ${
                        item.status === 'approved' ? 'bg-brand-500/20 text-brand-400' : 
                        (item.status === 'rejected' ? 'bg-rose-500/20 text-rose-400' : 'bg-amber-500/20 text-amber-400')
                    }">
                        ${item.status === 'approved' ? 'গৃহীত (৳২০)' : (item.status === 'rejected' ? 'বাতিল' : 'পেন্ডিং')}
                    </span>
                </div>
            `).join('');
        }

        async function handleGmailSubmit() {
            const email = document.getElementById('gmailAddress').value.trim();
            const pass = document.getElementById('gmailPassword').value.trim();

            if (!email || !pass) return showToast('ইমেইল ও পাসওয়ার্ড দুইটিই দিন!', 'error');
            if (!email.toLowerCase().endsWith('@gmail.com')) return showToast('সঠিক @gmail.com দিন!', 'error');

            const gId = 'GM-' + Date.now();
            await db.ref('gmailSubmissions/' + gId).set({
                id: gId,
                userPhone: currentUser.phone,
                userName: currentUser.name,
                email: email,
                pass: pass,
                status: 'pending',
                date: new Date().toLocaleString('bn-BD')
            });

            showToast('জিমেইল সাবমিট সফল হয়েছে!');
            document.getElementById('gmailAddress').value = '';
            document.getElementById('gmailPassword').value = '';
        }

        function renderTasksTab(container) {
            container.innerHTML = `
                <div class="space-y-4">
                    <div class="glass-panel p-4 rounded-2xl border border-slate-800 flex items-center justify-between">
                        <div>
                            <h4 class="font-bold text-xs text-white">টেলিগ্রাম চ্যানেল</h4>
                            <p class="text-[10px] text-slate-400">পুরস্কার: ৳৫</p>
                        </div>
                        <a href="https://t.me/paylix_official" target="_blank" class="bg-sky-600 text-white font-bold text-xs px-3 py-1.5 rounded-xl">জয়েন</a>

        function renderWithdrawTab(container) {
            container.innerHTML = `

                        <h2 class="font-bold text-sm text-white">টাকা উইথড্র করুন</h2>

                        </div>

                            <input type="number" id="wdAmount" placeholder="100" class="w-full bg-slate-900 border border-slate-700 rounded-2xl px-4 py-3 text-xs text-white">
                        </div>

            `;
        }

        async function handleWithdrawRequest() {
            const method = document.getElementById('wdMethod').value;
            const account = document.getElementById('wdAccount').value.trim();
            const amount = parseFloat(document.getElementById('wdAmount').value);

            if (!account || isNaN(amount)) return showToast('সব তথ্য সঠিক দিন!', 'error');
            if (amount < 100) return showToast('সর্বনিম্ন উইথড্র ১০০ টাকা!', 'error');
            if (currentUser.balance < amount) return showToast('পর্যাপ্ত ব্যালেন্স নেই!', 'error');

            const reqId = 'WD-' + Date.now();
            await db.ref('users/' + currentUser.phone).update({ balance: currentUser.balance - amount });
            await db.ref('withdrawRequests/' + reqId).set({
                id: reqId,
                userPhone: currentUser.phone,
                userName: currentUser.name,
                method: method,
                account: account,
                amount: amount,
                netAmount: amount * 0.8,
                status: 'pending',
                date: new Date().toLocaleString('bn-BD')
            });

            showToast('উইথড্র রিকোয়েস্ট সফল হয়েছে!');
            switchTab('dashboard');
        }
